<script data-prototype-owned data-proto-hotspot-bootstrap data-proto-review="hotspots">
/* 点击空白时短暂提示本次需求范围内的真实交互；未声明范围时不扫描整页。 */
(() => {
    'use strict';
    if (window.ProtoHotspots) return;
    const DURATION = 2000, MAX_HINTS = 80;
    const COLORS = { fill: '#ff9f29' };
    const EVENTS = new Set(['click', 'pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchend']);
    const EDITABLE = 'input,textarea,select,[contenteditable]:not([contenteditable="false"])';
    const BLOCKED = '[hidden],[inert],[aria-hidden="true"],[aria-disabled="true"],[data-proto-hotspot="false"]';
    const CONTROL_TAGS = new Set(['BUTTON', 'A', 'AREA', 'INPUT', 'SELECT', 'TEXTAREA', 'SUMMARY']);
    const CONTROL_ROLES = new Set(['button', 'link', 'checkbox', 'radio', 'switch', 'tab', 'menuitem', 'option', 'combobox', 'slider', 'textbox']);
    const owned = el => !!el?.closest?.('[data-prototype-owned],.__review_pin,.__review_pop,.__review_guide');
    let options = {}, layer, style, observer, timer = 0, frame = 0, started = 0, down = null;
    const boxes = new Map();

    // 先于业务脚本载入：只记录实际绑定，不运行任何按钮来试探功能。
    const listeners = new WeakMap();
    const nativeAdd = EventTarget.prototype.addEventListener, nativeRemove = EventTarget.prototype.removeEventListener;
    const captureOf = config => typeof config === 'boolean' ? config : !!config?.capture;
    EventTarget.prototype.addEventListener = function (type, listener, config) {
        if (!EVENTS.has(type) || !listener || typeof listener !== 'function' && typeof listener.handleEvent !== 'function')
            return nativeAdd.call(this, type, listener, config);
        let entries = listeners.get(this);
        if (!entries) { entries = new Set(); listeners.set(this, entries); }
        const capture = captureOf(config);
        const existing = [...entries].find(entry => entry.type === type && entry.listener === listener && entry.capture === capture && !entry.signal?.aborted);
        if (existing) return nativeAdd.call(this, type, existing.wrapper, config);
        const entry = { type, listener, capture, once: !!config?.once, signal: config?.signal };
        entry.wrapper = function (event) {
            if (entry.once) { entries.delete(entry); schedule(); }
            return typeof listener === 'function' ? listener.call(this, event) : listener.handleEvent.call(listener, event);
        };
        const result = nativeAdd.call(this, type, entry.wrapper, config);
        if (!entry.signal?.aborted) {
            entries.add(entry);
            if (entry.signal) nativeAdd.call(entry.signal, 'abort', () => { entries.delete(entry); schedule(); }, { once: true });
            schedule();
        }
        return result;
    };
    EventTarget.prototype.removeEventListener = function (type, listener, config) {
        const entries = listeners.get(this), capture = captureOf(config);
        const entry = entries && [...entries].find(item => item.type === type && item.listener === listener && item.capture === capture);
        if (!entry) return nativeRemove.call(this, type, listener, config);
        const result = nativeRemove.call(this, type, entry.wrapper, config);
        entries.delete(entry); schedule(); return result;
    };

    function binding(el) {
        if ([...EVENTS].some(type => typeof el['on' + type] === 'function')) return true;
        const reactRoot = Object.keys(el).some(key => key.startsWith('__reactContainer$'));
        if (!reactRoot && [...(listeners.get(el) || [])].some(entry => !entry.signal?.aborted)) return true;
        // React 的点击监听由根节点代理，真实业务回调在元素 props 上。
        const props = Object.keys(el).find(key => key.startsWith('__reactProps$'));
        return !!props && Object.entries(el[props] || {}).some(([key, value]) =>
            /^on(Click|PointerDown|PointerUp|MouseDown|MouseUp|TouchEnd)(Capture)?$/.test(key) && typeof value === 'function');
    }
    function navigation(el) {
        if (!el.matches('a[href],area[href]')) return false;
        const href = el.getAttribute('href').trim();
        if (!href || href === '#' || /^javascript:/i.test(href)) return false;
        if (href.startsWith('#')) {
            let id; try { id = decodeURIComponent(href.slice(1)); } catch (_) { return false; }
            return !!document.getElementById(id) || !!document.getElementsByName(id).length;
        }
        return true;
    }
    function nativeAction(el) {
        if (el.matches('select,input[type="checkbox"],input[type="radio"],input[type="file"],input[type="color"],input[type="range"]')) return true;
        if (el.tagName === 'SUMMARY') return el.parentElement?.tagName === 'DETAILS' && el.parentElement.querySelector('summary') === el;
        if (el.matches('button,input') && el.form) return el.type === 'submit' || el.type === 'reset';
        return false;
    }

    function enabled() {
        try { return typeof options.isEnabled === 'function' ? !!options.isEnabled() : options.enabled !== false; }
        catch (_) { return false; }
    }
    function action(el) {
        if (!(el instanceof Element) || el === document.body || el === document.documentElement || owned(el) || el.closest(BLOCKED) || el.matches(':disabled')) return false;
        return el.dataset.protoHotspot === 'true' || binding(el) || navigation(el) || nativeAction(el);
    }
    function controlLike(el) {
        return CONTROL_TAGS.has(el.tagName) && !(el.tagName === 'INPUT' && el.type === 'hidden')
            || CONTROL_ROLES.has(el.getAttribute('role')) || el.dataset.protoHotspot === 'true';
    }
    function controlIssue(el) {
        // 仅截图专用运行时中用户手动画出的矩形可使用自定尺寸。
        if (window.ProtoScreenshot && el.parentElement?.id === 'screenshot-regions' && el.classList.contains('screenshot-region')) return null;
        // 事件代理容器不能替代实际操作节点，未授权的子控件也不能让父容器整块高亮。
        if (!CONTROL_TAGS.has(el.tagName) && [...el.querySelectorAll('*')].some(child =>
            !owned(child) && (controlLike(child) || action(child)))) return 'container';
        const rect = el.getBoundingClientRect();
        // 长而矮的整行按钮可保留；高且大面积的卡片 / 面板需拆到具体控件。
        if (rect.height > 96 && rect.width * rect.height > Math.min(64000, innerWidth * innerHeight * .12)) return 'oversized';
        return null;
    }
    function currentScope() {
        try { return typeof options.scope === 'function' ? options.scope() : options.scope; }
        catch (_) { return null; }
    }
    function inScope(el, scope = currentScope()) {
        if (scope?.mode === 'all') return true;
        if (scope?.mode !== 'targets' || !Array.isArray(scope.protoIds)) return false;
        // 范围只授权该控件自身；容器标注不授权内部的历史交互。
        return scope.protoIds.includes(el.getAttribute('data-proto-id'));
    }
    function hitAction(target) {
        if (currentScope()?.manualTargets?.length && scan().some(item => item.source === 'manual' && item.status === 'ready' && item.el.contains(target))) return true;
        for (let el = target instanceof Element ? target : target?.parentElement; el && el !== document.documentElement; el = el.parentElement)
            if ((controlLike(el) || action(el)) && !controlIssue(el) && rectFor(el)) return true;
        return false;
    }
    function rectFor(el) {
        if (!el?.isConnected || owned(el) || el.closest(BLOCKED) || el.matches(':disabled')) return null;
        const original = el.getBoundingClientRect();
        let left = Math.max(0, original.left), top = Math.max(0, original.top);
        let right = Math.min(innerWidth, original.right), bottom = Math.min(innerHeight, original.bottom);
        for (let node = el; node && node !== document.documentElement; node = node.parentElement) {
            const css = getComputedStyle(node);
            if (css.display === 'none' || css.visibility === 'hidden' || Number(css.opacity) === 0) return null;
            if (node === el) continue;
            const clip = node.getBoundingClientRect();
            if (/hidden|clip|auto|scroll/.test(css.overflowX)) { left = Math.max(left, clip.left); right = Math.min(right, clip.right); }
            if (/hidden|clip|auto|scroll/.test(css.overflowY)) { top = Math.max(top, clip.top); bottom = Math.min(bottom, clip.bottom); }
        }
        if (right - left < 4 || bottom - top < 4) return null;
        if ((right - left) * (bottom - top) > innerWidth * innerHeight * .65 && !(window.ProtoScreenshot && el.parentElement?.id === 'screenshot-regions')) return null;
        const points = [[.5, .5], [.2, .2], [.8, .8]];
        if (!points.some(([x, y]) => {
            const hit = document.elementFromPoint(left + (right - left) * x, top + (bottom - top) * y);
            return hit === el || !!hit && el.contains(hit);
        })) return null;
        return { left, top, right, bottom };
    }
    function examine(el, manual = false) {
        if (owned(el) || el.closest('[data-proto-hotspot="false"]')) return { status: 'excluded' };
        if (el.matches(':disabled') || el.closest('[inert],[aria-disabled="true"]')) return { status: 'disabled' };
        for (let node = el; node && node !== document.documentElement; node = node.parentElement) {
            const css = getComputedStyle(node);
            if (node.matches('[hidden],[aria-hidden="true"]') || css.display === 'none' || css.visibility === 'hidden' || Number(css.opacity) === 0)
                return { status: 'hidden' };
        }
        if (/^(SCRIPT|STYLE|LINK|META|OPTION|OPTGROUP|PATH|SVG)$/.test(el.tagName)) return { status: 'unsupported' };
        const issue = controlIssue(el);
        if (issue) return { status: issue };
        if (!manual && !action(el)) return { status: 'no-action' };
        const bounds = el.getBoundingClientRect();
        if (!bounds.width || !bounds.height) return { status: 'hidden' };
        if (bounds.bottom <= 0 || bounds.top >= innerHeight || bounds.right <= 0 || bounds.left >= innerWidth) return { status: 'offscreen' };
        const rect = rectFor(el);
        return rect ? { status: 'ready', rect } : { status: 'occluded' };
    }
    function scan(scope = currentScope()) {
        const elements = [...document.querySelectorAll('body *')], byId = new Map();
        for (const el of elements) {
            const id = el.getAttribute('data-proto-id');
            if (id) { if (!byId.has(id)) byId.set(id, []); byId.get(id).push(el); }
        }
        const anchorFor = el => {
            if (window.ProtoAnchors) {
                const A = window.ProtoAnchors;
                return { protoId: el.getAttribute('data-proto-id') || '', selector: A.selector(el), tag: el.tagName.toLowerCase(), text: A.text(el), parentText: A.text(el.parentElement) };
            }
            return { protoId: el.getAttribute('data-proto-id') || '', selector: el.id ? '#' + CSS.escape(el.id) : '', tag: el.tagName.toLowerCase() };
        };
        const resolve = anchor => {
            if (anchor?.protoId) { const hits = byId.get(anchor.protoId) || []; return hits.length === 1 ? hits[0] : null; }
            if (window.ProtoAnchors) return window.ProtoAnchors.resolveHidden(anchor);
            try { const hits = [...document.querySelectorAll(anchor?.selector || ':not(*)')]; return hits.length === 1 ? hits[0] : null; } catch (_) { return null; }
        };
        let entries = [];
        if (scope?.mode === 'targets' && Array.isArray(scope.protoIds)) {
            entries = scope.protoIds.map(protoId => {
                const hits = byId.get(protoId) || [];
                const base = { protoId, key: 'proto:' + protoId, source: 'declared', anchor: { protoId } };
                if (hits.length !== 1) return { ...base, status: hits.length ? 'duplicate' : 'missing' };
                return { ...base, el: hits[0], label: labelFor(hits[0]), anchor: anchorFor(hits[0]), ...examine(hits[0]) };
            });
        } else if (scope?.mode === 'all') {
            entries = elements.filter(el => action(el)).map(el => ({
                protoId: el.getAttribute('data-proto-id') || el.id || el.tagName.toLowerCase(), source: 'automatic',
                anchor: anchorFor(el), label: labelFor(el), key: 'all:' + (el.getAttribute('data-proto-id') || el.id || anchorFor(el).selector), el, ...examine(el)
            }));
        }
        for (const target of scope?.manualTargets || []) {
            const el = resolve(target.anchor);
            const existing = el && entries.find(item => item.el === el);
            if (existing) entries = entries.filter(item => item !== existing);
            entries.push({ ...target, key: 'manual:' + target.id, source: 'manual', protoId: target.anchor.protoId || target.id, el,
                ...(el ? examine(el, true) : { status: target.anchor.protoId && (byId.get(target.anchor.protoId)?.length || 0) > 1 ? 'duplicate' : 'missing' }) });
        }
        const excluded = (scope?.excludedTargets || []).map(target => resolve(target.anchor)).filter(Boolean);
        for (const item of entries) if (item.el && excluded.includes(item.el)) item.status = 'excluded';
        const ready = entries.filter(item => item.status === 'ready');
        let count = 0;
        for (const item of ready) {
            if (ready.some(other => other.el !== item.el && item.el.contains(other.el))) item.status = 'contains-target';
            else if (++count > MAX_HINTS) item.status = 'limit';
        }
        return entries;
    }
    function labelFor(el) { return (el.getAttribute('aria-label') || el.getAttribute('title') || el.textContent || el.value || el.tagName).replace(/\s+/g, ' ').trim().slice(0, 120); }
    function candidate(el) { return el instanceof Element ? { ...examine(el, true), label: labelFor(el) } : { status: 'missing' }; }
    // 只读诊断，不执行点击、不展开页面，也不修改 PRD / 提示配置。
    function inspect() {
        const scope = currentScope();
        return { mode: scope?.mode || 'off', enabled: enabled(), items: scan(scope).map(({ el, ...item }) => item) };
    }
    function position(box, rect) {
        box.style.left = Math.max(0, rect.left - 3) + 'px';
        box.style.top = Math.max(0, rect.top - 3) + 'px';
        box.style.width = Math.min(innerWidth, rect.right + 3) - Math.max(0, rect.left - 3) + 'px';
        box.style.height = Math.min(innerHeight, rect.bottom + 3) - Math.max(0, rect.top - 3) + 'px';
    }
    function hide() {
        clearTimeout(timer); timer = 0;
        cancelAnimationFrame(frame); frame = 0;
        boxes.clear(); layer?.replaceChildren();
    }
    function refresh() {
        frame = 0;
        if (!enabled()) { hide(); return; }
        const ready = new Map(scan().filter(item => item.status === 'ready').map(item => [item.el, item.rect]));
        for (const [el, box] of boxes) {
            const rect = ready.get(el);
            if (!rect) { box.remove(); boxes.delete(el); }
            else position(box, rect);
        }
    }
    function schedule() {
        if (boxes.size && !frame) frame = requestAnimationFrame(refresh);
    }
    function show() {
        if (!layer || !enabled()) { hide(); return 0; }
        const scope = currentScope();
        if (scope?.mode !== 'all' && (scope?.mode !== 'targets' || !scope.protoIds?.length && !scope.manualTargets?.length)) { hide(); return 0; }
        if (boxes.size && performance.now() - started < DURATION) { refresh(); return boxes.size; }
        hide();
        for (const { el, rect } of scan(scope).filter(item => item.status === 'ready')) {
            const box = document.createElement('div');
            box.className = 'ph-box'; box.setAttribute('data-prototype-owned', '');
            box.dataset.hotspotFor = el.getAttribute('data-proto-id') || el.id || el.tagName.toLowerCase();
            position(box, rect); layer.appendChild(box); boxes.set(el, box);
        }
        if (boxes.size) { started = performance.now(); timer = setTimeout(hide, DURATION); }
        return boxes.size;
    }
    function pointerDown(event) { down = { x: event.clientX, y: event.clientY, moved: false }; }
    function pointerMove(event) {
        if (down && Math.hypot(event.clientX - down.x, event.clientY - down.y) > 8) down.moved = true;
    }
    function click(event) {
        const drag = down?.moved; down = null;
        const target = event.target instanceof Element ? event.target : event.target?.parentElement;
        if (!enabled() || owned(target) || hitAction(target)) { hide(); return; }
        if (event.defaultPrevented || event.button !== 0 || event.detail === 0 || drag || target?.closest(EDITABLE) || String(getSelection()).trim()) return;
        show();
    }
    function mutations(records) {
        if (!boxes.size) return;
        for (const record of records) {
            if (owned(record.target)) continue;
            if (record.type === 'attributes' && /data-proto-(page|state)/.test(record.attributeName)) { hide(); return; }
            if (record.type === 'childList' && [...record.addedNodes, ...record.removedNodes].every(node => node instanceof Element && owned(node))) continue;
            schedule(); break;
        }
    }
    function init(config = {}) {
        options = config;
        if (layer) { hide(); return window.ProtoHotspots; }
        style = document.createElement('style'); style.setAttribute('data-prototype-owned', '');
        style.textContent = `
.ph-layer{--ph-fill:${COLORS.fill};--ph-opacity-low:.18;--ph-opacity-high:.42;--ph-opacity-still:.3;position:fixed;inset:0;z-index:2147481000;border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;pointer-events:none!important;overflow:hidden;}
.ph-layer .ph-box{position:absolute;box-sizing:border-box;margin:0;padding:0;border:0!important;outline:0!important;border-radius:6px;background:var(--ph-fill);box-shadow:none!important;pointer-events:none!important;opacity:var(--ph-opacity-still);animation:ph-discover ${DURATION}ms cubic-bezier(.4,0,.2,1) 1 forwards;}
@keyframes ph-discover{0%{opacity:var(--ph-opacity-low)}20%{opacity:var(--ph-opacity-high)}45%{opacity:var(--ph-opacity-low)}70%{opacity:var(--ph-opacity-high)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.ph-layer .ph-box{animation:none;opacity:var(--ph-opacity-still)}}
`;
        layer = document.createElement('div'); layer.className = 'ph-layer';
        layer.setAttribute('data-prototype-owned', ''); layer.setAttribute('aria-hidden', 'true');
        (document.head || document.documentElement).appendChild(style); document.documentElement.appendChild(layer);
        document.addEventListener('pointerdown', pointerDown, true);
        document.addEventListener('pointermove', pointerMove, true);
        document.addEventListener('pointercancel', hide, true);
        document.addEventListener('click', click);
        document.addEventListener('scroll', schedule, true);
        window.addEventListener('resize', schedule);
        window.addEventListener('pagehide', hide);
        observer = new MutationObserver(mutations);
        observer.observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['style', 'class', 'hidden', 'inert', 'disabled', 'aria-hidden', 'aria-disabled', 'role', 'onclick', 'href', 'type', 'data-proto-id', 'data-proto-hotspot', 'data-proto-state', 'data-proto-page'] });
        return window.ProtoHotspots;
    }
    function destroy() {
        hide(); observer?.disconnect(); observer = null;
        document.removeEventListener('pointerdown', pointerDown, true);
        document.removeEventListener('pointermove', pointerMove, true);
        document.removeEventListener('pointercancel', hide, true);
        document.removeEventListener('click', click);
        document.removeEventListener('scroll', schedule, true);
        window.removeEventListener('resize', schedule); window.removeEventListener('pagehide', hide);
        layer?.remove(); style?.remove(); layer = null; style = null; down = null;
    }
    window.ProtoHotspots = { init, show, hide, destroy, inspect, candidate };
})();

</script>

    <script src="report-data.js"></script>
    <script>
    /* ════════════════════════════════════════════════════════════════
       grade-report.html · 年级报告（R2 已退役；仅 R4 组长保留完整年级全量视角）
       - teacher → 重定向 class-report.html#m8「年级定位与对标」
       - leader  → R4 组长年级报告（模块 1~8，异常导向 + 教研落点）
       - 全部为演示 mock；教师版只下发匿名聚合（「年级最优班」不露班名/教师名）
       ════════════════════════════════════════════════════════════════ */
    (function () {
        'use strict';
        var LEAD = RP_PARAMS.role === 'leader';
        /* 教师不再渲染独立 R2：独立链接、旧收藏与导出源链接统一回到整合班级报告 m8。
           srcdoc 嵌入态不能改写 about:srcdoc，改通知宿主切换班级视图并携带锚点。 */
        if (!LEAD) {
            if (typeof window.__RPQ === 'string' && window.__RPQ) {
                try { window.parent.postMessage({ type: 'rp-nav', to: 'class', hw: RP_PARAMS.hw, cls: RP_PARAMS.cls, role: 'teacher', anchor: 'm8' }, '*'); } catch (e) { }
            } else {
                var rq = new URLSearchParams(location.search);
                rq.delete('role');
                rq.set('cls', RP_PARAMS.cls);
                rq.set('anchor', 'm8');
                if (rq.has('page')) rq.set('page', 'class-report.html');
                location.replace('class-report.html?' + rq.toString() + '#m8');
            }
            return;
        }
        var G = rpGradeMetrics();
        /* 「我的班」：教师角色用 ?cls=（默认 71，演示教师所带班）；组长不锁定班级 */
        var MY = RP_CLASSES.find(function (c) { return c.cls === RP_PARAMS.cls && c.status === 'reviewed'; })
            || RP_CLASSES.find(function (c) { return c.status === 'reviewed'; });
        var MM = MY ? rpMetrics(MY.cls) : null;
        var RK = MY ? rpRank(MY.cls) : null;
        var BEST = RP_BEST;
        /* 页面级 UI 状态：模块 3 的「三线图 ↔ 全量逐题明细」tab；知识点维度（同步 / 复习…，各维度独立统计） */
        var UI = { g2Tab: 'chart', kpDim: RP_KP_DIM_DEFAULT };

        function mod(id, no, title, sub, aside, body, opt) {
            opt = opt || {};
            return '<section class="mod" id="' + id + '">'
                + (opt.prd ? '<span class="prd-badge" data-prd="' + opt.prd + '" title="查看 PRD ' + opt.prd + '：' + rpEsc(title) + '">' + opt.prd + '</span>' : '')
                + '<div class="mod-h"><span class="mod-no">' + no + '</span>'
                + '<span class="mod-title">' + rpEsc(title) + (opt.star ? ' <span class="star">' + rpStar() + '</span>' : '') + '</span>'
                + (sub ? '<span class="mod-sub">' + rpEsc(sub) + '</span>' : '')
                + (opt.help ? opt.help : '')
                + (aside ? '<div class="mod-aside">' + aside + '</div>' : '')
                + '</div><div class="mod-b' + (opt.tight ? ' tight' : '') + '">' + body + '</div></section>';
        }
        function pp(v) {
            if (v == null) return '—';
            return '<span class="' + (v > 0 ? 'up' : (v < 0 ? 'dn' : '')) + '">' + rpPp(v) + '</span>';
        }
        function diffCls(v) { return v == null ? '' : (v > 0 ? 'up' : (v < 0 ? 'dn' : '')); }
        function kpName(id) { return (RP_KPS.find(function (k) { return k.id === id; }) || {}).n || id; }
        function causeName(id) { return (RP_CAUSES.find(function (x) { return x.id === id; }) || {}).n || id; }

        /* ── 知识点维度：切换控件 + 维度说明条（与班级报告同构，两页观感一致） ── */
        function dimName() { return rpDim(UI.kpDim).n; }
        function kpDimAside() {
            return '<span class="kp-dim"><span class="kp-dim-lb">知识点维度</span>'
                + '<span class="seg" role="tablist" aria-label="知识点维度切换">'
                + RP_KP_DIMS.map(function (d) {
                    return '<button type="button" class="' + (UI.kpDim === d.id ? 'on' : '') + '" data-kpdim="' + d.id
                        + '" role="tab" aria-selected="' + (UI.kpDim === d.id) + '" title="' + rpEsc(d.n + '：' + d.desc + '（独立统计）') + '">'
                        + rpEsc(d.n) + '</button>';
                }).join('') + '</span>'
                + '<span class="kp-dim-cur">' + rpEsc(dimName()) + '</span></span>';
        }
        function dimLine(extra) {
            return '<div class="dim-line">知识点维度：<b>' + rpEsc(dimName()) + '</b>'
                + '<span class="dim-why">' + rpEsc(rpKpsOfDim(UI.kpDim).length + ' 个知识点，各维度独立统计、不跨维度合并')
                + (extra ? '；' + rpEsc(extra) : '') + '</span></div>';
        }

        /* ══════════════════════ 页面操作（挂在锚点导航右侧，替代原报告头） ══════════════════════ */
        /* 页面操作：导出不再直接 window.print()，打开 export-grade.html 导出壳页（可调版的 HTML），由壳页再另存为 PDF */
        function headActions() {
            return '<button class="rp-btn primary" data-act="print">导出 / 打印</button>';
        }

        /* ══════════════════════ G1 / H1 · 年级概览 ══════════════════════
           5 卡固定顺序：年级平均分 → 年级得分率 → 优秀率 → 及格率 → 低分率；
           平均分与得分率是同一水平的两套单位（分 / %），并列前两卡，主卡落在平均分上；
           年级页没有「年级 vs 年级」的比法，副标改用可核对的基准（满分 / 标准差 / 档位线），
           不虚构对比对象；提交率与有效样本仍降级为卡下小注行（.kpi-foot） */
        function gradeKpi() {
            var gSc = rpScoreOf(G.mean);
            function card(lb, val, ref, cls2) {
                return '<div class="kpi' + (cls2 ? ' ' + cls2 : '') + '"><div class="k-lb">' + lb + '</div>'
                    + '<div class="k-v">' + val + '</div><div class="k-ref">' + ref + '</div></div>';
            }
            return '<div class="kpi-grid five m1-kpi">'
                + card('年级平均分<span class="k-lb-note">满分 ' + rpFullScore() + '</span>', gSc.toFixed(1) + '<small> 分</small>', '折算自得分率 ' + G.mean + '%', 'hero')
                + card('年级得分率', G.mean + '<small>%</small>', '标准差 ' + G.sd + 'pp')
                + card('优秀率', G.exRate + '<small>%</small>', RP_TIERS[0].rule())
                + card('及格率', G.passRate + '<small>%</small>', RP_TIERS[2].rule())
                + card('低分率', G.lowRate + '<small>%</small>', RP_TIERS[3].rule(), G.lowRate > RP_CONFIG.lowWarn ? 'warn' : '')
                + '</div>'
                + '<div class="kpi-foot"><span>提交率 <b>' + G.subRate + '%</b>（应交 ' + G.total + ' / 实交 ' + G.submitted + '）</span>'
                + '<span>有效样本 <b>' + G.valid + ' 人</b>（已批阅 ' + G.reviewedCount + ' / ' + G.clsCount + ' 班）</span></div>';
        }
        /* ══════════════════════ M1 · 概览汇总结论（总结性文本：三个段落，一段说一件事） ══════════════════════
           概览不只要 KPI，还要直接给教师 / 领导可执行的结论；阈值全部读 RP_CONFIG，不写死文案
           每条结论独立一段、行首序号圆自动编号（report.css）——两处读同一份 CONCL 数据 */
        var CONCL = null;
        function conclData() { return CONCL || (CONCL = buildConcl()); }
        function conclBody() {
            var d = conclData();
            return rpConclProse({ tag: d.tag, paras: d.paras });
        }
        function conclHelp() {
            var d = conclData();
            var rows = d.rules.map(function (x) {
                return [x.n, x.n === '档位结构'
                    ? x.rule + '（读生产「设置等级」同一份配置，报告不自设第二套档位）'
                    : x.rule];
            });
            rows.push(['阈值口径', '阈值统一读 RP_CONFIG（与讲评阈值、等级设置同一份配置），结论随本次数据自动重算，不是写死文案。'
                + (LEAD ? ' 每条结论的完整依据可在对应模块核对。' : ' 与最优班的逐题差距见模块 3，共性薄弱清单见模块 6。')]);
            return rpHelp('统计口径与判定规则', rows);
        }
        function buildConcl() {
            var dMean = Math.round((MM.mean - G.mean) * 10) / 10;
            var dBest = Math.round((MM.mean - BEST.mean) * 10) / 10;
            /* 共性薄弱按维度独立统计：两个维度各算一份、并列展示，不跨维度合并也不加权折算 */
            var weakByDim = RP_KP_DIMS.map(function (d) {
                var l = rpCommonWeak(d.id);
                var hs = l.filter(function (w) { return w.hit; });
                hs.forEach(function (w) { w.dim = d; });
                return { d: d, list: l, hits: hs, weakest: l[0] };
            });
            var hits = weakByDim.reduce(function (a, x) { return a.concat(x.hits); }, []);
            function weakBrief() {
                return weakByDim.map(function (x) { return x.d.short + ' ' + x.hits.length + ' / ' + rpKpsOfDim(x.d.id).length; }).join(' · ');
            }
            var pool = rpReviewedClasses(true);
            var bestC = pool.slice().sort(function (a, b) { return b.mean - a.mean; })[0];
            var worstC = pool.slice().sort(function (a, b) { return a.mean - b.mean; })[0];
            var range = Math.round((bestC.mean - worstC.mean) * 10) / 10;
            var pending = RP_CLASSES.filter(function (c) { return c.status !== 'reviewed'; });
            var smallCls = RP_CLASSES.filter(function (c) { return c.status === 'reviewed' && rpSmall(c); });
            var reviewed = rpReviewedClasses().length;
            var pendTxt = pending.map(function (c) { return c.cls + ' 班'; }).join('、');
            var smallTxt = smallCls.map(function (c) { return c.cls + ' 班（' + c.valid + ' 人）'; }).join('、');

            /* 正文只给文字强调：bad 红 / warn 橙 / '' 不着色——胶囊徽标已随表格一并取消 */
            function em(lvl, txt) { return lvl ? '<b class="cp-t ' + lvl + '">' + txt + '</b>' : txt; }
            var tierRule = '四档累计口径：' + RP_TIERS.map(function (t) { return t.n + ' ' + t.rule(); }).join(' · ');
            var gradeRule = '年级得分率低于及格线 ' + RP_CONFIG.grade.pass + '% → 整体补强；低分率 &gt; ' + RP_CONFIG.lowWarn + '% → 尾部预警';
            var weakRule = '年级掌握率 &lt; ' + RP_CONFIG.kp.master + '% 或 薄弱班覆盖 ≥ ' + Math.round(RP_CONFIG.commonWeakCover * 100) + '%（各维度独立统计，不跨维度合并）';
            var coverRule = '未批阅班级不计入聚合；有效样本 &lt; ' + RP_CONFIG.smallSample + ' 的班级标灰，不参与覆盖计算';
            var rules = [], paras = [];

            /* 两版共用：年级整体水平 / 年级共性薄弱 / 数据覆盖——同一份事实，供两角色分头成段 */
            var glLvl = '', glTxt;
            if (G.mean < RP_CONFIG.grade.pass) {
                glLvl = 'bad';
                glTxt = '已低于及格线，问题不在个别班，需年级层面统一补强';
            } else if (G.lowRate > RP_CONFIG.lowWarn) {
                glLvl = 'warn';
                glTxt = '高于及格线，但低分率 ' + G.lowRate + '% 超过预警线 ' + RP_CONFIG.lowWarn + '%';
            } else {
                glTxt = '高于及格线，低分率 ' + G.lowRate + '% 在预警线 ' + RP_CONFIG.lowWarn + '% 以内';
            }
            var weakHitTxt = weakBrief() + ' 个知识点命中（' + weakByDim.map(function (x) { return x.d.short + '最弱「' + rpEsc(x.weakest.n) + '」' + x.weakest.gradeRate + '%'; }).join('、') + '）';
            /* 覆盖口径拆成两截：班数 / 样本数由正文各自领走，未批阅与小样本状态只说一次，不在领导版里重提已批班数 */
            var scopeTxt = pendTxt ? pendTxt + '尚未批阅，结论只代表已批阅班级' : '全部班级已批阅，结论可直接用于年级教研';
            var smallNoteTxt = smallTxt ? smallTxt + '有效样本不足 ' + RP_CONFIG.smallSample + ' 人，不计入覆盖与聚合' : '';
            var coverTxt = '本次已批阅 <b>' + reviewed + ' / ' + RP_CLASSES.length + '</b> 班、有效样本 <b>' + G.valid + '</b> 人；'
                + scopeTxt + (smallNoteTxt ? '；' + smallNoteTxt : '') + '。';

            if (!LEAD) {
                /* ── R2 教师版：① 我的班位置 + 档位 ② 年级整体与共性薄弱 ③ 数据覆盖 ── */
                var posLvl = '', posTxt, tierLvl = '', tierTxt;
                if (MM.small) {
                    paras.push('我的班（' + rpEsc(MY.cls) + ' 班）有效样本仅 <b>' + MM.valid + '</b> 人，低于 <b>' + RP_CONFIG.smallSample + '</b> 人的小样本线：位次、分位与比率均已隐藏，本次只做逐生解读。');
                } else {
                    if (dMean < -RP_CONFIG.meanGap) {
                        posLvl = 'bad';
                        posTxt = '落后年级，先补与最优班差距最大的 3 题（见模块 3）';
                    } else if (dMean > RP_CONFIG.meanGap) {
                        posTxt = '领先年级，讲评以个别错题为主、优势题少花时间';
                    } else {
                        posTxt = '属持平区间（±' + RP_CONFIG.meanGap + 'pp 内），按常规节奏讲评即可';
                    }
                    if (MM.lowRate > G.lowRate) {
                        tierLvl = 'warn';
                        tierTxt = '低分率高于年级 ' + Math.round((MM.lowRate - G.lowRate) * 10) / 10 + 'pp，尾部规模偏大，先从低分段名单面批、讲评课给出基础题保底';
                    } else if (MM.passRate < G.passRate) {
                        tierLvl = 'warn';
                        tierTxt = '及格率低于年级 ' + Math.round((G.passRate - MM.passRate) * 10) / 10 + 'pp，卡线学生是主要失分群体，优先补及格线附近的必得分点';
                    } else {
                        tierTxt = '低分率不高于年级、及格率不低于年级，档位结构无明显问题';
                    }
                    paras.push('我的班（' + rpEsc(MY.cls) + ' 班）得分率 <b>' + MM.mean + '%</b>，居年级第 <b>' + RK.rank + ' / ' + RK.total + '</b>，与年级 ' + pp(dMean) + '、与最优班 ' + pp(dBest) + '，' + em(posLvl, posTxt) + '。');
                    paras.push('档位结构上，优秀 <b>' + MM.exRate + '%</b>、及格 <b>' + MM.passRate + '%</b>、低分 <b>' + MM.lowRate + '%</b>，' + em(tierLvl, tierTxt) + '。');
                }
                paras.push('年级平均得分率 <b>' + G.mean + '%</b>（及格线 ' + RP_CONFIG.grade.pass + '%），' + em(glLvl, glTxt) + '。');
                paras.push('年级共性薄弱 ' + weakHitTxt + '，' + (hits.length ? '属全年级短板、不归责到班，建议跟随年级统一补强。' : '本次无需年级统一补强，本班短板需自行排查。'));
                paras.push(coverTxt);
                rules.push(
                    { n: '我的班位置', rule: '与年级均差 ±' + RP_CONFIG.meanGap + 'pp 内判持平；低于 −' + RP_CONFIG.meanGap + 'pp 判落后；高于 +' + RP_CONFIG.meanGap + 'pp 判领先' },
                    { n: '档位结构', rule: tierRule },
                    { n: '年级整体水平', rule: gradeRule },
                    { n: '年级共性薄弱', rule: weakRule },
                    { n: '数据覆盖', rule: coverRule }
                );
            } else {
                /* ── R4 领导版：① 年级整体 + 档位 ② 班级分化 ③ 共性薄弱 + 数据覆盖 ── */
                paras.push('年级平均得分率 <b>' + G.mean + '%</b>（及格线 ' + RP_CONFIG.grade.pass + '%），' + em(glLvl, glTxt) + '。');
                paras.push('档位结构上，优秀 <b>' + G.exRate + '%</b>、及格 <b>' + G.passRate + '%</b>、低分 <b>' + G.lowRate + '%</b>，'
                    + (G.lowRate > RP_CONFIG.lowWarn ? em('warn', '尾部偏大，需统一安排低分段补练') : '无需单独干预') + '。');
                paras.push('本次已批阅 <b>' + reviewed + ' / ' + RP_CLASSES.length + '</b> 班、有效样本 <b>' + G.valid + '</b> 人，班际极差 <b>' + range + 'pp</b>（最高 ' + bestC.cls + ' 班 ' + bestC.mean + '%、最低 ' + worstC.cls + ' 班 ' + worstC.mean + '%，不含小样本班）。');
                paras.push(range >= RP_CONFIG.sdPp
                    ? em('bad', '班际分化明显，需分层教研：先由领先班试讲、统一讲法与进度') + '。'
                    : '班际差距可控，按常规教研推进、不做分层加压。');
                paras.push('年级共性薄弱 ' + weakHitTxt + '，'
                    + (hits.length ? '属全年级短板、不归责到班，下次备课宜优先聚焦最集中的 3 个。' : '本次无需年级统一补强。'));
                paras.push('数据覆盖上，' + scopeTxt + (smallNoteTxt ? '；' + smallNoteTxt : '') + '。');
                rules.push(
                    { n: '年级整体水平', rule: gradeRule },
                    { n: '班级分化', rule: '班际极差（最高班均 − 最低班均）≥ ' + RP_CONFIG.sdPp + 'pp 判分化明显；小样本班不计入极差' },
                    { n: '档位结构', rule: tierRule },
                    { n: '年级共性薄弱', rule: weakRule },
                    { n: '数据覆盖', rule: coverRule }
                );
            }
            return {
                tag: LEAD ? '汇总结论 · 管理视角' : '汇总结论 · 教学视角',
                paras: paras,
                rules: rules
            };
        }
        function g1Body() {
            /* 概览只留 KPI + 汇总结论（全宽）；档位表移出为独立模块「档位分布」（gTierBody），与班级报告 m2 同构 */
            return gradeKpi() + conclBody();
        }

        /* ══════════════════════ 档位分布（独立模块，R2 / R4 模块 2，PRD GR-14） ══════════════════════
           表用累计四档（读生产「设置等级」同一份配置）；堆叠图把累计口径转互斥五段：
           优秀 ≥ex / 良好 good–ex / 及格 pass–good / 待及格 low–pass / 低分 <low，占比 = 段人数 ÷ 有效样本 */
        function tierSegs(m) {
            var v = m.valid || 1;
            return [
                { n: '优秀', cnt: m.ex, color: '#389e0d' },
                { n: '良好', cnt: m.good - m.ex, color: '#2468f2' },
                { n: '及格', cnt: m.pass - m.good, color: '#8fb5fa' },
                { n: '待及格', cnt: m.valid - m.pass - m.low, color: '#fa8c16' },
                { n: '低分', cnt: m.low, color: '#cf1322' }
            ].map(function (s) { s.pct = Math.round(s.cnt / v * 1000) / 10; return s; });
        }
        function svgTierStack(rows, W) {
            W = W || 640;
            var PL = 62, PR = 56, PT = 4, rh = 26, H = PT + rows.length * rh + 6;
            var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="档位分布堆叠图">';
            rows.forEach(function (r, i) {
                var y = PT + i * rh + 5, x = PL, bw = W - PL - PR;
                s += '<text x="' + (PL - 8) + '" y="' + (y + 11) + '" font-size="11" fill="' + (r.dim ? '#909399' : '#494f57') + '" text-anchor="end"' + (r.mine ? ' font-weight="700"' : '') + '>' + rpEsc(r.n) + '</text>';
                if (r.dim) {
                    /* 小样本班：与排名表同口径，不画比率，灰条标「样本不足」 */
                    s += '<rect x="' + PL + '" y="' + y + '" width="' + bw + '" height="14" rx="2" fill="#eef1f5"/>'
                        + '<text x="' + (PL + 6) + '" y="' + (y + 11) + '" font-size="10" fill="#909399">样本不足（' + r.valid + ' 人）</text>';
                } else {
                    r.segs.forEach(function (sg) {
                        if (!sg.cnt) return;
                        var w = bw * sg.cnt / r.valid;
                        s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="14" fill="' + sg.color + '"><title>' + rpEsc(r.n) + ' ' + sg.n + ' ' + sg.cnt + ' 人（' + sg.pct + '%）</title></rect>';
                        x += w;
                    });
                }
                s += '<text x="' + (W - PR + 8) + '" y="' + (y + 11) + '" font-size="10.5" fill="#606266">' + rpEsc(r.note || '') + '</text>';
            });
            return s + '</svg>';
        }
        function gTierBody() {
            /* 右栏：年级四档表（教师版含「我的班」对比列——原概览右栏表平移；组长版只看年级，3 列） */
            var rows = RP_TIERS.map(function (t) {
                var myRate = !LEAD && MM ? MM[t.k + 'Rate'] : null;
                var myN = !LEAD && MM ? MM[t.k] : null;
                var dd = myRate == null ? null : Math.round((myRate - G[t.k + 'Rate']) * 10) / 10;
                return '<tr><td><b>' + t.n + '</b>'
                    + (t.k === 'low' ? '<div class="mod-sub">得分率 &lt; ' + RP_CONFIG.grade.low + '%</div>' : '') + '</td>'
                    + '<td class="num">' + G[t.k] + '</td><td class="num">' + G[t.k + 'Rate'] + '%</td>'
                    + (LEAD ? ''
                        : '<td class="num">' + (myN == null ? '<span class="na">—</span>' : myN) + '</td>'
                        + '<td class="num">' + (myRate == null ? '—' : myRate + '%') + '</td>'
                        /* 低分率涨了是坏事：颜色方向要反过来 */
                        + '<td class="num">' + (dd == null ? '—'
                            : '<span class="' + diffCls(t.k === 'low' ? -dd : dd) + '">' + rpPp(dd) + '</span>') + '</td>')
                    + '</tr>';
            }).join('');
            var tbl = '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>档位<span class="th-note">≥ 该档（低分档除外）</span></th><th class="num">年级人数</th><th class="num">年级占比</th>'
                + (LEAD ? '' : '<th class="num">我的班人数</th><th class="num">我的班占比</th><th class="num">差值</th>')
                + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
                + (!LEAD && MM ? '<div class="rp-note">「我的班」行即 ' + rpEsc(MY.cls) + ' 班，在年级四档中的位置。</div>' : '');
            /* 左栏：100% 堆叠图。组长版看各班全量（按班均降序）；教师版只给「我的班 vs 年级」，不渲染他班明细 */
            var chartRows;
            if (LEAD) {
                chartRows = rpReviewedClasses().slice().sort(function (a, b) { return b.mean - a.mean; }).map(function (c) {
                    var m = rpMetrics(c.cls), small = rpSmall(c);
                    return { n: c.cls + ' 班', segs: tierSegs(m), valid: m.valid, dim: small, note: small ? '—' : m.mean + '%' };
                });
            } else {
                chartRows = MM ? [
                    { n: '我的班', segs: tierSegs(MM), valid: MM.valid, note: MM.mean + '%', mine: true },
                    { n: '年级', segs: tierSegs(G), valid: G.valid, note: G.mean + '%' }
                ] : [{ n: '年级', segs: tierSegs(G), valid: G.valid, note: G.mean + '%' }];
            }
            var legend = '<div class="chart-legend">'
                + '<span><i style="background:#389e0d"></i>优秀 ≥' + RP_CONFIG.grade.ex + '%</span>'
                + '<span><i style="background:#2468f2"></i>良好 ' + RP_CONFIG.grade.good + '–' + RP_CONFIG.grade.ex + '%</span>'
                + '<span><i style="background:#8fb5fa"></i>及格 ' + RP_CONFIG.grade.pass + '–' + RP_CONFIG.grade.good + '%</span>'
                + '<span><i style="background:#fa8c16"></i>待及格 ' + RP_CONFIG.grade.low + '–' + RP_CONFIG.grade.pass + '%</span>'
                + '<span><i style="background:#cf1322"></i>低分 &lt;' + RP_CONFIG.grade.low + '%</span></div>';
            return '<div class="rp-cols">'
                + '<div><h5 class="sub-h">' + (LEAD ? '各班四档占比（按班均降序，行尾为班均）' : '我的班 vs 年级 · 四档构成') + '</h5>'
                + '<div class="chart-box">' + svgTierStack(chartRows, 640) + '</div>'
                + '<div class="chart-alt">移动端已隐藏分布图，请查看右侧档位表。</div>' + legend + '</div>'
                + '<div>' + tbl + '</div></div>';
        }
        function gTierHelp() {
            return rpHelp('档位口径与分段', [
                ['档位口径', RP_TIERS.map(function (t) { return t.n + ' ' + t.rule(); }).join(' · ') + '（表格为累计口径，读生产「设置等级」同一份配置）'],
                ['互斥分段', '堆叠图把累计口径拆成互斥五段：优秀 ≥' + RP_CONFIG.grade.ex + '% / 良好 ' + RP_CONFIG.grade.good + '–' + RP_CONFIG.grade.ex + '% / 及格 ' + RP_CONFIG.grade.pass + '–' + RP_CONFIG.grade.good + '% / 待及格 ' + RP_CONFIG.grade.low + '–' + RP_CONFIG.grade.pass + '% / 低分 &lt;' + RP_CONFIG.grade.low + '%；段占比 = 段人数 ÷ 有效样本，悬停看人数'],
                LEAD
                    ? ['排序与样本', '各班按班均得分率降序，行尾为班均；小样本班灰显标「样本不足」，未批阅班不参与']
                    : ['权限设计', '教师版只给「我的班 vs 年级」两条构成，不渲染他班明细；各班全量分布在组长版（R4）可见']
            ]);
        }

        /* ══════════════════════ G2 · 三线对比 ⭐（R2 模块 3） ══════════════════════ */
        /* 三线：我的班柱 + 年级最优班（匿名）实线 + 年级平均虚线；▲ 标 gap 最大 3 题 */
        function svg3line(labels, mine, best, grade, gapIdx, W, H) {
            /* 与 rpSvgBarLine 同一节奏：W 默认不动（字号比例与打印宽度不变）；v3 进左右结构左栏时传 W=640 保字号 */
            W = W || 1000; H = H || 220;
            var PL = 40, PR = 12, PT = 18, PB = 30, max = 100;
            var n = labels.length, iw = (W - PL - PR) / n, bw = Math.min(34, iw * 0.5);
            var y = function (v) { return PT + (1 - v / max) * (H - PT - PB); };
            var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="三线对比图">';
            [0, 25, 50, 75, 100].forEach(function (g2) {
                s += '<line x1="' + PL + '" y1="' + y(g2) + '" x2="' + (W - PR) + '" y2="' + y(g2) + '" stroke="#eef1f5"/>'
                    + '<text x="' + (PL - 6) + '" y="' + (y(g2) + 3.5) + '" font-size="10" fill="#909399" text-anchor="end">' + g2 + '</text>';
            });
            var pb = [], pg = [];
            labels.forEach(function (lb, i) {
                var cx = PL + iw * i + iw / 2, gap = gapIdx.indexOf(i) > -1;
                var v = mine[i];
                s += '<rect x="' + (cx - bw / 2) + '" y="' + y(v) + '" width="' + bw + '" height="' + (H - PB - y(v)) + '" rx="2" fill="' + (gap ? '#cf1322' : '#8fb5fa') + '"><title>' + rpEsc(lb) + ' 我的班 ' + v + '%</title></rect>';
                pb.push(cx + ',' + y(best[i]));
                pg.push(cx + ',' + y(grade[i]));
                s += '<text x="' + cx + '" y="' + (H - 10) + '" font-size="10.5" fill="#606266" text-anchor="middle">' + rpEsc(lb) + '</text>';
                if (gap) s += '<text x="' + cx + '" y="' + (y(v) - 6) + '" font-size="12" fill="#cf1322" text-anchor="middle" font-weight="700">▲</text>';
            });
            s += '<polyline points="' + pg.join(' ') + '" fill="none" stroke="#606266" stroke-width="1.6" stroke-dasharray="5 4"/>';
            s += '<polyline points="' + pb.join(' ') + '" fill="none" stroke="#389e0d" stroke-width="1.8"/>';
            return s + '</svg>';
        }
        function g2Aside() {
            return '<div class="seg" role="tablist" aria-label="三线视图切换">'
                + '<button type="button" class="' + (UI.g2Tab === 'chart' ? 'on' : '') + '" data-tab="chart" role="tab" aria-selected="' + (UI.g2Tab === 'chart') + '">三线对比</button>'
                + '<button type="button" class="' + (UI.g2Tab === 'all' ? 'on' : '') + '" data-tab="all" role="tab" aria-selected="' + (UI.g2Tab === 'all') + '">逐题明细</button></div>';
        }
        /* 全量逐题明细：只看 gap 最大 3 题会漏掉「小差距但题多」的稳定失分，这里给全 12 题 */
        function g2AllBody() {
            var rows = RP_QUESTIONS.map(function (q, i) {
                var mv = MY.qRates[i], bv = BEST.qRates[i], gv = RP_GRADE.qRates[i];
                var db = Math.round((mv - bv) * 10) / 10, dg = Math.round((mv - gv) * 10) / 10;
                return '<tr' + (db <= -8 ? ' class="hl"' : '') + '><td><b>' + q.no + '</b></td>'
                    + '<td>' + rpEsc(q.stem) + '</td>'
                    + '<td class="num">' + (q.type === 'obj' ? '客观' : '主观') + ' · ' + q.score + ' 分</td>'
                    + '<td class="num">' + mv + '%</td><td class="num">' + bv + '%</td><td class="num">' + gv + '%</td>'
                    + '<td class="num"><span class="' + (db < 0 ? 'neg' : (db > 0 ? 'pos' : '')) + '">' + rpPp(db) + '</span></td>'
                    + '<td class="num"><span class="' + (dg < 0 ? 'neg' : (dg > 0 ? 'pos' : '')) + '">' + rpPp(dg) + '</span></td>'
                    + '<td>' + rpEsc(rpKpNames(q.kps)) + '<div class="mod-sub">' + rpEsc(causeName(q.cause)) + '</div></td></tr>';
            }).join('');
            return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>题号</th><th>题干摘要</th><th class="num">题型 · 分值</th>'
                + '<th class="num">我的班</th><th class="num">最优班</th><th class="num">年级</th>'
                + '<th class="num">与最优班</th><th class="num">与年级</th><th>知识点 / 错因</th>'
                + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
                + '<div class="chart-note">高亮行 = 与最优班差 ≥ 8pp 的题（与「三线对比」的 ▲ 同一判定，这里列全 ' + RP_QUESTIONS.length + ' 题）。</div>';
        }
        function g2Body() {
            if (UI.g2Tab === 'all') return g2AllBody();
            var gap = RP_QUESTIONS.map(function (q, i) {
                return { i: i, no: q.no, d: Math.round((BEST.qRates[i] - MY.qRates[i]) * 10) / 10 };
            }).filter(function (x) { return x.d > 0; }).sort(function (a, b) { return b.d - a.d; }).slice(0, 3);
            var gapIdx = gap.map(function (x) { return x.i; });
            var chart = svg3line(
                RP_QUESTIONS.map(function (q) { return q.no; }),
                MY.qRates, BEST.qRates, RP_GRADE.qRates, gapIdx, 640, 200
            );
            var rows = gap.map(function (x) {
                var q = RP_QUESTIONS[x.i];
                return '<tr class="hl"><td><b>第 ' + q.no + ' 题</b></td><td>' + rpEsc(q.stem) + '</td>'
                    + '<td class="num">' + MY.qRates[x.i] + '%</td><td class="num">' + BEST.qRates[x.i] + '%</td>'
                    + '<td class="num"><span class="neg">−' + Math.abs(x.d) + 'pp</span></td>'
                    + '<td>' + rpEsc(rpKpNames(q.kps)) + ' · ' + rpEsc(causeName(q.cause)) + '</td></tr>';
            }).join('');
            /* v3 左图右表：三线图 | gap 最大 3 题表（仅 3 行，纵向叠加最浪费） */
            return '<div class="rp-cols"><div>'
                + '<div class="chart-box">' + chart + '</div>'
                + '<div class="chart-legend"><span><i style="background:#8fb5fa"></i>我的班（' + rpEsc(MY.cls) + ' 班）</span>'
                + '<span><i style="background:#cf1322"></i>gap 最大 3 题（▲）</span>'
                + '<span><i style="background:#389e0d;border-radius:0;height:0;border-top:2px solid #389e0d"></i>年级最优班（匿名）</span>'
                + '<span><i class="line"></i>年级平均</span></div>'
                + '<div class="chart-alt">移动端已隐藏图表。gap 最大 3 题：' + gap.map(function (x) { return '第 ' + x.no + ' 题（差 ' + Math.abs(x.d) + 'pp）'; }).join('、') + '。</div></div>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>gap 最大题</th><th>题干摘要</th><th class="num">我的班</th><th class="num">年级最优班</th>'
                + '<th class="num">差距</th><th>知识点 · 错因</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
        }

        /* ══════════════════════ G3 · 我的班排名（R2 模块 4） ══════════════════════ */
        function g3Body() {
            var dMean = Math.round((MM.mean - G.mean) * 10) / 10;
            var dBest = Math.round((MM.mean - BEST.mean) * 10) / 10;
            /* v3：4 行纵表转置为 1 表头 + 1 数据行（与班级报告模块 8 同构） */
            return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>全年级排名</th><th>与年级均差</th><th>与年级最优班差距</th><th>同类型班级内排名</th>'
                + '</tr></thead><tbody><tr>'
                + '<td>第 <b>' + RK.rank + '</b> / ' + RK.total + ' 个已批阅班级<div class="mod-sub">前 ' + Math.round(RK.rank / RK.total * 100) + '%</div></td>'
                + '<td>' + pp(dMean) + '<div class="mod-sub">年级平均 ' + G.mean + '%</div></td>'
                + '<td>' + pp(dBest) + '<div class="mod-sub">匿名参照，不露班名</div></td>'
                + '<td><span class="na">隐藏</span><div class="mod-sub">班级分组（平行班 / 重点班）未接入（方案 9.3 P2），且同类班级 &lt; 3 个时按规则必须隐藏</div></td>'
                + '</tr></tbody></table></div>';
        }

        /* ══════════════════════ G4 · 知识点差距（R2 模块 5） ══════════════════════ */
        function g4Body() {
            var D = rpDim(UI.kpDim);
            var list = rpKpsOfDim(UI.kpDim).map(function (k) {
                return { n: k.n, v: MY.kpRates[k.id], gv: RP_GRADE.kpRates[k.id], d: Math.round((MY.kpRates[k.id] - RP_GRADE.kpRates[k.id]) * 10) / 10 };
            }).sort(function (a, b) { return b.d - a.d; });
            var adv = list.filter(function (x) { return x.d > 0; }).slice(0, 5);
            var wk = list.filter(function (x) { return x.d < 0; }).reverse().slice(0, 5);
            function cell(arr, cls2) {
                if (!arr.length) return '<div class="mod-sub">无</div>';
                return arr.map(function (x) {
                    return '<div class="lect-item"><span class="qno">' + rpEsc(x.n) + '</span>'
                        + '<div class="li-body"><div class="li-rate">我的班 <b>' + x.v + '%</b> · 年级 ' + x.gv + '% · '
                        + '<span class="' + diffCls(x.d) + '">' + rpPp(x.d) + '</span></div></div></div>';
                }).join('');
            }
            return dimLine('优势 / 薄弱 TOP5 只在当前维度内排序')
                + '<div class="drill-grid">'
                + '<div><h5>优势 TOP5（领先年级 · ' + rpEsc(D.short) + '）</h5>' + cell(adv, 'pos') + '</div>'
                + '<div><h5>薄弱 TOP5（落后年级 · ' + rpEsc(D.short) + '）</h5>' + cell(wk, 'neg') + '</div></div>';
        }

        /* ══════════════════════ G5 · 年级共性薄弱点（R2 模块 6） ══════════════════════ */
        function g5Body() {
            var D = rpDim(UI.kpDim);
            var list = rpCommonWeak(UI.kpDim);
            var hits = list.filter(function (w) { return w.hit; });
            var rows = list.map(function (w) {
                return '<tr' + (w.hit ? ' class="hl"' : '') + '><td><b>' + rpEsc(w.n) + '</b>' + (w.hit ? ' <span class="tag-lv weak">共性薄弱</span>' : '') + '</td>'
                    + '<td class="num">' + w.gradeRate + '%</td>'
                    + '<td class="num">' + w.weakCnt + ' / ' + w.poolCnt + ' 班</td>'
                    + '<td class="num">' + w.cover + '%</td>'
                    + '<td>' + rpEsc(w.reason) + '</td></tr>';
            }).join('');
            return dimLine('命中判定只看本维度内知识点的年级掌握率与覆盖')
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>知识点（' + rpEsc(D.n) + ' · 按年级掌握率升序）</th><th class="num">年级掌握率</th><th class="num">薄弱班覆盖</th>'
                + '<th class="num">覆盖率</th><th>命中规则</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
        }

        /* ══════════════════════ G6 · 共性错因（R2 模块 7） ══════════════════════ */
        function g6Body() {
            var mx = rpCauseKpMatrix();
            var donut = rpSvgDonut({ segs: mx.map(function (x) { return { n: x.n, v: x.total, color: x.color }; }) });
            var rows = mx.map(function (x) {
                var kps = Object.keys(x.cells).filter(function (k) { return x.cells[k] > 0; });
                return '<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' + x.color + ';margin-right:6px"></span><b>' + rpEsc(x.n) + '</b></td>'
                    + '<td class="num">' + x.total + '</td>'
                    + '<td class="num">' + Math.round(x.total / (mx.reduce(function (s, o) { return s + o.total; }, 0) || 1) * 100) + '%</td>'
                    + '<td>' + kps.map(function (k) { return rpEsc(kpName(k)); }).join('、') + '</td></tr>';
            }).join('');
            /* v3：与班级报告模块 5 同构——230px 侧栏放环形图 + 图例，右侧表占满余量；图例从表下方改到图下方
               错因按题目聚合：不设维度切换，涉及知识点列列出该错因全部涉及知识点（不分维度） */
            return '<div class="rp-cols side"><div>'
                + '<div class="chart-box center">' + donut + '</div>'
                + '<div class="chart-legend">' + mx.map(function (x) {
                    return '<span><i style="background:' + x.color + '"></i>' + rpEsc(x.n) + '</span>';
                }).join('') + '</div></div>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>错因（跨班汇总）</th><th class="num">人次</th><th class="num">占比重</th><th>涉及知识点（不分维度）</th>'
                + '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
        }

        /* ══════════════════════ G7 · 对标建议（R2 模块 8） ══════════════════════ */
        function g7Body() {
            var gap = RP_QUESTIONS.map(function (q, i) {
                return { no: q.no, kp: rpKpNames(q.kps), cause: causeName(q.cause), d: Math.round((BEST.qRates[i] - MY.qRates[i]) * 10) / 10, gv: RP_GRADE.qRates[i], mv: MY.qRates[i] };
            }).filter(function (x) { return x.d > 0; }).sort(function (a, b) { return b.d - a.d; }).slice(0, 3);
            var own = RP_QUESTIONS.map(function (q, i) {
                return { no: q.no, kp: rpKpNames(q.kps), d: Math.round((MY.qRates[i] - RP_GRADE.qRates[i]) * 10) / 10, gv: RP_GRADE.qRates[i], mv: MY.qRates[i] };
            }).filter(function (x) { return x.d < -8 && x.gv >= RP_CONFIG.kp.master; }).slice(0, 3);
            return '<div class="lect-item"><span class="qno">向最优班学什么</span><div class="li-body">'
                + (gap.length ? gap.map(function (x) {
                    return '<div>第 ' + x.no + ' 题（' + rpEsc(x.kp) + '）：最优班高出 ' + Math.abs(x.d) + 'pp，主错因「' + rpEsc(x.cause) + '」——向该题得分率最高的讲法对齐，调取该题同类讲评范例。</div>';
                }).join('') : '本次各题与最优班差距均在波动范围内，无显著对标项。')
                + '</div></div>'
                + '<div class="lect-item"><span class="qno">我班独有问题</span><div class="li-body">'
                + (own.length ? own.map(function (x) {
                    return '<div>第 ' + x.no + ' 题：年级 ' + x.gv + '%（不弱）而我班仅 ' + x.mv + '%——非年级共性，需班内自查讲练到位程度。</div>';
                }).join('') : '我班无「年级不弱而我班明显弱」的题目，短板均为年级共性，建议跟随年级统一动作。')
                + '</div></div>';
        }

        /* ══════════════════════ H2 · 知识点分析（R4 模块 3） ══════════════════════ */
        function h2Body() {
            var D = rpDim(UI.kpDim);
            var pool = rpReviewedClasses(true);
            var list = rpCommonWeak(UI.kpDim);  /* 已按年级掌握率升序（仅本维度内） */
            /* v3 左图右表：条形图进左栏传 w:640 / pl:120 保字号 */
            var chart = rpSvgHBars({ items: list.map(function (w) { return { n: w.n, v: w.gradeRate }; }), w: 640, pl: 120 });
            var rows = list.map(function (w) {
                var lvCnt = pool.filter(function (c) { return rpKpLevel(c.kpRates[w.id]) === 'master'; }).length;
                var wkCnt = pool.filter(function (c) { return rpKpLevel(c.kpRates[w.id]) === 'weak'; }).length;
                var noCnt = pool.filter(function (c) { return rpKpLevel(c.kpRates[w.id]) === 'none'; }).length;
                return '<tr' + (w.hit ? ' class="hl"' : '') + '><td><b>' + rpEsc(w.n) + '</b>' + (w.hit ? ' <span class="tag-lv weak">共性薄弱</span>' : '') + '</td>'
                    + '<td class="num">' + w.gradeRate + '%</td>'
                    + '<td class="num">' + w.weakCnt + ' / ' + w.poolCnt + '</td>'
                    + '<td><span class="tag-lv master">掌握 ' + lvCnt + '</span> <span class="tag-lv weak">薄弱 ' + wkCnt + '</span> <span class="tag-lv none">未掌握 ' + noCnt + '</span></td></tr>';
            }).join('');
            return dimLine('年级掌握率、薄弱班覆盖、等级分布都只在本维度内计算')
                + '<div class="rp-cols"><div>'
                + '<div class="chart-box">' + chart + '</div>'
                + '<div class="chart-alt">移动端已隐藏条形图，最弱知识点：' + (list[0] ? list[0].n + '（' + list[0].gradeRate + '%）' : '—') + '。</div></div>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>知识点（' + rpEsc(D.n) + ' · 按年级掌握率升序）</th><th class="num">年级掌握率</th>'
                + '<th class="num">薄弱班覆盖</th><th>掌握等级分布（班数）</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
        }

        /* ══════════════════════ H3 · 错因分析（R4 模块 4） ══════════════════════ */
        function h3Body() {
            var mx = rpCauseKpMatrix();
            /* 错因按题目聚合：矩阵列取本次实际涉及的全部知识点（不分维度），不挂维度切换器 */
            var kps = RP_KPS.filter(function (k) { return mx.some(function (x) { return x.cells[k.id] > 0; }); });
            var heat = rpSvgHeat({
                rows: mx.map(function (x) { return x.n; }),
                cols: kps.map(function (k) { return k.n; }),
                cw: 88, ch: 32, pl: 148,
                get: function (i, j) {
                    var v = mx[i].cells[kps[j].id];
                    return v > 0 ? { v: v, title: mx[i].n + ' × ' + kps[j].n + ' ' + v + ' 人次' } : null;
                }
            });
            var top = rpTopWrong(10);
            var rows = top.map(function (x) {
                var src = rpMarkSource(x.rate, x.idx, RP_CONFIG.lecture);
                return '<tr' + (src ? ' class="hl"' : '') + '><td><b>第 ' + x.no + ' 题</b></td>'
                    + '<td>' + rpEsc(x.stem) + '</td><td>' + (x.type === 'obj' ? '客观' : '主观') + '</td>'
                    + '<td class="num">' + x.score + '</td>'
                    + '<td class="num">' + x.rate + '%' + (src ? '<div class="why"><span class="tag-src ' + src.k + '">' + src.n + '</span></div>' : '') + '</td>'
                    + '<td>' + rpEsc(x.kp) + '</td><td>' + rpEsc(x.cause) + '</td>'
                    + '<td class="num">' + x.lost + '</td></tr>';
            }).join('');
            /* TOP10 表 8 列，与热力矩阵（8 列 × 148px 行头）都偏宽 —— 取舍：保留纵向，仅去掉 12px 内联外边距，由 .sub-h 自身间距承担 */
            return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>典型错题 TOP10（按年级得分率升序）</th><th>题干摘要</th><th>题型</th><th class="num">分值</th>'
                + '<th class="num">年级得分率</th><th>知识点</th><th>主错因</th><th class="num">失分合计</th>'
                + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
                + '<h5 class="sub-h">错因 × 知识点 交叉热力矩阵（人次 · 全部知识点，不分维度）</h5>'
                + '<div class="chart-box">' + heat + '</div>'
                + '<div class="chart-alt">移动端已隐藏热力矩阵，请查看上方 TOP10 表。</div>';
        }

        /* ══════════════════════ H4 · 班级对比（R4 模块 5） ══════════════════════ */
        function h4Body() {
            var D = rpDim(UI.kpDim), kps = rpKpsOfDim(UI.kpDim);
            var rows = RP_CLASSES.map(function (c) {
                if (c.status !== 'reviewed') {
                    return '<tr class="dim"><td><b>' + c.cls + '</b></td><td>' + rpEsc(c.teacher) + '</td><td colspan="7" class="why">未批阅，不参与统计</td></tr>';
                }
                var m = rpMetrics(c.cls), rank = rpRank(c.cls), small = rpSmall(c);
                var d = small ? null : Math.round((m.mean - RP_GRADE.mean) * 10) / 10;
                return '<tr' + (small ? ' class="dim"' : '') + '><td><b>' + c.cls + ' 班</b></td><td>' + rpEsc(c.teacher) + '</td>'
                    + '<td class="num">' + m.mean + '%' + (small ? '<div class="why">样本 ' + m.valid + ' 人</div>' : ' <span class="rank-bdg">第 ' + rank.rank + ' / ' + rank.total + '</span>') + '</td>'
                    + '<td class="num">' + (small ? '—' : pp(d)) + '</td>'
                    + '<td class="num">' + m.subRate + '%</td>'
                    + '<td class="num">' + (small ? '<span class="na">—</span>' : m.exRate + '%') + '</td>'
                    + '<td class="num">' + (small ? '<span class="na">—</span>' : m.passRate + '%') + '</td>'
                    + '<td class="num">' + (small ? '<span class="na">—</span>' : m.lowRate + '%') + '</td>'
                    + '<td class="num">' + m.valid + '</td></tr>';
            }).join('');
            var sorted = rpReviewedClasses().slice().sort(function (a, b) { return b.mean - a.mean; });
            var heat = rpSvgHeat({
                rows: sorted.map(function (c) { return c.cls + ' 班'; }),
                cols: kps.map(function (k) { return k.n; }),
                cw: 70, ch: 28, pl: 56,   /* v3 进半栏：总宽 624 ≈ 栏宽，不被缩放到字号 < 10px */
                get: function (i, j) {
                    var c = sorted[i];
                    return { v: c.kpRates[kps[j].id], title: c.cls + ' 班 × ' + kps[j].n + ' ' + c.kpRates[kps[j].id] + '%' };
                }
            });
            var stackRows = sorted.map(function (c) {
                var cs = rpCauseStats(c.cls);
                var top4 = cs.slice(0, 4), rest = cs.slice(4);
                var segs = top4.map(function (x) { return { n: x.n, v: x.cnt, color: x.color }; });
                if (rest.length) segs.push({ n: '其他', v: rest.reduce(function (s, x) { return s + x.cnt; }, 0), color: '#c0c4cc' });
                return { n: c.cls + ' 班', segs: segs };
            });
            var stack = rpSvgStack({ rows: stackRows, w: 640 });
            /* v3：排名表全宽；热力图 | 堆叠图 等分并排（行数相同、都按班均降序，横向对读更直观），模块高度减一张图 */
            return dimLine('热力图只展示当前维度内的知识点；排名表与错因堆叠条不随维度变化')
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>班级</th><th>任课教师</th><th class="num">平均得分率（排名）</th><th class="num">与年级均差</th>'
                + '<th class="num">提交率</th><th class="num">优秀率</th><th class="num">及格率</th><th class="num">低分率</th><th class="num">有效样本</th>'
                + '</tr></thead><tbody>' + rows + '</tbody>'
                + '<tfoot><tr><td colspan="2"><b>年级合计</b>（' + rpReviewedClasses().length + ' 个已批阅班）</td>'
                + '<td class="num">' + G.mean + '%</td><td class="num">—</td>'
                + '<td class="num">' + G.subRate + '%</td><td class="num">' + G.exRate + '%</td>'
                + '<td class="num">' + G.passRate + '%</td><td class="num">' + G.lowRate + '%</td>'
                + '<td class="num">' + G.valid + '</td></tr></tfoot></table></div>'
                + '<div class="rp-cols eq">'
                + '<div><h5 class="sub-h">班 × 知识点 掌握率热力图（' + rpEsc(D.n) + '）</h5><div class="chart-box">' + heat + '</div></div>'
                + '<div><h5 class="sub-h">各班错因结构（堆叠人次）</h5><div class="chart-box">' + stack + '</div></div>'
                + '</div>'
                + '<div class="chart-alt">移动端已隐藏热力图与堆叠图，请查看上方排名表。</div>';
        }

        /* ══════════════════════ H5 · 质量诊断（R4 模块 6） ══════════════════════ */
        function h5Body() {
            var D = rpDim(UI.kpDim);
            var hits = rpCommonWeak(UI.kpDim).filter(function (w) { return w.hit; });
            var diag = hits.map(function (w) {
                var judge = w.gradeRate < RP_CONFIG.kp.master ? '年级薄弱，优先补强' : '覆盖达标，需统一教研';
                var act = w.gradeRate < RP_CONFIG.kp.master ? '年级层面统一补强：统一讲评范例 + 变式题组，不归责到班'
                    : '组织集体备课：统一进度与方法，重点班先试讲再推广';
                return '<tr><td><b>' + rpEsc(w.n) + '</b></td><td class="num">' + w.gradeRate + '%</td>'
                    + '<td class="num">' + w.weakCnt + ' / ' + w.poolCnt + ' 班</td>'
                    + '<td><span class="tag-lv weak">' + judge + '</span></td><td>' + rpEsc(act) + '</td>'
                    + '<td>' + rpEsc(w.reason) + '</td></tr>';
            }).join('');
            return dimLine('知识点级判定只统计当前维度，判定与动作均不跨维度')
                + '<h5 class="sub-h">知识点级判定（共性薄弱项 · ' + rpEsc(D.n) + '）</h5>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>知识点</th><th class="num">年级掌握率</th><th class="num">薄弱班覆盖</th><th>判定</th><th>建议动作</th><th>规则依据</th>'
                + '</tr></thead><tbody>' + (diag || '<tr class="dim"><td colspan="6">本次无共性薄弱知识点</td></tr>') + '</tbody></table></div>';
        }

        /* ══════════════════════ H6 · 学科诊断（R4 模块 7） ══════════════════════
   原「六维能力雷达」依赖能力维度，已取消：知识点只按业务维度归属（同步 / 复习…），
   维度之间并列、各自独立统计，不由知识点反推任何能力项 → 改为归因链 + 维度概览 + 易混淆对 + 题型 */
        function h6Body() {
            var D = rpDim(UI.kpDim);
            /* ① 归因链：共性错因 → 知识点 → 知识点所属维度（维度来自知识点自身归属） */
            var topCause = rpCauseKpMatrix()[0];
            var weakKp = rpCommonWeak(UI.kpDim)[0];
            var weakDim = rpKpDimOf(weakKp.id);
            var chain = '<div class="lect-item"><span class="qno">归因链</span><div class="li-body">'
                + '共性错因「<b>' + rpEsc(topCause.n) + '</b>」（' + topCause.total + ' 人次）→ 集中在知识点「<b>' + rpEsc(weakKp.n) + '</b>」（年级 ' + weakKp.gradeRate + '%）'
                + '→ 所属维度「<b>' + rpEsc(weakDim.n) + '</b>」。建议在本维度内排期讲评与补练；其它维度独立统计、不合并折算。</div></div>';
            /* ② 知识点维度概览：全部维度并列展示——这张表不看切换，本身就是「维度独立统计」的证据 */
            var dimRows = RP_KP_DIMS.map(function (d) {
                var l = rpCommonWeak(d.id), worst = l[0];
                var hitN = l.filter(function (w) { return w.hit; }).length;
                return '<tr' + (d.id === UI.kpDim ? ' class="hl"' : '') + '>'
                    + '<td><b>' + rpEsc(d.n) + '</b>' + (d.id === UI.kpDim ? ' <span class="tag-lv master">当前</span>' : '') + '<div class="mod-sub">' + rpEsc(d.desc) + '</div></td>'
                    + '<td class="num">' + rpKpsOfDim(d.id).length + '</td>'
                    + '<td class="num">' + rpDimMean(RP_GRADE.kpRates, d.id) + '%</td>'
                    + '<td class="num">' + hitN + ' 个</td>'
                    + '<td>' + (worst ? rpEsc(worst.n) + '<div class="mod-sub">' + worst.gradeRate + '%</div>' : '—') + '</td></tr>';
            }).join('');
            /* ③ 易混淆对：按当前维度过滤（题目可跨维度挂接，各维度各算各的） */
            var pairs = rpConfusePairs(UI.kpDim).slice(0, 5);
            var pairRows = pairs.map(function (p) {
                return '<tr><td><b>第 ' + p.no + ' 题</b></td><td>' + rpEsc(p.kp) + '</td>'
                    + '<td><span class="tag-lv master">' + p.correct + '（' + p.correctPc + '%）</span></td>'
                    + '<td><span class="tag-lv none">' + p.wrong + '（' + p.wrongPc + '%）</span></td>'
                    + '<td>以「' + p.wrong + '」代「' + p.correct + '」：当堂做一对对比句辨析，突出判定差异</td></tr>';
            }).join('');
            var obj = RP_QUESTIONS.map(function (q, i) { return q.type === 'obj' ? RP_GRADE.qRates[i] : null; }).filter(function (v) { return v != null; });
            var sub = RP_QUESTIONS.map(function (q, i) { return q.type === 'sub' ? RP_GRADE.qRates[i] : null; }).filter(function (v) { return v != null; });
            var objAvg = Math.round(obj.reduce(function (a, v) { return a + v; }, 0) / obj.length * 10) / 10;
            var subAvg = Math.round(sub.reduce(function (a, v) { return a + v; }, 0) / sub.length * 10) / 10;
            var typeRows = '<tr><td><b>客观题</b></td><td class="num">' + objAvg + '%</td>'
                + '<td>' + rpEsc(causeName(RP_QUESTIONS.filter(function (q) { return q.type === 'obj'; }).sort(function (a, b) { return RP_GRADE.qRates[RP_QUESTIONS.indexOf(a)] - RP_GRADE.qRates[RP_QUESTIONS.indexOf(b)]; })[0].cause)) + '</td>'
                + '<td>先辨析再规则，禁止只讲答案不讲判据</td></tr>'
                + '<tr><td><b>主观题</b></td><td class="num">' + subAvg + '%</td>'
                + '<td>' + rpEsc(causeName(RP_QUESTIONS.filter(function (q) { return q.type === 'sub'; }).sort(function (a, b) { return RP_GRADE.qRates[RP_QUESTIONS.indexOf(a)] - RP_GRADE.qRates[RP_QUESTIONS.indexOf(b)]; })[0].cause)) + '</td>'
                + '<td>给分点先行：要点覆盖比语言华丽更得分</td></tr>';
            /* 等高两栏：左 = 归因链 + 维度概览，右 = 易混淆 + 题型；不再放雷达图 */
            return dimLine('归因链与易混淆对按当前维度取数；维度概览始终并列展示全部维度')
                + '<div class="rp-cols eq"><div>' + chain
                + '<h5 class="sub-h">知识点维度概览（各维度独立统计，不合并）</h5>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>维度</th><th class="num">知识点数</th><th class="num">维度均掌握率</th><th class="num">共性薄弱</th><th>最弱知识点</th>'
                + '</tr></thead><tbody>' + dimRows + '</tbody></table></div>'
                + '</div><div>'
                + '<h5 class="sub-h">易混淆对 TOP5（' + rpEsc(D.n) + '）</h5>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>易混淆对</th><th>知识点</th><th>正确项</th><th>最高错误项</th><th>教学建议</th></tr></thead><tbody>'
                + (pairRows || '<tr class="dim"><td colspan="5">本维度无客观题混淆对</td></tr>') + '</tbody></table></div>'
                + '<h5 class="sub-h">题型 × 易错点（全量口径）</h5>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>题型</th><th class="num">年级得分率</th><th>主错因</th><th>教学建议</th></tr></thead><tbody>' + typeRows + '</tbody></table></div>'
                + '</div></div>';
        }

        /* ══════════════════════ H7 · 教研落点 ⭐（R4 模块 8） ══════════════════════ */
        function h7Body() {
            var D = rpDim(UI.kpDim);
            var kps = rpKpsOfDim(UI.kpDim);
            var weakTop = rpCommonWeak(UI.kpDim).filter(function (w) { return w.hit; }).slice(0, 3);
            var pool = rpReviewedClasses(true);
            var best = pool.slice().sort(function (a, b) { return b.mean - a.mean; })[0];
            var items = [];
            items.push({
                t: '备课主题建议',
                b: weakTop.length
                    ? '下次备课聚焦：' + weakTop.map(function (w) { return '「' + w.n + '」'; }).join('、')
                        + '。每个主题产出一份统一讲评范例 + 一份变式题组（各 6 题），两周内落地。'
                    : '本次无共性薄弱知识点，备课主题转为经验提炼与拓展题设计。'
            });
            items.push({
                t: '公开课建议',
                b: '本次均分最高的班级：' + rpEsc(best.cls) + ' 班 · ' + rpEsc(best.teacher) + '（' + best.mean + '%）。'
                    + '建议安排一次公开课 / 教研分享，提炼其「' + rpEsc((kps.slice().sort(function (a, b) { return best.kpRates[b.id] - best.kpRates[a.id]; })[0] || {}).n) + '」讲法（' + rpEsc(D.short) + '维度内最掌握的一项）。'
            });
            items.push({
                t: '补题建议',
                b: '题库缺口：年级得分率最低的知识点「' + rpEsc(weakTop[0] ? weakTop[0].n : '—') + '」对应题目仅有 '
                    + RP_QUESTIONS.filter(function (q) { return (q.kps || []).indexOf((weakTop[0] || {}).id) >= 0; }).length + ' 题，'
                    + '建议补录该知识点选择题 4 题、主观题 2 题，梯度覆盖 ' + RP_CONFIG.kp.weak + '%–' + RP_CONFIG.kp.master + '% 区间。'
            });
            items.push({
                t: '资源推荐',
                b: '对接校内资源库：为该次讲评推荐「定语从句微课」「非谓语动词错例集」等资源（演示原型：资源库未接入，方案 9.3 P2）。'
            });
            return dimLine('督导建议里的知识点只取当前维度，切换维度后同步重算')
                + items.map(function (it, i) {
                return '<div class="lect-item"><span class="qno">' + (i + 1) + ' · ' + it.t + '</span>'
                    + '<div class="li-body">' + it.b + '</div>'
                    + (i === 3 ? '<div class="li-act no-print"><button class="rp-btn sm" data-act="res">查看资源</button></div>' : '')
                    + '</div>';
            }).join('');
        }

        /* ══════════════════════ 页面装配 ══════════════════════ */
        function anchors() {
            return LEAD ? [
                { id: 'm1', no: '1', name: '年级概览' },
                { id: 'm2', no: '2', name: '档位分布' },
                { id: 'm3', no: '3', name: '知识点分析' },
                { id: 'm4', no: '4', name: '错因分析' },
                { id: 'm5', no: '5', name: '班级对比' },
                { id: 'm6', no: '6', name: '质量诊断' },
                { id: 'm7', no: '7', name: '学科诊断' },
                { id: 'm8', no: '8', name: '教研落点' }
            ] : [
                { id: 'm1', no: '1', name: '年级概览' },
                { id: 'm2', no: '2', name: '档位分布' },
                { id: 'm3', no: '3', name: '三线对比' },
                { id: 'm4', no: '4', name: '我的班排名' },
                { id: 'm5', no: '5', name: '知识点差距' },
                { id: 'm6', no: '6', name: '年级共性薄弱' },
                { id: 'm7', no: '7', name: '共性错因' },
                { id: 'm8', no: '8', name: '对标建议' }
            ];
        }
        function setHtml(sel, html) {
            var el = document.querySelector(sel);
            if (el) el.innerHTML = html;
        }
        /* 知识点维度切换：只重绘依赖维度的模块，其余模块（KPI / 排名 / 概览结论）不动；
           概览结论本身按「全维度并列」输出，因此不随切换重算 */
        function paintKp() {
            if (!LEAD) {
                setHtml('#m5 .mod-aside', kpDimAside());
                setHtml('#m5 .mod-b', g4Body());
                setHtml('#m6 .mod-aside', kpDimAside());
                setHtml('#m6 .mod-b', g5Body());
            } else {
                setHtml('#m3 .mod-aside', kpDimAside());
                setHtml('#m3 .mod-b', h2Body());
                setHtml('#m5 .mod-aside', kpDimAside());
                setHtml('#m5 .mod-b', h4Body());
                setHtml('#m6 .mod-aside', kpDimAside());
                setHtml('#m6 .mod-b', h5Body());
                setHtml('#m7 .mod-aside', kpDimAside());
                setHtml('#m7 .mod-b', h6Body());
                setHtml('#m8 .mod-aside', kpDimAside());
                setHtml('#m8 .mod-b', h7Body());
            }
        }
        function bindEvents() {
            document.addEventListener('click', function (e) {
                var t = e.target.closest('[data-act],[data-tab],[data-kpdim]');
                if (!t) return;
                if (t.hasAttribute('data-kpdim')) {
                    var dim = t.getAttribute('data-kpdim');
                    if (dim === UI.kpDim) return;
                    UI.kpDim = dim;
                    paintKp();
                    rpToast('知识点维度已切为「' + rpDim(dim).n + '」，各维度独立统计');
                    return;
                }
                if (t.hasAttribute('data-tab')) {
                    UI.g2Tab = t.getAttribute('data-tab');
                    setHtml('#m3 .mod-aside', g2Aside());
                    setHtml('#m3 .mod-b', g2Body());
                    return;
                }
                var act = t.dataset.act;
                if (act === 'print') rpExportSettings('export-grade.html');
                else if (act === 'res') rpToast('演示原型：校内资源库未接入（方案 9.3 P2）', true);
            });
        }
        function teacherHtml() {
            return mod('m1', '1', '年级概览', '全篇视角锁定「我的班 vs 年级」', '', g1Body(), { prd: 'GR-01', help: conclHelp() })
                + mod('m2', '2', '档位分布', '我的班 vs 年级四档结构', '', gTierBody(), { prd: 'GR-14', help: gTierHelp() })
                + mod('m3', '3', '三线对比', '我的班 / 最优班（匿名）/ 年级平均', g2Aside(), g2Body(), {
                    star: true, prd: 'GR-02', help: rpHelp('三条线与权限口径', [
                        ['三条线', '柱 = 我的班；绿实线 = 年级最优班（仅计已批阅班）；灰虚线 = 年级平均'],
                        ['选点规则', '▲ 标「最优班 − 我的班」差值最大的 3 题（仅取正值，即最优班更强）'],
                        ['逐题明细', '切「逐题明细」列全 ' + RP_QUESTIONS.length + ' 题：三列并列，并给出与最优班、与年级的差值；高亮行 = 与最优班差 ≥ 8pp'],
                        ['权限设计', '「最优班」是匿名聚合标签，不露班名与教师名——知道差在哪、差多少，但看不到是哪个班（方案 R2 模块 2）'],
                        ['错因列', '错因只对「大模型智批」的题目有数据']
                    ])
                })

<script data-proto-review="appearance">
/* PRD 内容色板与序号外观；编辑、导出和发布共用。 */
(() => {
    'use strict';
    const TEXT_COLORS = [
        ['#191919', '黑色'], ['#1684fc', '蓝色'], ['#8a38f5', '紫色'], ['#666666', '灰色'],
        ['#fbfbfb', '白色'], ['#ec4954', '红色'], ['#ff9f29', '橙色']
    ];
    const DEFAULT_PIN = '#2563eb', INK = '#191919', STROKE = '#4e5560', ON_BLUE = '#ffffff';
    const PIN_COLORS = [
        [DEFAULT_PIN, '默认蓝色'],
        ['#acbcd1', '灰蓝'], ['#ff9e93', '珊瑚'], ['#ff9e47', '橙色'], ['#fdd143', '黄色'], ['#9dc4ff', '浅蓝'],
        ['#38cde7', '青色'], ['#54d691', '绿色'], ['#daa3ff', '紫色'], ['#ff94e4', '粉色']
    ];
    const LEGACY_PIN_COLORS = ['#e6e6e6'];
    function pinColor(note) {
        const color = String(note?.color || '').toLowerCase();
        return PIN_COLORS.some(([hex]) => hex === color) || LEGACY_PIN_COLORS.includes(color) ? color : DEFAULT_PIN;
    }
    function applyPin(element, note) {
        const color = pinColor(note), custom = color !== DEFAULT_PIN;
        element.style.setProperty('--pin-fill', color);
        element.style.setProperty('--pin-ink', custom ? INK : ON_BLUE);
        element.style.setProperty('--pin-stroke', custom ? STROKE : ON_BLUE);
    }
    window.ProtoAppearance = { TEXT_COLORS, PIN_COLORS, DEFAULT_PIN, pinColor, applyPin };
})();

</script>
