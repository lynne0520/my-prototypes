<script data-prototype-owned data-proto-hotspot-bootstrap data-proto-review="hotspots">
/* 点击空白时短暂提示本次需求范围内的真实交互；未声明范围时不扫描整页。 */
(() => {
    'use strict';
    if (window.ProtoHotspots) return;
    const DURATION = 2000, MAX_HINTS = 80;
    const COLORS = { fill: '#ff9f29' };
    const EVENTS = new Set(['click', 'pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchend']);
    const EDITABLE = 'input,textarea,select,[contenteditable]:not([contenteditable="false"])';
    const BLOCKED = '[hidden],[inert],[aria-hidden="true"],[aria-disabled="true"],[data-proto-hotspot="false"]';
    const CONTROL_TAGS = new Set(['BUTTON', 'A', 'AREA', 'INPUT', 'SELECT', 'TEXTAREA', 'SUMMARY']);
    const CONTROL_ROLES = new Set(['button', 'link', 'checkbox', 'radio', 'switch', 'tab', 'menuitem', 'option', 'combobox', 'slider', 'textbox']);
    const owned = el => !!el?.closest?.('[data-prototype-owned],.__review_pin,.__review_pop,.__review_guide');
    let options = {}, layer, style, observer, timer = 0, frame = 0, started = 0, down = null;
    const boxes = new Map();

    // 先于业务脚本载入：只记录实际绑定，不运行任何按钮来试探功能。
    const listeners = new WeakMap();
    const nativeAdd = EventTarget.prototype.addEventListener, nativeRemove = EventTarget.prototype.removeEventListener;
    const captureOf = config => typeof config === 'boolean' ? config : !!config?.capture;
    EventTarget.prototype.addEventListener = function (type, listener, config) {
        if (!EVENTS.has(type) || !listener || typeof listener !== 'function' && typeof listener.handleEvent !== 'function')
            return nativeAdd.call(this, type, listener, config);
        let entries = listeners.get(this);
        if (!entries) { entries = new Set(); listeners.set(this, entries); }
        const capture = captureOf(config);
        const existing = [...entries].find(entry => entry.type === type && entry.listener === listener && entry.capture === capture && !entry.signal?.aborted);
        if (existing) return nativeAdd.call(this, type, existing.wrapper, config);
        const entry = { type, listener, capture, once: !!config?.once, signal: config?.signal };
        entry.wrapper = function (event) {
            if (entry.once) { entries.delete(entry); schedule(); }
            return typeof listener === 'function' ? listener.call(this, event) : listener.handleEvent.call(listener, event);
        };
        const result = nativeAdd.call(this, type, entry.wrapper, config);
        if (!entry.signal?.aborted) {
            entries.add(entry);
            if (entry.signal) nativeAdd.call(entry.signal, 'abort', () => { entries.delete(entry); schedule(); }, { once: true });
            schedule();
        }
        return result;
    };
    EventTarget.prototype.removeEventListener = function (type, listener, config) {
        const entries = listeners.get(this), capture = captureOf(config);
        const entry = entries && [...entries].find(item => item.type === type && item.listener === listener && item.capture === capture);
        if (!entry) return nativeRemove.call(this, type, listener, config);
        const result = nativeRemove.call(this, type, entry.wrapper, config);
        entries.delete(entry); schedule(); return result;
    };

    function binding(el) {
        if ([...EVENTS].some(type => typeof el['on' + type] === 'function')) return true;
        const reactRoot = Object.keys(el).some(key => key.startsWith('__reactContainer$'));
        if (!reactRoot && [...(listeners.get(el) || [])].some(entry => !entry.signal?.aborted)) return true;
        // React 的点击监听由根节点代理，真实业务回调在元素 props 上。
        const props = Object.keys(el).find(key => key.startsWith('__reactProps$'));
        return !!props && Object.entries(el[props] || {}).some(([key, value]) =>
            /^on(Click|PointerDown|PointerUp|MouseDown|MouseUp|TouchEnd)(Capture)?$/.test(key) && typeof value === 'function');
    }
    function navigation(el) {
        if (!el.matches('a[href],area[href]')) return false;
        const href = el.getAttribute('href').trim();
        if (!href || href === '#' || /^javascript:/i.test(href)) return false;
        if (href.startsWith('#')) {
            let id; try { id = decodeURIComponent(href.slice(1)); } catch (_) { return false; }
            return !!document.getElementById(id) || !!document.getElementsByName(id).length;
        }
        return true;
    }
    function nativeAction(el) {
        if (el.matches('select,input[type="checkbox"],input[type="radio"],input[type="file"],input[type="color"],input[type="range"]')) return true;
        if (el.tagName === 'SUMMARY') return el.parentElement?.tagName === 'DETAILS' && el.parentElement.querySelector('summary') === el;
        if (el.matches('button,input') && el.form) return el.type === 'submit' || el.type === 'reset';
        return false;
    }

    function enabled() {
        try { return typeof options.isEnabled === 'function' ? !!options.isEnabled() : options.enabled !== false; }
        catch (_) { return false; }
    }
    function action(el) {
        if (!(el instanceof Element) || el === document.body || el === document.documentElement || owned(el) || el.closest(BLOCKED) || el.matches(':disabled')) return false;
        return el.dataset.protoHotspot === 'true' || binding(el) || navigation(el) || nativeAction(el);
    }
    function controlLike(el) {
        return CONTROL_TAGS.has(el.tagName) && !(el.tagName === 'INPUT' && el.type === 'hidden')
            || CONTROL_ROLES.has(el.getAttribute('role')) || el.dataset.protoHotspot === 'true';
    }
    function controlIssue(el) {
        // 仅截图专用运行时中用户手动画出的矩形可使用自定尺寸。
        if (window.ProtoScreenshot && el.parentElement?.id === 'screenshot-regions' && el.classList.contains('screenshot-region')) return null;
        // 事件代理容器不能替代实际操作节点，未授权的子控件也不能让父容器整块高亮。
        if (!CONTROL_TAGS.has(el.tagName) && [...el.querySelectorAll('*')].some(child =>
            !owned(child) && (controlLike(child) || action(child)))) return 'container';
        const rect = el.getBoundingClientRect();
        // 长而矮的整行按钮可保留；高且大面积的卡片 / 面板需拆到具体控件。
        if (rect.height > 96 && rect.width * rect.height > Math.min(64000, innerWidth * innerHeight * .12)) return 'oversized';
        return null;
    }
    function currentScope() {
        try { return typeof options.scope === 'function' ? options.scope() : options.scope; }
        catch (_) { return null; }
    }
    function inScope(el, scope = currentScope()) {
        if (scope?.mode === 'all') return true;
        if (scope?.mode !== 'targets' || !Array.isArray(scope.protoIds)) return false;
        // 范围只授权该控件自身；容器标注不授权内部的历史交互。
        return scope.protoIds.includes(el.getAttribute('data-proto-id'));
    }
    function hitAction(target) {
        if (currentScope()?.manualTargets?.length && scan().some(item => item.source === 'manual' && item.status === 'ready' && item.el.contains(target))) return true;
        for (let el = target instanceof Element ? target : target?.parentElement; el && el !== document.documentElement; el = el.parentElement)
            if ((controlLike(el) || action(el)) && !controlIssue(el) && rectFor(el)) return true;
        return false;
    }
    function rectFor(el) {
        if (!el?.isConnected || owned(el) || el.closest(BLOCKED) || el.matches(':disabled')) return null;
        const original = el.getBoundingClientRect();
        let left = Math.max(0, original.left), top = Math.max(0, original.top);
        let right = Math.min(innerWidth, original.right), bottom = Math.min(innerHeight, original.bottom);
        for (let node = el; node && node !== document.documentElement; node = node.parentElement) {
            const css = getComputedStyle(node);
            if (css.display === 'none' || css.visibility === 'hidden' || Number(css.opacity) === 0) return null;
            if (node === el) continue;
            const clip = node.getBoundingClientRect();
            if (/hidden|clip|auto|scroll/.test(css.overflowX)) { left = Math.max(left, clip.left); right = Math.min(right, clip.right); }
            if (/hidden|clip|auto|scroll/.test(css.overflowY)) { top = Math.max(top, clip.top); bottom = Math.min(bottom, clip.bottom); }
        }
        if (right - left < 4 || bottom - top < 4) return null;
        if ((right - left) * (bottom - top) > innerWidth * innerHeight * .65 && !(window.ProtoScreenshot && el.parentElement?.id === 'screenshot-regions')) return null;
        const points = [[.5, .5], [.2, .2], [.8, .8]];
        if (!points.some(([x, y]) => {
            const hit = document.elementFromPoint(left + (right - left) * x, top + (bottom - top) * y);
            return hit === el || !!hit && el.contains(hit);
        })) return null;
        return { left, top, right, bottom };
    }
    function examine(el, manual = false) {
        if (owned(el) || el.closest('[data-proto-hotspot="false"]')) return { status: 'excluded' };
        if (el.matches(':disabled') || el.closest('[inert],[aria-disabled="true"]')) return { status: 'disabled' };
        for (let node = el; node && node !== document.documentElement; node = node.parentElement) {
            const css = getComputedStyle(node);
            if (node.matches('[hidden],[aria-hidden="true"]') || css.display === 'none' || css.visibility === 'hidden' || Number(css.opacity) === 0)
                return { status: 'hidden' };
        }
        if (/^(SCRIPT|STYLE|LINK|META|OPTION|OPTGROUP|PATH|SVG)$/.test(el.tagName)) return { status: 'unsupported' };
        const issue = controlIssue(el);
        if (issue) return { status: issue };
        if (!manual && !action(el)) return { status: 'no-action' };
        const bounds = el.getBoundingClientRect();
        if (!bounds.width || !bounds.height) return { status: 'hidden' };
        if (bounds.bottom <= 0 || bounds.top >= innerHeight || bounds.right <= 0 || bounds.left >= innerWidth) return { status: 'offscreen' };
        const rect = rectFor(el);
        return rect ? { status: 'ready', rect } : { status: 'occluded' };
    }
    function scan(scope = currentScope()) {
        const elements = [...document.querySelectorAll('body *')], byId = new Map();
        for (const el of elements) {
            const id = el.getAttribute('data-proto-id');
            if (id) { if (!byId.has(id)) byId.set(id, []); byId.get(id).push(el); }
        }
        const anchorFor = el => {
            if (window.ProtoAnchors) {
                const A = window.ProtoAnchors;
                return { protoId: el.getAttribute('data-proto-id') || '', selector: A.selector(el), tag: el.tagName.toLowerCase(), text: A.text(el), parentText: A.text(el.parentElement) };
            }
            return { protoId: el.getAttribute('data-proto-id') || '', selector: el.id ? '#' + CSS.escape(el.id) : '', tag: el.tagName.toLowerCase() };
        };
        const resolve = anchor => {
            if (anchor?.protoId) { const hits = byId.get(anchor.protoId) || []; return hits.length === 1 ? hits[0] : null; }
            if (window.ProtoAnchors) return window.ProtoAnchors.resolveHidden(anchor);
            try { const hits = [...document.querySelectorAll(anchor?.selector || ':not(*)')]; return hits.length === 1 ? hits[0] : null; } catch (_) { return null; }
        };
        let entries = [];
        if (scope?.mode === 'targets' && Array.isArray(scope.protoIds)) {
            entries = scope.protoIds.map(protoId => {
                const hits = byId.get(protoId) || [];
                const base = { protoId, key: 'proto:' + protoId, source: 'declared', anchor: { protoId } };
                if (hits.length !== 1) return { ...base, status: hits.length ? 'duplicate' : 'missing' };
                return { ...base, el: hits[0], label: labelFor(hits[0]), anchor: anchorFor(hits[0]), ...examine(hits[0]) };
            });
        } else if (scope?.mode === 'all') {
            entries = elements.filter(el => action(el)).map(el => ({
                protoId: el.getAttribute('data-proto-id') || el.id || el.tagName.toLowerCase(), source: 'automatic',
                anchor: anchorFor(el), label: labelFor(el), key: 'all:' + (el.getAttribute('data-proto-id') || el.id || anchorFor(el).selector), el, ...examine(el)
            }));
        }
        for (const target of scope?.manualTargets || []) {
            const el = resolve(target.anchor);
            const existing = el && entries.find(item => item.el === el);
            if (existing) entries = entries.filter(item => item !== existing);
            entries.push({ ...target, key: 'manual:' + target.id, source: 'manual', protoId: target.anchor.protoId || target.id, el,
                ...(el ? examine(el, true) : { status: target.anchor.protoId && (byId.get(target.anchor.protoId)?.length || 0) > 1 ? 'duplicate' : 'missing' }) });
        }
        const excluded = (scope?.excludedTargets || []).map(target => resolve(target.anchor)).filter(Boolean);
        for (const item of entries) if (item.el && excluded.includes(item.el)) item.status = 'excluded';
        const ready = entries.filter(item => item.status === 'ready');
        let count = 0;
        for (const item of ready) {
            if (ready.some(other => other.el !== item.el && item.el.contains(other.el))) item.status = 'contains-target';
            else if (++count > MAX_HINTS) item.status = 'limit';
        }
        return entries;
    }
    function labelFor(el) { return (el.getAttribute('aria-label') || el.getAttribute('title') || el.textContent || el.value || el.tagName).replace(/\s+/g, ' ').trim().slice(0, 120); }
    function candidate(el) { return el instanceof Element ? { ...examine(el, true), label: labelFor(el) } : { status: 'missing' }; }
    // 只读诊断，不执行点击、不展开页面，也不修改 PRD / 提示配置。
    function inspect() {
        const scope = currentScope();
        return { mode: scope?.mode || 'off', enabled: enabled(), items: scan(scope).map(({ el, ...item }) => item) };
    }
    function position(box, rect) {
        box.style.left = Math.max(0, rect.left - 3) + 'px';
        box.style.top = Math.max(0, rect.top - 3) + 'px';
        box.style.width = Math.min(innerWidth, rect.right + 3) - Math.max(0, rect.left - 3) + 'px';
        box.style.height = Math.min(innerHeight, rect.bottom + 3) - Math.max(0, rect.top - 3) + 'px';
    }
    function hide() {
        clearTimeout(timer); timer = 0;
        cancelAnimationFrame(frame); frame = 0;
        boxes.clear(); layer?.replaceChildren();
    }
    function refresh() {
        frame = 0;
        if (!enabled()) { hide(); return; }
        const ready = new Map(scan().filter(item => item.status === 'ready').map(item => [item.el, item.rect]));
        for (const [el, box] of boxes) {
            const rect = ready.get(el);
            if (!rect) { box.remove(); boxes.delete(el); }
            else position(box, rect);
        }
    }
    function schedule() {
        if (boxes.size && !frame) frame = requestAnimationFrame(refresh);
    }
    function show() {
        if (!layer || !enabled()) { hide(); return 0; }
        const scope = currentScope();
        if (scope?.mode !== 'all' && (scope?.mode !== 'targets' || !scope.protoIds?.length && !scope.manualTargets?.length)) { hide(); return 0; }
        if (boxes.size && performance.now() - started < DURATION) { refresh(); return boxes.size; }
        hide();
        for (const { el, rect } of scan(scope).filter(item => item.status === 'ready')) {
            const box = document.createElement('div');
            box.className = 'ph-box'; box.setAttribute('data-prototype-owned', '');
            box.dataset.hotspotFor = el.getAttribute('data-proto-id') || el.id || el.tagName.toLowerCase();
            position(box, rect); layer.appendChild(box); boxes.set(el, box);
        }
        if (boxes.size) { started = performance.now(); timer = setTimeout(hide, DURATION); }
        return boxes.size;
    }
    function pointerDown(event) { down = { x: event.clientX, y: event.clientY, moved: false }; }
    function pointerMove(event) {
        if (down && Math.hypot(event.clientX - down.x, event.clientY - down.y) > 8) down.moved = true;
    }
    function click(event) {
        const drag = down?.moved; down = null;
        const target = event.target instanceof Element ? event.target : event.target?.parentElement;
        if (!enabled() || owned(target) || hitAction(target)) { hide(); return; }
        if (event.defaultPrevented || event.button !== 0 || event.detail === 0 || drag || target?.closest(EDITABLE) || String(getSelection()).trim()) return;
        show();
    }
    function mutations(records) {
        if (!boxes.size) return;
        for (const record of records) {
            if (owned(record.target)) continue;
            if (record.type === 'attributes' && /data-proto-(page|state)/.test(record.attributeName)) { hide(); return; }
            if (record.type === 'childList' && [...record.addedNodes, ...record.removedNodes].every(node => node instanceof Element && owned(node))) continue;
            schedule(); break;
        }
    }
    function init(config = {}) {
        options = config;
        if (layer) { hide(); return window.ProtoHotspots; }
        style = document.createElement('style'); style.setAttribute('data-prototype-owned', '');
        style.textContent = `
.ph-layer{--ph-fill:${COLORS.fill};--ph-opacity-low:.18;--ph-opacity-high:.42;--ph-opacity-still:.3;position:fixed;inset:0;z-index:2147481000;border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;pointer-events:none!important;overflow:hidden;}
.ph-layer .ph-box{position:absolute;box-sizing:border-box;margin:0;padding:0;border:0!important;outline:0!important;border-radius:6px;background:var(--ph-fill);box-shadow:none!important;pointer-events:none!important;opacity:var(--ph-opacity-still);animation:ph-discover ${DURATION}ms cubic-bezier(.4,0,.2,1) 1 forwards;}
@keyframes ph-discover{0%{opacity:var(--ph-opacity-low)}20%{opacity:var(--ph-opacity-high)}45%{opacity:var(--ph-opacity-low)}70%{opacity:var(--ph-opacity-high)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.ph-layer .ph-box{animation:none;opacity:var(--ph-opacity-still)}}
`;
        layer = document.createElement('div'); layer.className = 'ph-layer';
        layer.setAttribute('data-prototype-owned', ''); layer.setAttribute('aria-hidden', 'true');
        (document.head || document.documentElement).appendChild(style); document.documentElement.appendChild(layer);
        document.addEventListener('pointerdown', pointerDown, true);
        document.addEventListener('pointermove', pointerMove, true);
        document.addEventListener('pointercancel', hide, true);
        document.addEventListener('click', click);
        document.addEventListener('scroll', schedule, true);
        window.addEventListener('resize', schedule);
        window.addEventListener('pagehide', hide);
        observer = new MutationObserver(mutations);
        observer.observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['style', 'class', 'hidden', 'inert', 'disabled', 'aria-hidden', 'aria-disabled', 'role', 'onclick', 'href', 'type', 'data-proto-id', 'data-proto-hotspot', 'data-proto-state', 'data-proto-page'] });
        return window.ProtoHotspots;
    }
    function destroy() {
        hide(); observer?.disconnect(); observer = null;
        document.removeEventListener('pointerdown', pointerDown, true);
        document.removeEventListener('pointermove', pointerMove, true);
        document.removeEventListener('pointercancel', hide, true);
        document.removeEventListener('click', click);
        document.removeEventListener('scroll', schedule, true);
        window.removeEventListener('resize', schedule); window.removeEventListener('pagehide', hide);
        layer?.remove(); style?.remove(); layer = null; style = null; down = null;
    }
    window.ProtoHotspots = { init, show, hide, destroy, inspect, candidate };
})();

</script>

    <script>
    /* ════════════════════════════════════════════════════════════════
       class-report.html · 班级报告（方案 10.1：R1/R3 共用一页，?role= 控制）
       - teacher → R1 整合班级报告（模块 1~10；m8 承载原 R2 的年级定位、匿名对标与共性摘要）
       - leader  → R3 班级对比报告（模块 1~7 + 教师视角明细折叠，异常导向）
       - 全部为演示 mock，无真实数据接入；阈值读 RP_CONFIG，不硬编码
       ════════════════════════════════════════════════════════════════ */
    (function () {
        'use strict';
        var LEAD = RP_PARAMS.role === 'leader';
        var CLS = RP_PARAMS.cls;
        var C = RP_CLASSES.find(function (x) { return x.cls === CLS; });
        var M = C && C.status === 'reviewed' ? rpMetrics(CLS) : null;
        var G = rpGradeMetrics();
        var RK = M ? rpRank(CLS) : null;
        var SMALL = !!(M && M.small);

        /* 页面级 UI 状态（重渲染只动对应模块，不清空批注框） */
        var UI = {
            view: 'tbl',                 /* R3 模块 2：表格 ↔ 图形 */
            thr: RP_CONFIG.lecture,      /* 讲评阈值，报告内可调、实时重算 */
            onlyLect: false,             /* 模块 3：只看需讲评题 */
            drill: null,                 /* 模块 3：当前下标题号 */
            t4Tab: 'chart',              /* 模块 4：掌握率图 ↔ 知识点明细 */
            kpDim: RP_KP_DIM_DEFAULT,    /* 知识点维度（同步 / 复习…）：各维度独立统计，切换只换视图 */
            m5Tab: 'q',                  /* 模块 5：按题目（班级汇总）↔ 按学生（个人下钻） */
            m5Open: null,                /* 模块 5：按题目视图中展开的题号索引（null = 初始化为失分最大的两题） */
            m5Stu: '',                   /* 模块 5：按学生视图中选中的学生学号 */
            m5Cause: '',                 /* 模块 5：按学生视图的错因筛选（空 = 全部） */
            m5Search: '',                /* 模块 5：按学生视图的名单搜索词 */
            keyLect: []                  /* 模块 6：手动设为重点讲评的题号（sessionStorage 持久化） */
        };
        try {
            var kl = sessionStorage.getItem('rp-keylect-' + RP_PARAMS.hw);
            if (kl) UI.keyLect = JSON.parse(kl) || [];
        } catch (e) { }

        /* ── 小工具 ── */
        function diffCls(v, invert) {
            if (v == null) return '';
            var good = invert ? v < 0 : v > 0;
            return v === 0 ? '' : (good ? 'up' : 'dn');
        }
        function pp(v) {
            if (v == null) return '—';
            return '<span class="' + diffCls(v) + '">' + rpPp(v) + '</span>';
        }
        function num(v, unit) { return v == null ? '<span class="na">样本不足</span>' : v + (unit || ''); }
        function mod(id, no, title, sub, aside, body, opt) {
            opt = opt || {};
            return '<section class="mod" id="' + id + '">'
                + (opt.prd ? '<span class="prd-badge" data-prd="' + opt.prd + '" title="查看 PRD ' + opt.prd + '：' + rpEsc(title) + '">' + opt.prd + '</span>' : '')
                + '<div class="mod-h"><span class="mod-no">' + no + '</span>'
                + '<span class="mod-title">' + rpEsc(title) + (opt.star ? ' <span class="star">' + rpStar() + '</span>' : '') + '</span>'
                + (sub ? '<span class="mod-sub">' + rpEsc(sub) + '</span>' : '')
                + (opt.help ? opt.help : '')
                + (aside ? '<div class="mod-aside">' + aside + '</div>' : '')
                + '</div><div class="mod-b' + (opt.tight ? ' tight' : '') + '">' + body + '</div></section>';
        }
        function smallNote() {
            return '<div class="rp-note"><b>小样本：</b>本班有效样本 ' + M.valid + ' 人，位次 / 分位 / 显著性不可用，各档率显示为「样本不足」。</div>';
        }
        /* ── 知识点维度：切换控件 + 依存模块的维度说明 ──
           维度是并列的（同步 / 复习…），没有能力 / 素养维度；切换只改变视图，不改变任何比率口径 */
        function dimName() { return rpDim(UI.kpDim).n; }
        function kpDimAside() {
            return '<span class="kp-dim"><span class="kp-dim-lb">知识点维度</span>'
                + '<span class="seg" role="tablist" aria-label="知识点维度切换">'
                + RP_KP_DIMS.map(function (d) {
                    return '<button type="button" class="' + (UI.kpDim === d.id ? 'on' : '') + '" data-kpdim="' + d.id
                        + '" role="tab" aria-selected="' + (UI.kpDim === d.id) + '" title="' + rpEsc(d.n + '：' + d.desc + '（独立统计）') + '">'
                        + rpEsc(d.n) + '</button>';
                }).join('') + '</span>'
                + '<span class="kp-dim-cur">' + rpEsc(dimName()) + '</span></span>';
        }
        function dimLine(extra) {
            return '<div class="dim-line">知识点维度：<b>' + rpEsc(dimName()) + '</b>'
                + '<span class="dim-why">' + rpEsc(rpKpsOfDim(UI.kpDim).length + ' 个知识点，各维度独立统计、不跨维度合并')
                + (extra ? '；' + rpEsc(extra) : '') + '</span></div>';
        }
        /* 主观题得分点命中率（演示 mock：由题目得分率派生） */
        function subPoints(q, rate) {
            var r = rpRand(parseInt(q.no, 10) * 13 + 7);
            var pts = q.no === '12'
                ? ['格式与称呼语', '要点覆盖（3 点）', '语言准确性', '连贯与衔接']
                : ['要点 1 · 关键信息', '要点 2 · 语法结构', '要点 3 · 词汇准确'];
            return pts.map(function (p) { return { n: p, v: Math.round(rpClamp(rate + (r() * 22 - 11), 5, 99) * 10) / 10 }; });
        }
        function qLost(i) {
            return Math.round(C.valid * RP_QUESTIONS[i].score * (1 - C.qRates[i] / 100));
        }
        /* 规则化「建议讲法」文案（方案 R1 模块 6）——需讲评来源不同，讲法不同：阈值题靠得分率定动作，标记题靠标记人定入口 */
        function suggestHow(i) {
            var q = RP_QUESTIONS[i], rate = C.qRates[i];
            var kp = kpOf(q.kps[0]);
            var cs = (RP_CAUSES.find(function (x) { return x.id === q.cause; }) || {}).n;
            var wrongN = rpWrongStudents(CLS, i).length;
            var gap = rate - RP_GRADE.qRates[i];
            var src = rpMarkSource(rate, i, UI.thr);
            if (rate < 50) return '全班重讲：回到「' + kp + '」规则起点重建判据，用最高错误项暴露误判路径，当堂变式 2 题检测（主错因：' + cs + '）。';
            if (rate < UI.thr) return '分组讲评：做错 ' + wrongN + ' 人集中讲「' + cs + '」，其余学生做同知识点变式拓展，避免全班陪听。';
            if (src && src.k === 'stu') return '学生主动标记：得分率 ' + rate + '% 不代表真没问题——先请标记学生说出卡在哪一步，再针对「' + cs + '」补 1 题变式，其余学生不暂停。';
            if (src && src.k === 'tea') return '教师标记题：得分率 ' + rate + '% 尚可，但批改中有典型问题——只讲你标记的那一类错误（' + cs + '），不铺开全题。';
            if (gap < -8) return '本班独有短板：年级 ' + RP_GRADE.qRates[i] + '% 而本班 ' + rate + '%，差 ' + Math.abs(Math.round(gap * 10) / 10) + 'pp，优先排查讲练是否到位。';
            return '点到即止：得分率已达 ' + rate + '%，只讲典型错误 1 例，课堂时间让给更低分题。';
        }

        /* ══════════════════════ 页面操作（挂在锚点导航右侧，替代原报告头） ══════════════════════
           导出不再直接 window.print()：打开 export-class.html 导出壳页（可调版的 HTML），由壳页再另存为 PDF */
        function headActions() {
            return '<button class="rp-btn primary" data-act="print">导出 / 打印</button>';
        }
        /* 未交名单：按需弹右侧抽屉（不计 0 分，不进任何均值与档位） */
        function openUnsub() {
            var list = rpUnsubmitted(CLS);
            if (!list.length) { rpToast('本次全部提交，无未交名单'); return; }
            var rows = list.map(function (s, i) {
                return '<tr><td>' + (i + 1) + '</td><td><b>' + rpEsc(s.name) + '</b></td><td>' + rpEsc(s.examNum) + '</td>'
                    + '<td><span class="tag-lv none">' + s.status + '</span></td></tr>';
            }).join('');
            rpDrawer('未交名单 · ' + CLS + ' 班',
                '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>学生</th><th>学号</th><th>状态</th></tr></thead><tbody>'
                + rows + '</tbody></table></div>'
                + '<div class="rp-note">未提交学生不计入平均分与档位，只影响提交率。</div>',
                '应交 ' + M.total + ' · 实交 ' + M.submitted + ' · 未交 ' + list.length);
        }

        /* ══════════════════════ T1 / L1 · KPI 概况 ══════════════════════
           5 卡固定顺序：班级平均分 → 班级得分率 → 优秀率 → 及格率 → 低分率；
           平均分与得分率是同一水平的两套单位（分 / %），故并列前两卡，主卡落在平均分上；
           每卡都带年级同口径值与差值（平均分给「分」，率给「pp」）；
           提交率与有效样本是次级信息，降级为卡下小注行（.kpi-foot），未交名单等交互保留 */
        function kpiCards() {
            var mSc = rpScoreOf(M.mean), gSc = rpScoreOf(G.mean);
            var dSc = Math.round((mSc - gSc) * 10) / 10;
            function card(lb, val, ref, cls2) {
                return '<div class="kpi' + (cls2 ? ' ' + cls2 : '') + '"><div class="k-lb">' + lb + '</div>'
                    + '<div class="k-v">' + val + '</div><div class="k-ref">' + ref + '</div></div>';
            }
            function rateVal(v) {
                if (SMALL) return '<span class="na">样本不足</span>';
                return v + '<small>%</small>';
            }
            function rateRef(v, gv, invert) {
                if (SMALL) return '有效样本 &lt; ' + RP_CONFIG.smallSample + '，不参与比较';
                var d = Math.round((v - gv) * 10) / 10;
                return '年级 ' + gv + '% · <span class="' + diffCls(d, invert) + '">' + rpPp(d) + '</span>';
            }
            var cards = [];
            /* ① 平均分（主卡）：得分率换算成分值，满分作为标签尾注不占副标行；差值同样按分值给，不用 pp */
            cards.push(card('班级平均分<span class="k-lb-note">满分 ' + rpFullScore() + '</span>', mSc.toFixed(1) + '<small> 分</small>',
                '年级 ' + gSc.toFixed(1) + ' 分 · <span class="' + diffCls(dSc) + '">' + rpScoreDiff(dSc) + '</span>',
                'hero' + (dSc < 0 ? ' warn' : '')));
            /* ② 得分率：与年级同口径（%）；均分差属位置信息（非率类比率），小样本也给差值，
               与平均分卡保持同一判断；组长版追加年级位次徽标（位次按得分率排） */
            var dRate = Math.round((M.mean - G.mean) * 10) / 10;
            cards.push(card('班级得分率', M.mean + '<small>%</small>',
                '年级 ' + G.mean + '% · <span class="' + diffCls(dRate) + '">' + rpPp(dRate) + '</span>'
                + (LEAD && !SMALL ? ' <span class="rank-bdg">年级第 ' + RK.rank + ' / ' + RK.total + ' 班</span>' : '')));
            cards.push(card('优秀率', rateVal(M.exRate), rateRef(M.exRate, G.exRate), M.exRate < G.exRate && !SMALL ? 'warn' : ''));
            cards.push(card('及格率', rateVal(M.passRate), rateRef(M.passRate, G.passRate), M.passRate < G.passRate && !SMALL ? 'warn' : ''));
            cards.push(card('低分率', rateVal(M.lowRate), rateRef(M.lowRate, G.lowRate, true), M.lowRate > G.lowRate && !SMALL ? 'bad' : ''));
            /* 提交率 / 有效样本小注：保留年级差值、未交名单入口与小样本警示，但不再与均分抢视觉焦点 */
            var foot = '<span>提交率 <b' + (M.subRate < 90 ? ' class="warn"' : '') + '>' + M.subRate + '%</b>（年级 ' + G.subRate + '% · '
                + rpPp(Math.round((M.subRate - G.subRate) * 10) / 10) + '）'
                + (M.submitted < M.total ? ' <a href="#" data-act="unsub">未交名单</a>' : '') + '</span>'
                + '<span>有效样本 <b' + (SMALL ? ' class="warn"' : '') + '>' + M.valid + ' 人</b>（应交 ' + M.total + ' · 空白 ' + M.blank + ' · 异常 ' + M.abnormal + '）</span>';
            return '<div class="kpi-grid five m1-kpi">' + cards.join('') + '</div><div class="kpi-foot">' + foot + '</div>';
        }
        /* ══════════════════════ M1 · 概览汇总结论（总结性文本：① 水平与结构 ② 讲评安排 ③ 数据可信度） ══════════════════════
           概览不只要数字，还要直接给教师 / 领导可执行的结论；阈值全部读 RP_CONFIG，不写死文案
           每条结论独立一段、行首序号圆自动编号（report.css），判定项与阈值全部收进标题旁「?」，两处读同一份 CONCL 数据 */
        function r1(v) { return Math.round(v * 10) / 10; }
        function kpOf(id) { var k = rpKpOf(id); return k ? k.n : id; }
        /* 带维度前缀的知识点名称（如「同步·Unit1 语法·定语从句」）：用到单知识点结论时，避免读者误以为跨维度汇总 */
        function kpLabel(id) { var d = rpKpDimOf(id); return (d ? d.short + '·' : '') + kpOf(id); }
        function qList() {
            return RP_QUESTIONS.map(function (q, i) { return { i: i, no: q.no, rate: C.qRates[i], kps: q.kps }; })
                .sort(function (a, b) { return a.rate - b.rate; });
        }
        var CONCL = null;   /* 结论数据缓存：正文结论条与标题「?」共用同一份，避免两套口径 */
        function conclData() { return CONCL || (CONCL = buildConcl()); }
        function conclBody() {
            var d = conclData();
            return rpConclProse({ tag: d.tag, paras: d.paras });
        }
        /* 标题旁「?」：把判定规则、档位口径、阈值来源统一收到一处，正文只留结论 */
        function conclHelp() {
            var d = conclData();
            var rows = d.rules.map(function (x) {
                return [x.n, x.n === '档位结构'
                    ? x.rule + '（读生产「设置等级」同一份配置，报告不自设第二套档位）'
                    : x.rule];
            });
            rows.push(['阈值口径', '阈值统一读 RP_CONFIG（与讲评阈值、等级设置同一份配置），结论随本次数据自动重算，不是写死文案。'
                + (LEAD ? ' 每条结论的完整依据可在对应模块展开查看。' : ' 讲评顺序与名单见模块 3、6。')]);
            rows.push(['样本口径', '有效样本 = 实交 − 空白卷 − 异常卷，本页有效 ' + M.valid + ' 人（应交 ' + M.total + ' / 实交 ' + M.submitted + '）。']);
            rows.push(['等级四档', RP_TIERS.map(function (t) { return t.n + ' ' + t.rule(); }).join(' · ') + '（累计口径，读生产「设置等级」同一份配置）。']);
            rows.push(['年级聚合', '按有效人数加权（方案 8.1），非班级简单平均。']);
            rows.push(['讲评数据来源', '三源取并集——① 学生端标记 ② 教师端标记 ③ 得分率 &lt; 讲评阈值（默认 ' + RP_CONFIG.lecture + '%，报告内可调）；每条讲评条目标注来源徽标。']);
            rows.push(['错因数据范围', '仅「大模型智批」的题目有错因数据；只判分、未接入大模型智批的题目不计入错因统计。']);
            rows.push(['小样本保护', '有效样本 &lt; ' + RP_CONFIG.smallSample + ' 时隐藏排名 / 分位 / 显著性，率显示「样本不足」' + (SMALL ? '——本班已触发。' : '——本班未触发。')]);
            rows.push(['范围声明', '本报告只呈现本次作业数据，不含跨次对比、趋势与历史预警。']);
            rows.push(['演示声明', '本页全部数据为 mock，无真实数据接入；答题时长、班级分组、知识点映射、资源库均未接入。']);
            return rpHelp('统计口径与判定规则', rows);
        }
        function buildConcl() {
            var all = qList();
            var lect = all.filter(function (x) { return rpNeedLect(x.rate, x.i, UI.thr); });
            var worst = lect[0] || all[0];
            var dMean = SMALL ? null : r1(M.mean - G.mean);
            var gaps = rpHist(CLS).filter(function (b) { return b.hl; }).map(function (b) { return b.lb; });

            /* 正文只给文字强调：bad 红 / warn 橙 / '' 不着色——胶囊徽标是清单式排版的产物，已随表格一并取消 */
            function em(lvl, txt) { return lvl ? '<b class="cp-t ' + lvl + '">' + txt + '</b>' : txt; }
            var tierRule = '四档累计口径：' + RP_TIERS.map(function (t) { return t.n + ' ' + t.rule(); }).join(' · ');
            var sampleRule = '有效样本 &lt; ' + RP_CONFIG.smallSample + ' 人 → 隐藏排名 / 分位 / 显著性，各档率显示「样本不足」';
            var rules = [], paras = [];

            /* 两版共用：档位结构判定与讲评安排事实，差异只在角色收尾 */
            var tierLvl = '', tierTxt;
            if (M.lowRate > G.lowRate) {
                tierLvl = 'warn';
                tierTxt = '低分率高于年级 ' + r1(M.lowRate - G.lowRate) + 'pp，尾部规模偏大';
            } else if (M.passRate < G.passRate) {
                tierLvl = 'warn';
                tierTxt = '及格率低于年级 ' + r1(G.passRate - M.passRate) + 'pp，卡线学生是主要失分群体';
            } else {
                tierTxt = '低分率不高于年级、及格率不低于年级，档位结构无明显问题';
            }
            var lectTxt = '本次需讲评 <b>' + lect.length + ' 题</b>（共 ' + RP_QUESTIONS.length + ' 题；学生端标记 / 教师端标记 / 得分率低于 ' + UI.thr + '% 三源取并集），最低是第 <b>' + worst.no + ' 题</b>「' + kpLabel(worst.kps[0]) + '」<b>' + worst.rate + '%</b>，';

            if (!LEAD) {
                /* ── R1 教师版：① 整体水平 + 档位 + 分布 ② 讲评安排 ③ 样本可信度 ── */
                var lvLvl = '', lvTxt;
                if (dMean < -RP_CONFIG.meanGap) {
                    lvLvl = 'bad';
                    lvTxt = '整体低于年级 ' + Math.abs(dMean) + 'pp，属普遍性问题，本次按「全体重讲」设计';
                } else if (dMean > RP_CONFIG.meanGap) {
                    lvTxt = '整体高于年级 ' + dMean + 'pp，讲评以个别错题为主、优势题少花时间';
                } else {
                    lvTxt = '与年级基本持平（±' + RP_CONFIG.meanGap + 'pp 内），按逐题得分率定讲评顺序即可';
                }
                var sdLvl = '', sdTxt;
                if (M.sd >= RP_CONFIG.sdPp) {
                    sdLvl = 'bad';
                    sdTxt = '两极分化明显，讲评需分两段：低分段补起点、高分段做拓展';
                } else if (gaps.length) {
                    sdLvl = 'warn';
                    sdTxt = '整体集中但存在断层带（' + gaps.join('、') + '），按断层带切分讲评层次';
                } else {
                    sdTxt = '分布集中、与年级同形，无需分层';
                }

                if (SMALL) {
                    paras.push('本班有效样本 <b>' + M.valid + '</b> 人（应交 ' + M.total + ' / 实交 ' + M.submitted + '），低于 <b>' + RP_CONFIG.smallSample + '</b> 人的小样本线：位次、分位与显著性均已隐藏，各档率显示「样本不足」，本次不给整体水平、档位结构与分布形态结论。');
                    paras.push(lectTxt + '但得分率受样本量影响大，建议先逐生面批、再定讲评顺序。');
                } else {
                    paras.push('本班平均得分率 <b>' + M.mean + '%</b>（年级 ' + G.mean + '%），' + em(lvLvl, lvTxt) + '。');
                    paras.push('档位结构上，优秀 <b>' + M.exRate + '%</b>、及格 <b>' + M.passRate + '%</b>、低分 <b>' + M.lowRate + '%</b>，' + em(tierLvl, tierTxt) + '。');
                    paras.push('分布标准差 <b>' + M.sd + 'pp</b>，' + em(sdLvl, sdTxt) + '。');
                    paras.push(lectTxt + (lect.length
                        ? '按讲评清单顺序推进、第 ' + lect[0].no + ' 题排第一；低于 50% 的题按全班重讲，其余按分组讲评。'
                        : '全部达标，课堂时间转给拓展与补练。'));
                    paras.push('有效样本 <b>' + M.valid + '</b> 人（应交 ' + M.total + ' / 实交 ' + M.submitted + '，空白 ' + M.blank + ' 人、异常 ' + M.abnormal + ' 人），样本量足以支撑与年级的比较，上述结论可直接用于本次备课；未交学生不计 0 分，也不进任何均值与档位。');
                }
                rules.push(
                    { n: '整体水平', rule: '班均 − 年级均：低于 −' + RP_CONFIG.meanGap + 'pp 判整体偏低；高于 +' + RP_CONFIG.meanGap + 'pp 判领先；其余判持平' },
                    { n: '档位结构', rule: tierRule },
                    { n: '分布形态', rule: '标准差 ≥ ' + RP_CONFIG.sdPp + 'pp 判两极分化；班级 0 人而相邻档有人的区间记为断层带' },
                    { n: '讲评重点', rule: '三种来源取并集：学生端标记 / 教师端标记 / 班级得分率 &lt; 讲评阈值 ' + UI.thr + '%（阈值报告内可调，调完整表重算）' },
                    { n: '样本可信度', rule: sampleRule }
                );
            } else {
                /* ── R3 领导版：① 年级位次 + 档位 ② 知识点归属 ③ 显著性 + 数据覆盖 ── */
                var watch = !SMALL && RK.rank >= RK.total - 1;
                if (SMALL) {
                    paras.push('该班有效样本仅 <b>' + M.valid + '</b> 人（应交 ' + M.total + ' / 实交 ' + M.submitted + '），位次、分位与显著性均已隐藏，本次不下督导结论，只给原始得分与错题名单。');
                } else {
                    paras.push('该班平均得分率 <b>' + M.mean + '%</b>（年级 ' + G.mean + '%，' + pp(dMean) + '），居年级第 <b>' + RK.rank + ' / ' + RK.total + '</b> 班，'
                        + (watch ? em('bad', '位次靠后、列入重点督导') + '，建议进班听课 1 次并复核最弱知识点讲练' : '位次中上、无需专项督导') + '。');
                    paras.push('档位结构上，优秀 <b>' + M.exRate + '%</b>、及格 <b>' + M.passRate + '%</b>、低分 <b>' + M.lowRate + '%</b>，' + em(tierLvl, tierTxt) + '。');
                }

                /* 知识点归属：每个维度各取最弱一个、各自判定；不同维度的知识点不合并成一个「最弱项」 */
                var weakByDim = RP_KP_DIMS.map(function (d) {
                    return rpKpsOfDim(d.id).map(function (k) { return { id: k.id, n: k.n, v: C.kpRates[k.id], gv: RP_GRADE.kpRates[k.id], dim: d }; })
                        .sort(function (a, b) { return a.v - b.v; })[0];
                }).filter(Boolean);
                var weakKp = weakByDim.slice().sort(function (a, b) { return a.v - b.v; })[0];
                var isCommon = rpCommonWeak(weakKp.dim.id).some(function (w) { return w.id === weakKp.id && w.hit; });
                var kpLvl = '', kpTxt;
                if (weakKp.v >= RP_CONFIG.kp.master) {
                    kpTxt = '已在掌握线 ' + RP_CONFIG.kp.master + '% 之上，无需专项补强';
                } else if (isCommon) {
                    kpTxt = '属年级共性薄弱、不归责到班，等年级统一补强即可';
                } else if (weakKp.v < RP_CONFIG.kp.weak) {
                    kpLvl = 'bad';
                    kpTxt = '未掌握且仅本班弱，属本班独有短板，需自查讲练到位程度';
                } else {
                    kpLvl = 'warn';
                    kpTxt = '处于薄弱带（' + RP_CONFIG.kp.weak + '–' + RP_CONFIG.kp.master + '%）、尚未到未掌握，随堂 5 分钟专项即可';
                }
                paras.push('知识点上，最弱是「' + rpEsc(weakKp.dim.short + '·' + weakKp.n) + '」<b>' + weakKp.v + '%</b>（年级 ' + RP_GRADE.kpRates[weakKp.id] + '%），' + em(kpLvl, kpTxt) + '。');
                paras.push('分维度看 ' + weakByDim.map(function (w) { return w.dim.short + '最弱「' + rpEsc(w.n) + '」' + w.v + '%（年级 ' + w.gv + '%）'; }).join('、')
                    + '，各维度独立统计、不跨维度合并。');

                var sigByDim = RP_KP_DIMS.map(function (d) {
                    var cnt = 0;
                    if (!SMALL) rpKpsOfDim(d.id).forEach(function (k) {
                        var t = sigFor(k.id);
                        if (t && t.mark === '**' && C.kpRates[k.id] < RP_GRADE.kpRates[k.id]) cnt++;
                    });
                    return { d: d, n: cnt };
                });
                var sigDown = sigByDim.reduce(function (a, x) { return a + x.n; }, 0);
                if (!SMALL) {
                    paras.push(sigDown
                        ? '两比例 z 检验下，' + sigByDim.map(function (x) { return x.d.short + ' ' + x.n + ' 个'; }).join('、') + '知识点显著落后（**），'
                            + em('bad', '差异超出抽样波动，需组织集体备课统一讲法与进度') + '。'
                        : '两比例 z 检验下，' + sigByDim.map(function (x) { return x.d.short; }).join(' / ') + '两个维度均无显著落后项（**），'
                            + '差异仍在抽样波动范围内，不宜据此问责。');
                    paras.push('本次有效样本 <b>' + M.valid + '</b> 人（应交 ' + M.total + ' / 实交 ' + M.submitted + '），结论可直接用于督导与教研。');
                }
                rules.push(
                    { n: '年级位次', rule: '位次处末两位 → 列入重点督导（与模块 6 同一判定）' },
                    { n: '档位结构', rule: tierRule },
                    { n: '知识点归属', rule: '掌握线 ' + RP_CONFIG.kp.master + '% / 薄弱线 ' + RP_CONFIG.kp.weak + '%：每个维度各取最弱知识点单独判定（同步 / 复习不合并）；未掌握的只在所在维度内区分年级共性薄弱与本班局部薄弱' },
                    { n: '显著性', rule: '两比例 z 检验：p &lt; ' + RP_CONFIG.sig.two + ' 记 **（差异显著）；p &lt; ' + RP_CONFIG.sig.one + ' 记 *；无标记视为抽样波动；各维度分别检验、分别计数' },
                    { n: '样本可信度', rule: sampleRule }
                );
            }
            return {
                tag: LEAD ? '汇总结论 · 管理视角' : '汇总结论 · 教学视角',
                paras: paras,
                rules: rules
            };
        }

        function t1Body() {
            var h = kpiCards() + conclBody();
            if (LEAD) {
                h += '<div class="tbl-wrap rp-mt"><table class="tbl"><tbody>'
                    + '<tr><th>年级位次</th><td>' + (SMALL ? '<span class="na">样本不足，隐藏排名与分位</span>'
                        : '第 <b>' + RK.rank + '</b> / ' + RK.total + ' 班（前 ' + Math.round(RK.rank / RK.total * 100) + '%）') + '</td>'
                    + '<th>与年级均差</th><td>' + (SMALL ? '—' : pp(Math.round((M.mean - G.mean) * 10) / 10)) + '</td></tr>'
                    + '<tr><th>与同类班均差</th><td colspan="3"><span class="na">—</span> 班级分组（平行班 / 重点班）数据未接入（方案 9.3 P2），同类班比较整体隐藏</td></tr>'
                    + '</tbody></table></div>';
                if (SMALL) h += smallNote();
                return h;
            }
            if (SMALL) h += smallNote();
            return h;
        }

        /* ══════════════════════ T2 · 得分分布 ══════════════════════ */
        function t2Body() {
            var bins = rpHist(CLS);
            var gaps = bins.filter(function (b) { return b.hl; }).map(function (b) { return b.lb; });
            var dMean = Math.round((M.mean - G.mean) * 10) / 10;
            var verdict, act;
            if (SMALL) { verdict = '有效样本 ' + M.valid + ' 人，分布形态不具统计意义'; act = '不做整体策略判断，逐个学生面批更可靠'; }
            else if (dMean < -RP_CONFIG.meanGap) { verdict = '整体低于年级 ' + Math.abs(dMean) + 'pp，属普遍性问题'; act = '全体重讲：本次讲评不按分层设计，先把共性错误讲透'; }
            else if (M.sd >= RP_CONFIG.sdPp) { verdict = '标准差 ' + M.sd + 'pp，两极分化明显'; act = '分层讲评：讲评课分两段设计，低分段补起点、高分段做拓展'; }
            else { verdict = '分布集中（标准差 ' + M.sd + 'pp），与年级基本同形'; act = '按逐题得分率定讲评顺序即可，无需分层'; }
            var rows = RP_TIERS.map(function (t) {
                var cv = M[t.k + 'Rate'], gv = G[t.k + 'Rate'];
                var d = (cv == null || gv == null) ? null : Math.round((cv - gv) * 10) / 10;
                return '<tr' + (SMALL ? ' class="dim"' : '') + '><td><b>' + t.n + '</b>'
                    + (t.k === 'low' ? '<div class="mod-sub">得分率 &lt; ' + RP_CONFIG.grade.low + '%</div>' : '') + '</td>'
                    + '<td class="num">' + (SMALL ? '—' : M[t.k]) + '</td>'
                    + '<td class="num">' + (cv == null ? '<span class="na">样本不足</span>' : cv + '%') + '</td>'
                    + '<td class="num">' + gv + '%</td>'
                    + '<td class="num">' + (d == null ? '—' : '<span class="' + diffCls(d, t.k === 'low') + '">' + rpPp(d) + '</span>') + '</td></tr>';
            }).join('');
            /* v3 左图右表：直方图（w:640 让窄栏字号保持 10px 档）| 档位表 + 形态判定，模块高度由「图+表」叠加变为二者取高 */
            return '<div class="rp-cols"><div>'
                + '<div class="chart-box">' + rpSvgHist({ bins: bins, w: 640, h: 180 }) + '</div>'
                + '<div class="chart-legend"><span><i style="background:#8fb5fa"></i>本班人数</span>'
                + '<span><i class="line"></i>年级同规模折算</span>'
                + '<span><i style="background:#fa8c16"></i>断层带</span></div>'
                + '<div class="chart-alt">移动端已隐藏直方图。本班均分 ' + M.mean + '%、标准差 ' + M.sd
                + 'pp、最高 ' + M.max + '%、最低 ' + M.min + '%' + (gaps.length ? '，断层带：' + gaps.join('、') : '') + '。</div>'
                + '</div><div>'
                + '<div class="stat-row"><span>最高 <b>' + (M.max == null ? '—' : M.max + '%') + '</b></span>'
                + '<span>最低 <b>' + (M.min == null ? '—' : M.min + '%') + '</b></span>'
                + '<span>标准差 <b>' + M.sd + 'pp</b></span>'
                + '<span>有效样本 <b>' + M.valid + ' 人</b></span></div>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>档位<span class="th-note">≥ 该档（低分档除外）</span></th><th class="num">人数</th><th class="num">班级占比</th><th class="num">年级占比</th><th class="num">差值</th>'
                + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
                + '<div class="rp-note"><b>形态判定：</b>' + verdict + ' → <b>' + act + '</b>'
                + (gaps.length ? '<br><b>断层带：</b>' + gaps.join('、') : '')
                + '</div></div></div>';
        }

        /* ══════════════════════ T3 · 逐题得分率 ⭐ ══════════════════════ */
        function drillHtml(i, readonly) {
            var q = RP_QUESTIONS[i];
            var cs = RP_CAUSES.find(function (x) { return x.id === q.cause; });
            var wrong = rpWrongStudents(CLS, i);
            var left = '';
            if (q.type === 'obj') {
                var dist = rpOptionDist(CLS, i) || [];
                var mx = Math.max.apply(null, dist.map(function (o) { return o.v; })) || 1;
                left = '<div><h5>选项分布（正确项 ' + q.correct + '）</h5>' + dist.map(function (o) {
                    return '<div class="opt-row' + (o.correct ? ' correct' : '') + '"><b style="width:14px">' + o.k + '</b>'
                        + '<span class="bar"><i style="width:' + Math.round(o.v / mx * 100) + '%"></i></span>'
                        + '<span class="pc">' + o.v + ' 人</span></div>';
                }).join('') + '</div>';
            } else {
                var pts = subPoints(q, C.qRates[i]);
                var mx2 = 100;
                left = '<div><h5>得分点命中率（主观题）</h5>' + pts.map(function (p) {
                    return '<div class="opt-row' + (p.v >= 80 ? ' correct' : '') + '"><b style="width:auto;min-width:120px;font-weight:500">' + rpEsc(p.n) + '</b>'
                        + '<span class="bar"><i style="width:' + Math.round(p.v / mx2 * 100) + '%"></i></span>'
                        + '<span class="pc">' + p.v + '%</span></div>';
                }).join('') + '</div>';
            }
            var LAY = rpLayers(CLS);
            var chips = wrong.slice(0, 24).map(function (s) {
                var lk = '';
                LAY.forEach(function (L) {
                    if (L.members.some(function (m) { return m.examNum === s.examNum; })) lk = ' · ' + L.key;
                });
                return '<label class="stu-chip"><input type="checkbox" data-stu="' + rpEsc(s.examNum) + '">' + rpEsc(s.name)
                    + ' <span style="color:var(--rp-text3)">' + s.scoreRate + '%' + lk + '</span></label>';
            }).join('');
            var right = readonly
                ? '<div><h5>做错本题学生 ' + wrong.length + ' 人</h5>'
                    + '<div class="stu-chips"><span class="mod-sub">领导视角不下钻学生个人明细（权限矩阵：仅人数规模），逐人名单见任课教师版</span></div></div>'
                : '<div><h5>做错本题学生 ' + wrong.length + ' 人（可勾选加入补练）</h5>'
                    + '<div class="stu-chips">' + (chips || '<span class="mod-sub">无</span>') + '</div>'
                    + (wrong.length > 24 ? '<div class="chart-note">仅显示前 24 人，共 ' + wrong.length + ' 人。</div>' : '')
                    + '</div>';
            return '<div class="drill" id="drill-' + i + '">'
                + '<div class="drill-h"><span>第 ' + q.no + ' 题下钻</span>'
                + '<span class="tag-lv ' + (rpKpLevel(C.qRates[i]) === 'master' ? 'master' : (rpKpLevel(C.qRates[i]) === 'weak' ? 'weak' : 'none')) + '">本班 ' + C.qRates[i] + '%</span>'
                + '<span class="tag-flag">' + rpEsc(cs ? cs.n : '—') + '</span>'
                + '<span class="mod-sub">' + rpEsc(rpKpNames(q.kps)) + ' · ' + q.score + ' 分 · ' + (q.type === 'obj' ? '客观题' : '主观题') + '</span>'
                + '<span class="mod-aside no-print">' + (readonly ? '' : '<button class="rp-btn sm" data-act="practice" data-i="' + i + '">勾选学生加入补练</button>')
                + '<button class="rp-btn sm" data-act="close-drill">收起</button></span></div>'
                + '<div class="drill-grid">' + left + right + '</div>'
                + '<div class="rp-note"><b>建议讲法：</b>' + rpEsc(suggestHow(i)) + '</div>'
                + '</div>';
        }
        function t3Body(readonly) {
            var idxs = RP_QUESTIONS.map(function (q, i) { return i; });
            if (UI.onlyLect) idxs = idxs.filter(function (i) { return rpNeedLect(C.qRates[i], i, UI.thr); });
            /* ⭐ 核心模块：题数多、明细表 8 列，保留纵向图→表（左右结构会把表挤出横滚），只降 H 210→170 */
            var chart = rpSvgBarLine({
                labels: RP_QUESTIONS.map(function (q) { return q.no; }),
                bars: C.qRates, line: RP_GRADE.qRates, threshold: UI.thr, h: 170,
                aria: '逐题得分率：本班柱状与年级折线对比'
            });
            var rows = idxs.map(function (i) {
                var q = RP_QUESTIONS[i], rate = C.qRates[i], gr = RP_GRADE.qRates[i];
                var d = Math.round((rate - gr) * 10) / 10;
                var need = rpNeedLect(rate, i, UI.thr);
                var avg = Math.round(q.score * rate) / 100;
                return '<tr class="' + (UI.drill === i ? 'hl' : '') + '" data-q="' + i + '" style="cursor:pointer">'
                    + '<td><b>' + q.no + '</b></td>'
                    + '<td>' + (q.type === 'obj' ? '客观' : '主观') + ' · ' + q.score + ' 分</td>'
                    + '<td class="num">' + (need ? '<span class="neg">' + rate + '%</span>' : rate + '%')
                    + '<div class="mod-sub">均 ' + avg + ' / ' + q.score + ' 分</div></td>'
                    + '<td class="num">' + gr + '%</td>'
                    + '<td class="num"><span class="' + (d < 0 ? 'neg' : (d > 0 ? 'pos' : '')) + '">' + rpPp(d) + '</span></td>'
                    + '<td class="num">' + rpWrongStudents(CLS, i).length + '</td>'
                    + '<td class="num">' + qLost(i) + '</td>'
                    + '<td>' + q.kps.map(function (id) { return rpKpChip(id); }).join('') + '</td>'
                    + '<td>' + (need ? '<span class="tag-lv none">需讲评</span> ' + rpMarkTag(rate, i, UI.thr) + ' ' : '<span class="tag-lv master">达标</span>') + '</td></tr>'
                    /* 行内下钻：紧跟被点击行，整行 colspan 占满表格（不再落到模块底部）；
                       单题互斥由 UI.drill 单值保证，教师 m3 与组长 m7 折叠块共用此渲染 */
                    + (UI.drill === i ? '<tr class="drill-row no-print"><td colspan="9">' + drillHtml(i, readonly) + '</td></tr>' : '');
            }).join('');
            return '<div class="chart-box">' + chart + '</div>'
                + '<div class="chart-legend"><span><i style="background:#2468f2"></i>本班得分率</span>'
                + '<span><i style="background:#cf1322"></i>低于讲评阈值（' + UI.thr + '%）或已标记需讲评</span>'
                + '<span><i class="line"></i>年级得分率</span>'
                + '<span class="legend-act">' + onlySwitch() + '</span></div>'
                + '<div class="chart-alt">移动端已隐藏图表，请查看下方逐题明细表。</div>'
                + '<div class="tbl-wrap rp-mt"><table class="tbl"><thead><tr>'
                + '<th>题号</th><th>题型 · 分值</th><th class="num">本班得分率</th><th class="num">年级得分率</th>'
                + '<th class="num">差值</th><th class="num">做错人数</th><th class="num">全班失分</th><th>知识点</th><th>讲评判定</th></tr></thead><tbody>'
                + (rows || '<tr class="dim"><td colspan="9">当前阈值下无需讲评的题目</td></tr>')
                + '</tbody></table></div>'
                + '<div class="chart-note">点击题号所在行，在该行下方展开下钻（选项分布 / 得分点命中率、主错因、做错学生名单含分层）；再次点击收起，同时只展开一题。</div>';
        }

        /* ══════════════════════ T4 · 知识点诊断（按维度切换，各维度独立统计） ══════════════════════ */
        function t4Body() {
            var D = rpDim(UI.kpDim), kps = rpKpsOfDim(UI.kpDim);
            var list = kps.map(function (k) {
                var v = C.kpRates[k.id], gv = RP_GRADE.kpRates[k.id];
                return { id: k.id, n: k.n, v: v, gv: gv, d: Math.round((v - gv) * 10) / 10, lv: rpKpLevel(v) };
            }).sort(function (a, b) { return a.v - b.v; });   /* 升序：最弱在最上 */
            var chart = rpSvgHBars({ items: list.map(function (x) { return { n: x.n, v: x.v, ref: x.gv }; }) });
            var rows = list.map(function (x) {
                var qs = RP_QUESTIONS.map(function (q, i) { return q.kps.indexOf(x.id) >= 0 ? i : -1; }).filter(function (i) { return i >= 0; });
                var flags = '';
                if (x.v < RP_CONFIG.kp.weak) flags += '<span class="tag-lv none">全班薄弱</span> ';
                return '<tr><td><b>' + rpEsc(x.n) + '</b></td>'
                    + '<td>' + qs.map(function (i) {
                        return '<a href="#m3" data-jump="' + i + '">第' + RP_QUESTIONS[i].no + '题</a>';
                    }).join('、') + '</td>'
                    + '<td class="num">' + x.v + '%</td><td class="num">' + x.gv + '%</td>'
                    + '<td class="num"><span class="' + (x.d < 0 ? 'neg' : (x.d > 0 ? 'pos' : '')) + '">' + rpPp(x.d) + '</span></td>'
                    + '<td class="num">' + rpKpWeakN(CLS, x.id) + '</td>'
                    + '<td><span class="tag-lv ' + x.lv + '">' + RP_KP_LEVEL_NAME[x.lv] + '</span></td>'
                    + '<td>' + flags + '</td></tr>';
            }).join('');
            var lvCnt = { master: 0, weak: 0, none: 0 };
            list.forEach(function (x) { lvCnt[x.lv]++; });
            /* 图表与明细不再平铺：tab 切换（默认掌握率图；打印时两视图同时输出，信息不减） */
            return dimLine('掌握率图与明细表都按当前维度取数')
                + '<div class="seg" role="tablist" aria-label="知识点视图切换">'
                + '<button type="button" class="' + (UI.t4Tab === 'chart' ? 'on' : '') + '" data-tab="chart" role="tab" aria-selected="' + (UI.t4Tab === 'chart') + '">掌握率图</button>'
                + '<button type="button" class="' + (UI.t4Tab === 'tbl' ? 'on' : '') + '" data-tab="tbl" role="tab" aria-selected="' + (UI.t4Tab === 'tbl') + '">知识点明细</button></div>'
                + '<div class="tab-pane' + (UI.t4Tab === 'chart' ? ' on' : '') + '">'
                + '<div class="chart-box">' + chart + '</div>'
                + '<div class="chart-legend"><span><i style="background:#389e0d"></i>掌握 ≥ ' + RP_CONFIG.kp.master + '%</span>'
                + '<span><i style="background:#fa8c16"></i>薄弱 ' + RP_CONFIG.kp.weak + '–' + RP_CONFIG.kp.master + '%</span>'
                + '<span><i style="background:#cf1322"></i>未掌握 &lt; ' + RP_CONFIG.kp.weak + '%</span>'
                + '<span><i class="line"></i>年级掌握率</span></div>'
                + '<div class="chart-alt">移动端已隐藏条形图，最弱知识点：' + list[0].n + '（' + list[0].v + '%）。</div>'
                + '<div class="chart-note">当前维度「' + rpEsc(D.n) + '」共 ' + kps.length + ' 个知识点，维度均掌握率 '
                + rpDimMean(C.kpRates, D.id) + '%。</div>'
                + '</div>'
                + '<div class="tab-pane' + (UI.t4Tab === 'tbl' ? ' on' : '') + '">'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>知识点（' + rpEsc(D.n) + ' · 升序）</th><th>关联题号</th><th class="num">本班</th><th class="num">年级</th><th class="num">差值</th>'
                + '<th class="num">未掌握人数</th><th>等级</th><th>特殊标记</th>'
                + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
                + '<div class="stat-row"><span>维度 <b>' + rpEsc(D.n) + '</b></span>'
                + '<span>维度均掌握率 <b>' + rpDimMean(C.kpRates, D.id) + '%</b></span>'
                + '<span>掌握 <b>' + lvCnt.master + '</b> 个</span>'
                + '<span>薄弱 <b>' + lvCnt.weak + '</b> 个</span>'
                + '<span>未掌握 <b>' + lvCnt.none + '</b> 个</span>'
                + '<span>共 <b>' + list.length + '</b> 个知识点</span></div>'
                + '</div>';
        }

        /* ══════════════════════ T5 · 错因分析（按题目汇总 / 按学生下钻） ══════════════════════
           两个视图共用同一份「逐题 × 逐生错因归属」（report-data.js 的 rpQCauseMap）：
             · 按题目：某题上本班的错因构成（人次 / 占比 / 失分 / 年级对照）+ 做错学生按错因分组
             · 按学生：某个学生各小题的错因 + 与该题班级主错因的对照（共性错因 / 个别错因）
           人次口径唯一：Σ 各生错题数 = Σ 各题做错人次 = 班级错因人次（模块内可直接对账）；
           年级口径同模型（各已批阅班逐生归属叠加），供「本班 × 年级」对照 */
        function rpAlpha(hex, a) {
            var h = String(hex || '#c0c4cc').replace('#', '');
            if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
            var n = parseInt(h, 16) || 0;
            return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
        }
        /* 模块 5 视图切换（模块头右侧，与知识点维度切换同一语言） */
        function m5Aside() {
            return '<span class="seg" role="tablist" aria-label="错因分析视图切换">'
                + '<button type="button" class="' + (UI.m5Tab === 'q' ? 'on' : '') + '" data-m5tab="q" role="tab" aria-selected="' + (UI.m5Tab === 'q') + '">按题目 · 班级汇总</button>'
                + '<button type="button" class="' + (UI.m5Tab === 's' ? 'on' : '') + '" data-m5tab="s" role="tab" aria-selected="' + (UI.m5Tab === 's') + '">按学生 · 个人下钻</button>'
                + '</span>';
        }
        /* 模块 5 初始状态：默认展开失分最大的两道题、默认选中错题最多的学生 */
        function m5Init() {
            if (UI.m5Open) return;
            UI.m5Open = RP_QUESTIONS.map(function (q, i) { return i; })
                .sort(function (a, b) { return qLost(b) - qLost(a); }).slice(0, 2);
            var map = rpQCauseMap(CLS), best = null;
            if (map) rpStudents(CLS).forEach(function (s) {
                var n = Object.keys(map.byStu[s.examNum] || {}).length;
                if (!best || n > best.n) best = { n: n, id: s.examNum };
            });
            UI.m5Stu = best ? best.id : '';
        }
        /* 某错因涉及哪些题（含人次）：供表格内做可点跳转到题卡 */
        function m5CauseQs(map, causeId) {
            var out = [];
            map.byQ.forEach(function (r) {
                var n = r.counts[causeId] || 0;
                if (n) out.push({ i: r.i, no: r.q.no, n: n });
            });
            return out;
        }
        function t5Body(readonly) {
            var map = rpQCauseMap(CLS);
            if (!map) return '<div class="gray-off">本次作业无错因数据：本次题目未接入大模型智批，不产生错因标注。</div>';
            if (readonly) return t5QBody(true);
            m5Init();
            return '<div class="tab-pane' + (UI.m5Tab === 'q' ? ' on' : '') + '">' + t5QBody(false) + '</div>'
                + '<div class="tab-pane' + (UI.m5Tab === 's' ? ' on' : '') + '">' + t5StuBody() + '</div>';
        }
        /* ── T5-① 按题目：班级汇总错因（结构 × 年级 → 错因×题目矩阵 → 逐题错因卡） ── */
        function t5QBody(readonly) {
            var map = rpQCauseMap(CLS);
            var cs = rpCauseStats(CLS), gs = rpGradeCauseStats();
            var lostAll = cs.reduce(function (a, x) { return a + x.lost; }, 0) || 1;
            var gLostAll = gs.reduce(function (a, x) { return a + x.lost; }, 0) || 1;
            var cntAll = cs.reduce(function (a, x) { return a + x.cnt; }, 0);
            var wrongAll = map.byQ.reduce(function (a, r) { return a + r.wrong; }, 0);
            var lostQAll = RP_QUESTIONS.reduce(function (a, q, i) { return a + qLost(i); }, 0);
            var head = '<div class="stat-row">'
                + '<span>题目 <b>' + RP_QUESTIONS.length + '</b> 道</span>'
                + '<span>有效样本 <b>' + M.valid + '</b> 人</span>'
                + '<span>错因类别 <b>' + cs.length + '</b> 类</span>'
                + '<span>错因人次 <b>' + cntAll + '</b> 人次</span>'
                + '<span>覆盖失分 <b>' + lostAll + '</b> / ' + lostQAll + ' 分</span>'
                + '<span>首要错因 <b>' + rpEsc(cs[0] ? cs[0].n : '—') + '</b>（' + (cs[0] ? cs[0].cnt : 0) + ' 人次）</span>'
                + '</div>';
            /* ① 班级错因结构 × 年级对照 */
            var donut = rpSvgDonut({ segs: cs.map(function (x) { return { n: x.n, v: x.cnt, color: x.color }; }) });
            var rows = cs.map(function (x) {
                var g = gs.find(function (o) { return o.id === x.id; }) || { lost: 0 };
                var my = Math.round(x.lost / lostAll * 100), gp = Math.round(g.lost / gLostAll * 100), d = my - gp;
                var qs = m5CauseQs(map, x.id);
                return '<tr><td><span class="m5-dot" style="background:' + x.color + '"></span><b>' + rpEsc(x.n) + '</b></td>'
                    + '<td class="num"><b>' + my + '%</b><div class="mod-sub">失分 ' + x.lost + ' 分</div></td>'
                    + '<td class="num">' + gp + '%</td>'
                    + '<td class="num">' + (d ? '<span class="' + diffCls(d, true) + '">' + rpPp(d) + '</span>' : '0pp') + '</td>'
                    + '<td class="num">' + x.cnt + '</td>'
                    + '<td class="num">' + x.stu + '</td>'
                    + '<td class="num">' + qs.length + ' 题<div class="mod-sub">'
                    + qs.map(function (o) { return '<a href="#m5" data-m5jump="' + o.i + '">第' + o.no + '题</a>'; }).join('、')
                    + '</div></td></tr>';
            }).join('');
            var struct = '<h5 class="sub-h">① 班级错因结构 × 年级对照（错因级汇总）</h5>'
                + '<div class="rp-cols side"><div>'
                + '<div class="chart-box center">' + donut + '</div>'
                + '<div class="chart-legend">' + cs.map(function (x) {
                    return '<span><i style="background:' + x.color + '"></i>' + rpEsc(x.n) + '</span>';
                }).join('') + '</div></div>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>错因</th><th class="num">本班失分占比</th><th class="num">年级失分占比</th><th class="num">差值</th>'
                + '<th class="num">人次</th><th class="num">人数</th><th class="num">涉及题数</th>'
                + '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
            /* ② 错因 × 题目矩阵：单元格 = 该题该错因人次（底色深浅 = 人次多少），点数字直达题卡 */
            var mxMax = map.byQ.map(function (r) {
                var m = 0;
                Object.keys(r.counts).forEach(function (k) { if (r.counts[k] > m) m = r.counts[k]; });
                return m;
            });
            var mtxRows = cs.map(function (x) {
                var g = gs.find(function (o) { return o.id === x.id; }) || { lost: 0 };
                var my = Math.round(x.lost / lostAll * 100), gp = Math.round(g.lost / gLostAll * 100), d = my - gp;
                return '<tr><td><span class="m5-dot" style="background:' + x.color + '"></span>' + rpEsc(x.n) + '</td>'
                    + RP_QUESTIONS.map(function (q, i) {
                        var n = map.byQ[i].counts[x.id] || 0;
                        if (!n) return '<td class="num m5-cell is-zero">·</td>';
                        var a = 0.07 + 0.33 * (n / (mxMax[i] || 1));
                        return '<td class="num m5-cell" style="background:' + rpAlpha(x.color, a) + '" title="第 ' + q.no + ' 题 · ' + rpEsc(x.n) + '：' + n + ' 人次">'
                            + '<button type="button" class="m5-cellb" data-m5jump="' + i + '" aria-label="展开第 ' + q.no + ' 题错因">' + n + '</button></td>';
                    }).join('')
                    + '<td class="num"><b>' + x.cnt + '</b></td>'
                    + '<td class="num">' + my + '%</td><td class="num">' + gp + '%</td>'
                    + '<td class="num">' + (d ? '<span class="' + diffCls(d, true) + '">' + rpPp(d) + '</span>' : '0pp') + '</td></tr>';
            }).join('');
            var mtx = '<h5 class="sub-h">② 错因 × 题目分布（单元格 = 该题该错因人次，点数字展开该题）</h5>'
                + '<div class="tbl-wrap"><table class="tbl m5-mtx"><thead><tr><th>错因 \\ 题目</th>'
                + RP_QUESTIONS.map(function (q) { return '<th class="num">第' + q.no + '题</th>'; }).join('')
                + '<th class="num">人次</th><th class="num">本班失分占比</th><th class="num">年级占比</th><th class="num">差值</th>'
                + '</tr></thead><tbody>' + mtxRows
                + '<tr class="dim"><td>该题做错人数</td>'
                + map.byQ.map(function (r) { return '<td class="num">' + r.wrong + '</td>'; }).join('')
                + '<td class="num">' + cntAll + '</td><td colspan="3">人次 = 学生 × 题目</td></tr>'
                + '</tbody></table></div>';
            /* ③ 逐题错因卡：题干 → 得分率 → 错因构成 → 做错学生（按错因分组） */
            var cards = RP_QUESTIONS.map(function (q, i) { return t5QCard(i, map, readonly); }).join('');
            var qblock = '<h5 class="sub-h">③ 逐题错因（点题号展开该题的班级错因构成与做错学生）</h5>' + cards;
            var note = '<div class="rp-note"><b>口径：</b>错因先落到题（每题一组错因权重），再落到做错该题的学生；「按题目」与「按学生」两视图取同一份归属结果，'
                + '因此 Σ 各生错题数（' + cntAll + '）= Σ 各题做错人次（' + wrongAll + '）= 班级错因人次（' + cntAll + '），可直接对账。'
                + '失分归属：该题全班失分按做错人数均摊到做错学生，再按错因拆分，故各错因失分之和 = 该题全班失分。'
                + '年级口径为各已批阅班同一模型叠加。错因只对接入大模型智批的题目有数据；人次、人数、失分为演示派生值【演示】。</div>';
            return head + struct + mtx + qblock + note;
        }
        /* 单题错因卡（按题目视图） */
        function t5QCard(i, map, readonly) {
            var q = RP_QUESTIONS[i], rate = C.qRates[i], gr = RP_GRADE.qRates[i];
            var d = Math.round((rate - gr) * 10) / 10;
            var rows = rpQCauseRows(CLS, i), grows = rpGradeQCauseRows(i);
            var gTotal = grows.reduce(function (a, o) { return a + o.cnt; }, 0) || 1;
            var open = UI.m5Open.indexOf(i) > -1;
            var main = rows.filter(function (r) { return r.main; })[0] || rows[0];
            var need = rpNeedLect(rate, i, UI.thr);
            var bar = rows.length ? '<div class="m5-bar">' + rows.map(function (r) {
                return '<i style="width:' + r.pct + '%;background:' + r.color + '" title="' + rpEsc(r.n) + '：' + r.cnt + ' 人次 / ' + r.pct + '%"></i>';
            }).join('') + '</div>' : '';
            var trs = rows.map(function (r) {
                var g = grows.find(function (o) { return o.id === r.id; });
                var gp = g ? Math.round(g.cnt / gTotal * 100) : 0, dd = r.pct - gp;
                return '<tr><td><span class="m5-dot" style="background:' + r.color + '"></span><b>' + rpEsc(r.n) + '</b>'
                    + (r.main ? ' <span class="tag-flag">本题主错因</span>' : '') + '</td>'
                    + '<td class="num">' + r.cnt + '</td>'
                    + '<td class="num">' + r.pct + '%</td>'
                    + '<td class="num">' + r.lost + '</td>'
                    + '<td class="num">' + (g ? g.cnt : 0) + '</td>'
                    + '<td class="num">' + gp + '%</td>'
                    + '<td class="num">' + (dd ? '<span class="' + diffCls(dd, true) + '">' + rpPp(dd) + '</span>' : '0pp') + '</td></tr>';
            }).join('');
            var groups = readonly ? '' : rows.map(function (r) {
                var list = map.byQ[i].rows.filter(function (x) { return x.cause === r.id; });
                return '<div class="m5-grp"><div class="m5-grp-h">'
                    + '<span class="m5-dot" style="background:' + r.color + '"></span><b>' + rpEsc(r.n) + '</b>'
                    + '<span class="m5-grp-n">' + r.cnt + ' 人次 · 占本题错因 ' + r.pct + '% · 失分 ' + r.lost + ' 分</span></div>'
                    + '<div class="stu-chips">' + list.map(function (x) {
                        return '<button type="button" class="stu-chip m5-chip" data-m5stu="' + rpEsc(x.stu.examNum) + '" title="查看该生各小题错因">'
                            + rpEsc(x.stu.name) + '<span class="m5-chip-r">' + x.stu.scoreRate + '%</span></button>';
                    }).join('') + '</div></div>';
            }).join('');
            var body = '<div class="m5-qmeta2">'
                + '<span class="m5-tag">本题做错 <b>' + map.byQ[i].wrong + '</b> 人</span>'
                + '<span class="m5-tag">本题失分 <b>' + qLost(i) + '</b> 分</span>'
                + '<span class="m5-tag">年级错因人次 <b>' + gTotal + '</b></span>'
                + '<span class="m5-tag">年级得分率 <b>' + gr + '%</b> · <span class="' + diffCls(d, true) + '">' + rpPp(d) + '</span></span>'
                + '</div>' + bar
                + '<div class="tbl-wrap rp-mt"><table class="tbl"><thead><tr><th>错因</th><th class="num">本班人次</th>'
                + '<th class="num">占本题错因</th><th class="num">本班失分</th><th class="num">年级人次</th>'
                + '<th class="num">年级占比</th><th class="num">差值</th></tr></thead><tbody>' + trs + '</tbody></table></div>'
                + (groups ? '<div class="m5-grps-h">做错学生（按错因分组，点姓名看该生各小题错因）</div>' + groups : '')
                + '<div class="rp-note"><b>建议讲法：</b>' + rpEsc(suggestHow(i)) + '</div>';
            return '<div class="m5-qcard' + (open ? ' on' : '') + '" data-qi="' + i + '">'
                + '<button type="button" class="m5-qcard-h" data-m5q="' + i + '" aria-expanded="' + open + '">'
                + '<span class="m5-qno">第 ' + q.no + ' 题</span>'
                + '<span class="m5-qstem">' + rpEsc(q.stem) + '</span>'
                + '<span class="m5-qtags">' + q.kps.map(function (id) { return rpKpChip(id); }).join('')
                + '<span class="tag-lv ' + (need ? 'none' : 'master') + '">本班 ' + rate + '%</span>'
                + (need ? '<span class="tag-lv weak">需讲评</span>' : '')
                + (main ? '<span class="tag-flag">' + rpEsc(main.n) + '</span>' : '')
                + '</span>'
                + '<span class="m5-qtog">' + (open ? '收起 ▲' : '展开 ▼') + '</span>'
                + '</button>'
                /* 卡体常驻 DOM：屏幕靠 .m5-qcard-b 的 display 控制收起 / 展开，
                   打印时由 report.css 统一强制展开（纸面要看到全部 12 题的错因明细） */
                + '<div class="m5-qcard-b">' + body + '</div>'
                + '</div>';
        }
        /* ── T5-② 按学生：左名单 + 右逐题错因明细 ── */
        /* 某错因涉及的学生数（用于筛选条上的计数） */
        function m5CauseStuN(map, causeId) {
            var n = 0;
            rpStudents(CLS).forEach(function (s) {
                var m = map.byStu[s.examNum] || {};
                for (var i in m) { if (m[i] === causeId) { n++; break; } }
            });
            return n;
        }
        function m5StuList() {
            var map = rpQCauseMap(CLS);
            var kw = (UI.m5Search || '').trim();
            var list = rpStudents(CLS).map(function (s) {
                var m = map.byStu[s.examNum] || {};
                var causes = {};
                Object.keys(m).forEach(function (i) { causes[m[i]] = (causes[m[i]] || 0) + 1; });
                return { s: s, n: Object.keys(m).length, causes: causes };
            }).filter(function (x) {
                if (UI.m5Cause && !x.causes[UI.m5Cause]) return false;
                if (!kw) return true;
                return (x.s.name + x.s.examNum).indexOf(kw) > -1;
            }).sort(function (a, b) { return b.n - a.n || a.s.scoreRate - b.s.scoreRate; });
            if (!list.length) return '<div class="gray-off">没有符合条件的学生（换个错因或清空搜索词）。</div>';
            var LAY = rpLayers(CLS);
            return list.map(function (x) {
                var lk = '';
                LAY.forEach(function (L) {
                    if (L.members.some(function (m) { return m.examNum === x.s.examNum; })) lk = L.key;
                });
                var tag = x.s.status === 'blank' ? '<span class="tag-lv none">空白卷</span>'
                    : (x.s.status === 'abnormal' ? '<span class="tag-lv weak">答题异常</span>' : '');
                return '<button type="button" class="m5-stu-item' + (UI.m5Stu === x.s.examNum ? ' on' : '') + '" data-m5stu="' + rpEsc(x.s.examNum) + '">'
                    + '<span class="m5-si-nm">' + rpEsc(x.s.name) + (lk ? '<span class="m5-si-lk">' + lk + ' 层</span>' : '') + '</span>'
                    + '<span class="m5-si-sub">' + rpEsc(x.s.examNum) + ' · ' + x.s.scoreRate + '%</span>'
                    + '<span class="m5-si-badges">' + tag + '<span class="tag-lv ' + (x.n ? 'weak' : 'master') + '">错 ' + x.n + ' 题</span></span>'
                    + '</button>';
            }).join('');
        }
        function t5StuBody() {
            var map = rpQCauseMap(CLS), cs = rpCauseStats(CLS);
            var filter = '<div class="m5-cause-filter"><span class="m5-cf-lb">按错因筛选</span><span class="seg">'
                + '<button type="button" class="' + (!UI.m5Cause ? 'on' : '') + '" data-m5cause="">全部</button>'
                + cs.map(function (x) {
                    return '<button type="button" class="' + (UI.m5Cause === x.id ? 'on' : '') + '" data-m5cause="' + x.id + '">'
                        + rpEsc(x.n) + '（' + m5CauseStuN(map, x.id) + ' 人）</button>';
                }).join('') + '</span></div>';
            var left = '<div class="m5-stu-search"><input type="search" id="m5stusearch" placeholder="搜索姓名 / 学号"'
                + ' value="' + rpEsc(UI.m5Search || '') + '" aria-label="搜索学生姓名或学号" autocomplete="off"></div>'
                + '<div class="m5-stu-list" id="m5-stu-list">' + m5StuList() + '</div>';
            return '<h5 class="sub-h">按学生 · 各小题错因（左名单选人，右看该生逐题错因）</h5>'
                + filter
                + '<div class="rp-cols m5-cols"><div>' + left + '</div><div>' + m5StuDetail(map, cs) + '</div></div>'
                + '<div class="rp-note"><b>对账：</b>名单里各生「错 N 题」之和 = 本班错因人次 = 「按题目」视图中各题做错人数之和；'
                + '两个视图取同一份错因归属结果，不会出现两套口径。</div>';
        }
        function m5StuDetail(map, cs) {
            var stu = rpStudents(CLS).find(function (s) { return s.examNum === UI.m5Stu; });
            if (!stu) return '<div class="gray-off">从左侧名单选一名学生，查看其各小题的错因。</div>';
            var m = map.byStu[stu.examNum] || {};
            var wrong = Object.keys(m).map(Number).sort(function (a, b) { return a - b; });
            var causes = {};
            wrong.forEach(function (i) { causes[m[i]] = (causes[m[i]] || 0) + 1; });
            /* 该生错题中「班级共性错因」与「个别错因」的题数：与本题班级主错因比对得出 */
            var common = 0, personal = 0;
            wrong.forEach(function (i) {
                var rows = rpQCauseRows(CLS, i);
                var main = rows.filter(function (r) { return r.main; })[0] || rows[0];
                if (main && m[i] === main.id) common++; else personal++;
            });
            var LAY = rpLayers(CLS), lk = '';
            LAY.forEach(function (L) {
                if (L.members.some(function (x) { return x.examNum === stu.examNum; })) lk = L.key + ' 层';
            });
            var clsTotal = cs.reduce(function (a, x) { return a + x.cnt; }, 0) || 1;
            var cmpRows = cs.filter(function (x) { return causes[x.id]; }).map(function (x) {
                var mine = causes[x.id];
                var myPct = Math.round(mine / (wrong.length || 1) * 100);
                var clsPct = Math.round(x.cnt / clsTotal * 100);
                var dd = myPct - clsPct;
                return '<tr><td><span class="m5-dot" style="background:' + x.color + '"></span>' + rpEsc(x.n) + '</td>'
                    + '<td class="num">' + mine + ' 题</td>'
                    + '<td class="num">' + myPct + '%</td>'
                    + '<td class="num">' + clsPct + '%</td>'
                    + '<td class="num">' + (dd ? '<span class="' + diffCls(dd, true) + '">' + rpPp(dd) + '</span>' : '0pp') + '</td>'
                    + '<td>' + (myPct > clsPct + 10 ? '<span class="tag-lv none">个人特征错因</span>' : '<span class="tag-lv master">班级共性错因</span>') + '</td></tr>';
            }).join('');
            var qRows = RP_QUESTIONS.map(function (q, i) {
                var cid = m[i], isWrong = !!cid;
                var rows = rpQCauseRows(CLS, i);
                var main = rows.filter(function (r) { return r.main; })[0] || rows[0];
                var mine = cid ? rows.filter(function (r) { return r.id === cid; })[0] : null;
                var cs2 = cid ? RP_CAUSES.find(function (x) { return x.id === cid; }) : null;
                var same = isWrong && main && cid === main.id;
                var judge = !isWrong ? '<span class="mod-sub">—</span>'
                    : (same ? '<span class="tag-lv weak">共性错因</span>' : '<span class="tag-lv none">个别错因</span>');
                var how = !isWrong ? '—'
                    : (same ? '随班讲评：本题班级共性错误（同因 ' + (mine ? mine.cnt : 0) + ' 人），课堂讲评即可覆盖'
                        : '个别辅导：该生错因与本题班级主错因不同，需单独订正');
                return '<tr' + (UI.m5Cause && cid === UI.m5Cause ? ' class="hl"' : '') + '>'
                    + '<td><b>' + q.no + '</b></td>'
                    + '<td>' + (q.type === 'obj' ? '客观' : '主观') + ' · ' + q.score + ' 分</td>'
                    + '<td>' + q.kps.map(function (id) { return rpKpChip(id); }).join('') + '</td>'
                    + '<td>' + (isWrong ? '<span class="tag-lv none">错</span>' : '<span class="tag-lv master">对</span>') + '</td>'
                    + '<td class="num">' + C.qRates[i] + '%</td>'
                    + '<td>' + (cs2 ? '<span class="m5-dot" style="background:' + cs2.color + '"></span>' + rpEsc(cs2.n) : '—') + '</td>'
                    + '<td>' + (main ? '<span class="m5-dot" style="background:' + main.color + '"></span>' + rpEsc(main.n) : '—') + '</td>'
                    + '<td>' + judge + '</td>'
                    + '<td class="m5-how">' + rpEsc(how) + '</td></tr>';
            }).join('');
            var adv = wrong.length
                ? '<div class="rp-note"><b>讲评建议：</b>该生 ' + wrong.length + ' 道错题中，<b>' + common + '</b> 道为班级共性错因（随班讲评即可覆盖），'
                + '<b>' + personal + '</b> 道为个别错因（需单独订正）；优先补第 ' + wrong.map(function (i) { return RP_QUESTIONS[i].no; }).join('、') + ' 题。</div>'
                : '<div class="rp-note">该生本次无错题记录。</div>';
            var head = '<div class="m5-stu-head">'
                + '<div class="m5-sh-nm">' + rpEsc(stu.name) + '</div>'
                + '<div class="m5-sh-sub">学号 ' + rpEsc(stu.examNum) + ' · 得分率 <b>' + stu.scoreRate + '%</b>'
                + ' · 错 <b>' + wrong.length + '</b> / ' + RP_QUESTIONS.length + ' 题'
                + (lk ? ' · ' + lk : '') + (stu.classRank ? ' · 班内第 ' + stu.classRank + ' 名' : '') + '</div>'
                + '<div class="m5-sh-tags">' + (stu.tags || []).map(function (t) { return '<span class="tag-lv none">' + rpEsc(t) + '</span>'; }).join('') + '</div>'
                + '</div>';
            /* 学生视图自带口径条：不依赖切回「按题目」视图就能看到本班错因人次 */
            var stat = '<div class="stat-row">'
                + '<span>该生错题 <b>' + wrong.length + '</b> / ' + RP_QUESTIONS.length + ' 题</span>'
                + '<span>涉及错因 <b>' + Object.keys(causes).length + '</b> 类</span>'
                + '<span>班级共性错因 <b>' + common + '</b> 题</span>'
                + '<span>个别错因 <b>' + personal + '</b> 题</span>'
                + '<span>本班错因人次 <b>' + clsTotal + '</b> 人次</span>'
                + '</div>';
            return head
                + stat
                + '<h5 class="sub-h">错因结构：该生 vs 本班</h5>'
