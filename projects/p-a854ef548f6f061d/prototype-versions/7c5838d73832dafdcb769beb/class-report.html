                + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>错因</th><th class="num">该生错题</th>'
                + '<th class="num">该生占比</th><th class="num">本班占比</th><th class="num">差值</th><th>判定</th>'
                + '</tr></thead><tbody>' + (cmpRows || '<tr class="dim"><td colspan="6">该生本次无错题</td></tr>') + '</tbody></table></div>'
                + '<h5 class="sub-h">各小题错因（逐题对照班级主错因）</h5>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>题号</th><th>题型 · 分值</th><th>知识点</th><th>结果</th>'
                + '<th class="num">本班得分率</th><th>该生错因</th><th>本题班级主错因</th><th>判定</th><th>建议动作</th>'
                + '</tr></thead><tbody>' + qRows + '</tbody></table></div>'
                + adv;
        }

        /* ══════════════════════ T6 · 讲评清单 ⭐ ══════════════════════ */
        function isKeyLect(no) { return UI.keyLect.indexOf(no) > -1; }
        function t6Body(readonly) {
            var lostAll = RP_QUESTIONS.map(function (q, i) { return qLost(i); }).reduce(function (a, b) { return a + b; }, 0) || 1;
            var hits = RP_QUESTIONS.map(function (q, i) { return i; })
                /* 已设重点讲评的题即使得分率高于阈值也留在清单里（老师的手动判定优先于阈值） */
                .filter(function (i) { return rpNeedLect(C.qRates[i], i, UI.thr) || isKeyLect(RP_QUESTIONS[i].no); })
                /* 手动设为重点讲评的题置顶（老师的优先级高于得分率），其余按失分贡献（qLost）降序：
                   一节课讲不完所有题时，先讲「带走最多失分」的题，比只看得分率更接近提分收益 */
                .sort(function (a, b) {
                    var ka = isKeyLect(RP_QUESTIONS[a].no) ? 0 : 1, kb = isKeyLect(RP_QUESTIONS[b].no) ? 0 : 1;
                    return ka - kb || qLost(b) - qLost(a);
                });
            if (!hits.length) return '<div class="gray-off">当前阈值 ' + UI.thr + '% 下无需讲评的题目。可适当上调阈值。</div>';
            var cov = hits.reduce(function (a, i) { return a + qLost(i); }, 0);
            return '<div class="stat-row"><span>清单 <b>' + hits.length + '</b> 题</span>'
                + '<span>覆盖全班失分 <b>' + cov + ' / ' + lostAll + ' 分</b></span>'
                + '<span>占比 <b>' + Math.round(cov / lostAll * 100) + '%</b></span></div>'
                + hits.map(function (i) {
                var q = RP_QUESTIONS[i], rate = C.qRates[i], gr = RP_GRADE.qRates[i];
                var cs = RP_CAUSES.find(function (x) { return x.id === q.cause; });
                var wrongN = rpWrongStudents(CLS, i).length;
                var key = isKeyLect(q.no);
                return '<div class="lect-item' + (key ? ' key' : '') + '"><span class="qno">第 ' + q.no + ' 题</span>'
                    + '<div class="li-body"><div>' + (key ? '<span class="tag-key">重点讲评</span>' : '') + rpEsc(q.stem) + '</div>'
                    + '<div class="li-rate">' + rpMarkTag(rate, i, UI.thr) + ' 本班 <b' + (rate < UI.thr ? ' class="low"' : '') + '>' + rate + '%</b> · 年级 ' + gr + '% · ' + rpPp(Math.round((rate - gr) * 10) / 10)
                    + ' · ' + q.score + ' 分 · 做错 ' + wrongN + ' 人 · 失分 ' + qLost(i) + ' 分（占 ' + Math.round(qLost(i) / lostAll * 100) + '%）'
                    + ' · <span class="tag-flag">' + rpEsc(cs ? cs.n : '—') + '</span></div>'
                    + '<div class="li-how">' + rpEsc(suggestHow(i)) + '</div></div>'
                    + (readonly ? '' : '<div class="li-act no-print">'
                        + '<button class="rp-btn sm' + (key ? '' : ' primary') + '" data-act="keylect" data-no="' + q.no + '" aria-pressed="' + key + '"'
                        + ' title="' + (key ? '点击取消重点讲评' : '设为本节课的重点讲评题，清单内置顶') + '">'
                        + (key ? '已设重点 ✓' : '设置重点讲评') + '</button>'
                        + '<button class="rp-btn sm" data-act="drill" data-i="' + i + '">看明细</button></div>')
                    + '</div>';
            }).join('');
        }
        function t6Aside(readonly) {
            if (readonly) return '';
            return '<span class="thr-ctl">讲评阈值 <input type="number" id="thr" value="' + UI.thr + '" min="20" max="95" step="5" aria-label="讲评阈值"> %'
                + '<span class="mod-sub">改完实时重算</span></span>'
                + '<span class="tag-lv weak">重点讲评 ' + UI.keyLect.length + ' 题</span>'
                + '<button class="rp-btn sm no-print" data-act="keylect-clear">清空标记</button>'
                + '<button class="rp-btn sm primary no-print" data-act="lect-export">导出讲评清单</button>';
        }

        /* ══════════════════════ T7 · 关注学生名单 ══════════════════════ */
        var UI_FOLLOW = {};
        try {
            var fs = sessionStorage.getItem('rp-follow-' + RP_PARAMS.hw + '-' + CLS);
            if (fs) UI_FOLLOW = JSON.parse(fs) || {};
        } catch (e) { }
        function actionFor(s) {
            var w = s.weak && s.weak.length ? s.weak[0] : '薄弱知识点';
            var low = s.tags.indexOf('本次低分') > -1, ab = s.tags.indexOf('本次答题异常') > -1;
            if (low && ab) return '面批 + 家长沟通：先查空白题原因（时间 / 畏难），再补「' + w + '」起点题';
            if (low) return '课后补练「' + w + '」基础题 5 题，下次课前抽查';
            if (ab) return '核查答题时长与未答题，排除非知识性因素后再定是否补练';
            return '保持现有节奏，可适当提高拓展题比例';
        }
        function followState(f) {
            var n = ['talk', 'prac', 'parent'].filter(function (k) { return f && f[k]; }).length;
            if (n === 3) return '<span class="tag-lv master">已闭环</span>';
            if (n > 0) return '<span class="tag-lv weak">跟进中 ' + n + '/3</span>';
            return '<span class="tag-flag gray">未跟进</span>';
        }
        /* 关注学生侧栏：跟进率一眼可见，不靠逐行数按钮 */
        function t7Aside() {
            var hit = rpStudents(CLS).filter(function (s) { return s.tags.length; });
            function cnt(fn) {
                return hit.filter(function (s) { var f = UI_FOLLOW[s.examNum] || {}; return fn(f); }).length;
            }
            var done = cnt(function (f) { return f.talk || f.prac || f.parent; });
            var close = cnt(function (f) { return f.talk && f.prac && f.parent; });
            return '<span class="tag-lv ' + (hit.length && done === hit.length ? 'master' : 'weak') + '">已跟进 ' + done + ' / ' + hit.length + ' 人</span>'
                + '<span class="tag-flag gray">已闭环 ' + close + ' 人</span>';
        }
        function t7Body() {
            var stus = rpStudents(CLS);
            var hit = stus.filter(function (s) { return s.tags.length; });
            var rows = hit.map(function (s) {
                var f = UI_FOLLOW[s.examNum] || {};
                var marks = [['talk', '已谈话'], ['prac', '已补练'], ['parent', '已联系家长']].map(function (p) {
                    return '<button class="rp-btn sm' + (f[p[0]] ? ' primary' : '') + '" data-act="follow" data-k="' + p[0]
                        + '" data-id="' + rpEsc(s.examNum) + '" aria-pressed="' + (!!f[p[0]]) + '">' + (f[p[0]] ? '✓ ' : '') + p[1] + '</button>';
                }).join(' ');
                return '<tr><td><a href="#m7" data-act="stu" data-nm="' + rpEsc(s.name) + '">' + rpEsc(s.name) + '</a>'
                    + '<div class="mod-sub">' + rpEsc(s.examNum) + '</div></td>'
                    + '<td class="num">' + s.scoreRate + '%<div class="mod-sub">班 ' + (SMALL ? '—' : s.classRank) + ' · 级 ' + (SMALL ? '—' : s.gradeRank) + '</div></td>'
                    + '<td>' + s.tags.map(function (t) { return '<span class="tag-lv none">' + rpEsc(t) + '</span>'; }).join(' ') + '</td>'
                    + '<td>' + (s.weak || []).map(function (w) { return rpEsc(w); }).join('、') + '</td>'
                    + '<td>' + rpEsc(actionFor(s)) + '</td>'
                    + '<td>' + followState(f) + '</td>'
                    + '<td class="no-print">' + marks + '</td></tr>';
            }).join('');
            return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>姓名 / 学号</th><th class="num">得分率（排名）</th>'
                + '<th>命中规则</th><th>薄弱知识点</th><th>建议动作</th><th>跟进状态</th><th class="no-print">跟进操作</th>'
                + '</tr></thead><tbody>'
                + (rows || '<tr class="dim"><td colspan="7">本次无命中预警规则的学生</td></tr>')
                + '</tbody></table></div>'
                + (SMALL ? smallNote() : '');
        }

        /* ══════════════════════ T8 · 年级定位与对标（整合原教师 R2 的独有信息） ══════════════════════ */
        function t8PositionBody() {
            var dMean = Math.round((M.mean - G.mean) * 10) / 10;
            var dBest = Math.round((M.mean - RP_BEST.mean) * 10) / 10;
            return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>年级位次</th><th>与年级均差</th><th>与年级最优班差距</th><th>同类型班级内排名</th>'
                + '</tr></thead><tbody><tr>'
                + '<td>第 <b>' + RK.rank + '</b> / ' + RK.total + ' 个已批阅班级<div class="mod-sub">前 ' + Math.round(RK.rank / RK.total * 100) + '%</div></td>'
                + '<td>' + pp(dMean) + '<div class="mod-sub">年级平均 ' + G.mean + '%</div></td>'
                + '<td>' + pp(dBest) + '<div class="mod-sub">匿名参照，不露班名与教师名</div></td>'
                + '<td><span class="na">隐藏</span><div class="mod-sub">班级分组未接入，且同类班级 &lt; 3 个时必须隐藏</div></td>'
                + '</tr></tbody></table></div>';
        }
        function t8Gap() {
            return RP_QUESTIONS.map(function (q, i) {
                return { i: i, no: q.no, d: Math.round((RP_BEST.qRates[i] - C.qRates[i]) * 10) / 10 };
            }).filter(function (x) { return x.d > 0; }).sort(function (a, b) { return b.d - a.d; }).slice(0, 3);
        }
        function t8BenchmarkBody() {
            var gap = t8Gap(), gapIdx = gap.map(function (x) { return x.i; });
            var chart = rpSvg3Line({
                labels: RP_QUESTIONS.map(function (q) { return q.no; }),
                mine: C.qRates, best: RP_BEST.qRates, grade: RP_GRADE.qRates,
                gapIdx: gapIdx, w: 640, h: 200
            });
            var rows = gap.map(function (x) {
                var q = RP_QUESTIONS[x.i], cs = RP_CAUSES.find(function (c) { return c.id === q.cause; });
                return '<tr class="hl"><td><b>第 ' + q.no + ' 题</b></td><td>' + rpEsc(q.stem) + '</td>'
                    + '<td class="num">' + C.qRates[x.i] + '%</td><td class="num">' + RP_BEST.qRates[x.i] + '%</td>'
                    + '<td class="num"><span class="neg">−' + Math.abs(x.d) + 'pp</span></td>'
                    + '<td>' + rpEsc(rpKpNames(q.kps)) + ' · ' + rpEsc(cs ? cs.n : '—') + '</td></tr>';
            }).join('');
            var allRows = RP_QUESTIONS.map(function (q, i) {
                var mv = C.qRates[i], bv = RP_BEST.qRates[i], gv = RP_GRADE.qRates[i];
                var db = Math.round((mv - bv) * 10) / 10, dg = Math.round((mv - gv) * 10) / 10;
                return '<tr' + (db <= -8 ? ' class="hl"' : '') + '><td><b>' + q.no + '</b></td><td>' + rpEsc(q.stem) + '</td>'
                    + '<td class="num">' + mv + '%</td><td class="num">' + bv + '%</td><td class="num">' + gv + '%</td>'
                    + '<td class="num"><span class="' + (db < 0 ? 'neg' : (db > 0 ? 'pos' : '')) + '">' + rpPp(db) + '</span></td>'
                    + '<td class="num"><span class="' + (dg < 0 ? 'neg' : (dg > 0 ? 'pos' : '')) + '">' + rpPp(dg) + '</span></td></tr>';
            }).join('');
            return '<h5 class="sub-h">匿名三线对比 · 差距最大的 3 题</h5><div class="rp-cols"><div>'
                + '<div class="chart-box">' + chart + '</div>'
                + '<div class="chart-legend"><span><i style="background:#8fb5fa"></i>我的班（' + rpEsc(CLS) + ' 班）</span>'
                + '<span><i style="background:#cf1322"></i>差距最大 3 题（▲）</span>'
                + '<span><i style="background:#389e0d;border-radius:0;height:0;border-top:2px solid #389e0d"></i>年级最优班（匿名）</span>'
                + '<span><i class="line"></i>年级平均</span></div>'
                + '<div class="chart-alt">移动端已隐藏图表。差距最大 3 题：' + (gap.map(function (x) { return '第 ' + x.no + ' 题（差 ' + Math.abs(x.d) + 'pp）'; }).join('、') || '无') + '。</div></div>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>差距最大题</th><th>题干摘要</th><th class="num">我的班</th><th class="num">最优班</th><th class="num">差距</th><th>知识点 · 错因</th></tr></thead><tbody>'
                + (rows || '<tr><td colspan="6">本次各题均不落后于最优班</td></tr>') + '</tbody></table></div></div>'
                + '<details class="rp-fold rp-mt"><summary>展开全部 ' + RP_QUESTIONS.length + ' 题三线明细</summary><div class="fold-b">'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>题号</th><th>题干摘要</th><th class="num">我的班</th><th class="num">最优班</th><th class="num">年级</th><th class="num">与最优班</th><th class="num">与年级</th></tr></thead><tbody>'
                + allRows + '</tbody></table></div><div class="chart-note">高亮行 = 我的班与最优班差 ≥ 8pp。</div></div></details>';
        }
        function t8BestBody() {
            var gap = t8Gap();
            var own = RP_QUESTIONS.map(function (q, i) {
                return { no: q.no, d: Math.round((C.qRates[i] - RP_GRADE.qRates[i]) * 10) / 10, gv: RP_GRADE.qRates[i], mv: C.qRates[i] };
            }).filter(function (x) { return x.d < -8 && x.gv >= RP_CONFIG.kp.master; }).slice(0, 3);
            return '<h5 class="sub-h">向最优班学习 · 我班独有问题</h5>'
                + '<div class="rp-cols eq"><div class="lect-item"><span class="qno">向最优班学什么</span><div class="li-body">'
                + (gap.length ? gap.map(function (x) {
                    var q = RP_QUESTIONS[x.i], cs = RP_CAUSES.find(function (c) { return c.id === q.cause; });
                    return '<div>第 ' + x.no + ' 题（' + rpEsc(rpKpNames(q.kps)) + '）：最优班高出 ' + Math.abs(x.d) + 'pp，主错因「' + rpEsc(cs ? cs.n : '—') + '」——调取该题同类讲评范例，对齐讲法。</div>';
                }).join('') : '本次各题与最优班差距均在波动范围内，无显著对标项。') + '</div></div>'
                + '<div class="lect-item"><span class="qno">我班独有问题</span><div class="li-body">'
                + (own.length ? own.map(function (x) {
                    return '<div>第 ' + x.no + ' 题：年级 ' + x.gv + '%（不弱）而我班仅 ' + x.mv + '%——非年级共性，需班内自查讲练到位程度。</div>';
                }).join('') : '我班无「年级不弱而我班明显弱」的题目，短板均为年级共性，建议跟随年级统一动作。') + '</div></div></div>';
        }
        function t8CommonBody() {
            var dims = RP_KP_DIMS.map(function (d) {
                var list = rpCommonWeak(d.id);
                return { d: d, list: list, hits: list.filter(function (w) { return w.hit; }) };
            });
            var summary = dims.map(function (x) { return x.d.short + ' ' + x.hits.length + ' / ' + x.list.length; }).join(' · ');
            var body = dims.map(function (x) {
                var rows = x.list.map(function (w) {
                    return '<tr' + (w.hit ? ' class="hl"' : '') + '><td><b>' + rpEsc(w.n) + '</b>' + (w.hit ? ' <span class="tag-lv weak">共性薄弱</span>' : '') + '</td>'
                        + '<td class="num">' + w.gradeRate + '%</td><td class="num">' + w.weakCnt + ' / ' + w.poolCnt + ' 班</td>'
                        + '<td class="num">' + w.cover + '%</td><td>' + rpEsc(w.reason) + '</td></tr>';
                }).join('');
                return '<h5 class="sub-h">' + rpEsc(x.d.n) + ' · 完整清单</h5><div class="tbl-wrap"><table class="tbl"><thead><tr>'
                    + '<th>知识点</th><th class="num">年级掌握率</th><th class="num">薄弱班覆盖</th><th class="num">覆盖率</th><th>命中规则</th>'
                    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
            }).join('');
            return '<details class="rp-fold rp-mt" data-common="weak"><summary>年级共性薄弱 · ' + summary + ' 个知识点命中（默认摘要，点击展开）</summary>'
                + '<div class="fold-b">' + body + '<div class="rp-note">各维度独立统计；小样本班不参与覆盖计算。共性问题跟随年级统一补强，不归责到班。</div></div></details>';
        }
        function t8CauseBody() {
            var mx = rpCauseKpMatrix(), total = mx.reduce(function (s, x) { return s + x.total; }, 0) || 1;
            var top = mx[0];
            var rows = mx.map(function (x) {
                var kps = Object.keys(x.cells).filter(function (k) { return x.cells[k] > 0; });
                return '<tr><td><b>' + rpEsc(x.n) + '</b></td><td class="num">' + x.total + '</td>'
                    + '<td class="num">' + Math.round(x.total / total * 100) + '%</td>'
                    + '<td>' + kps.map(function (k) { return rpEsc(kpOf(k)); }).join('、') + '</td></tr>';
            }).join('');
            return '<details class="rp-fold rp-mt" data-common="cause"><summary>年级共性错因 · 首要「' + rpEsc(top.n) + '」' + top.total + ' 人次（' + Math.round(top.total / total * 100) + '%，点击展开完整清单）</summary>'
                + '<div class="fold-b"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>错因（跨班汇总）</th><th class="num">人次</th><th class="num">占比</th><th>涉及知识点（不分维度）</th></tr></thead><tbody>'
                + rows + '</tbody></table></div><div class="rp-note">错因按题目聚合，不设知识点维度；仅接入大模型智批且带错因标注的题目计入。</div></div></details>';
        }
        function t8Body() {
            var compare = SMALL
                ? smallNote() + '<div class="gray-off rp-mt">小样本班级不给出位次、均差与最优班对标，避免误读；年级共性摘要仍可查看。</div>'
                : t8PositionBody() + t8BenchmarkBody() + t8BestBody();
            return compare + t8CommonBody() + t8CauseBody();
        }

        /* ══════════════════════ T9 · 教学建议（规则化生成，可编辑） ══════════════════════ */
        function t9Body() {
            var D = rpDim(UI.kpDim);
            /* ① 优先讲评题：按失分占比排序 */
            var lostAll = RP_QUESTIONS.map(function (q, i) { return qLost(i); }).reduce(function (a, b) { return a + b; }, 0) || 1;
            var top = RP_QUESTIONS.map(function (q, i) { return { no: q.no, lost: qLost(i), rate: C.qRates[i], i: i }; })
                .sort(function (a, b) { return b.lost - a.lost; }).slice(0, 5);
            var seg1 = '<ol class="rp-ol">' + top.map(function (t) {
                return '<li>第 ' + t.no + ' 题（得分率 ' + t.rate + '%）失分 ' + t.lost + ' 分，占本班总失分 <b>'
                    + Math.round(t.lost / lostAll * 100) + '%</b> <a href="#m3" data-jump="' + t.i + '">看明细</a></li>';
            }).join('') + '</ol>';
            /* ② 知识点补强：只在当前维度内取最弱项，不跨维度排名 */
            var weak = rpKpsOfDim(UI.kpDim).map(function (k) { return { n: k.n, v: C.kpRates[k.id], gv: RP_GRADE.kpRates[k.id] }; })
                .sort(function (a, b) { return a.v - b.v; }).slice(0, 2);
            var seg2 = weak.map(function (w) {
                var common = rpCommonWeak(UI.kpDim).some(function (x) { return x.n === w.n && x.hit; });
                return '<li><b>' + rpEsc(w.n) + '</b>（本班 ' + w.v + '% / 年级 ' + w.gv + '%）：'
                    + (w.v < RP_CONFIG.kp.weak
                        ? '未达掌握线，先用 2 课时重建判据（规则归纳 → 对比错例 → 变式检测），不要直接刷题。'
                        : '处于薄弱带，随堂 5 分钟专项 + 课后 6 题巩固即可。')
                    + (common ? ' <span class="tag-flag gray">年级共性薄弱，可等年级统一补强，不必单独加码</span>' : '')
                    + '</li>';
            }).join('');
            var saved = '';
            try { saved = sessionStorage.getItem('rp-note-' + RP_PARAMS.hw + '-' + CLS) || ''; } catch (e) { }
            /* ① 与 ② 都是短列表，左右并排（窄屏回落单列）；分层作业已独立为模块 9，这里不再重复 */
            return dimLine('知识点补强只在当前维度内取最弱两项')
                + '<div class="rp-cols eq"><div>'
                + '<h5 class="sub-h">① 优先讲评题（按失分占比排序）</h5>' + seg1 + '</div><div>'
                + '<h5 class="sub-h">② 知识点补强建议（' + rpEsc(D.n) + '）</h5><ol class="rp-ol">' + seg2 + '</ol></div></div>'
                + '<div class="no-print"><h5 class="sub-h">教师批注（随导出一起输出）</h5>'
                + '<textarea class="rp-ta" id="rp-note" placeholder="例：本次讲评先做第 6、11 题，C 层名单周一面批…">' + rpEsc(saved) + '</textarea>'
                + '<div class="rp-row" style="margin-top:6px"><button class="rp-btn primary" data-act="save-note">保存批注</button>'
                + '<button class="rp-btn" data-act="print">导出报告</button></div></div>';
        }

        /* ══════════════════════ T10 · 分层建议（班内三层：各层作业与补练不同） ══════════════════════
   与模块 2 的四档不是一个口径：四档看「离及格 / 优秀的绝对距离」，分层看「班内该分几层、各层补什么」；
   分层只看班内位次（前 30% / 中间 50% / 后 20%），人数在各班内自洽，不做跳班比较 */
        function layerTask(x) {
            if (x.key === 'A') return '拓展 3 题：第 ' + x.topQ + ' 题同考点拔高 + 应用文升格 1 篇，免做本次基础变式';
            if (x.key === 'B') return '巩固 6 题：第 ' + x.topQ + ' 题同知识点变式，次日提交并抽查 3 人';
            return '基础 8 题：「' + x.weakKp.n + '」起点题 + 面批 1 次，先保及格线';
        }
        function t10Body() {
            var D = rpDim(UI.kpDim);
            var L = rpLayers(CLS, UI.kpDim);
            if (!L.length) return '<div class="gray-off">本班有效样本为空，无法分层。</div>';
            var n = L.reduce(function (a, x) { return a + x.cnt; }, 0);
            var span = Math.round((L[0].mean - L[L.length - 1].mean) * 10) / 10;
            var rows = L.map(function (x) {
                var names = x.members.map(function (s) { return rpEsc(s.name); }).join('、');
                return '<tr><td><b>' + x.name + '</b><div class="mod-sub">' + x.sub + '</div></td>'
                    + '<td class="num">' + x.cnt + ' 人<div class="mod-sub">' + x.pct + '%</div></td>'
                    + '<td class="num">' + x.mean + '%<div class="mod-sub">' + (x.d === 0 ? '与班均持平' : rpPp(x.d) + ' vs 班均') + '</div></td>'
                    + '<td class="num">' + x.min + '–' + x.max + '%</td>'
                    + '<td class="num">' + x.exN + ' / ' + x.passN + ' 人</td>'
                    + '<td>' + rpEsc(x.weakKp.n) + '<div class="mod-sub">' + x.weakKp.v + '%</div></td>'
                    + '<td>第 ' + x.topQ + ' 题<div class="mod-sub">失 ' + x.topQlost + ' 分</div></td>'
                    + '<td>' + rpEsc(layerTask(x))
                    + '<details class="basis"><summary>名单 ' + x.cnt + ' 人</summary><div class="basis-b">' + names + '</div></details>'
                    + '</td></tr>';
            }).join('');
            return '<div class="stat-row"><span>三层覆盖 <b>' + n + '</b> 人</span>'
                + '<span>首末层均分差 <b>' + span + 'pp</b></span>'
                + '<span>层数 <b>' + L.length + '</b></span></div>'
                + dimLine('最弱知识点只在本维度内选取')
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>层级</th><th class="num">人数</th><th class="num">平均得分率</th><th class="num">区间</th>'
                + '<th class="num">优秀 / 及格</th><th>最弱知识点（' + rpEsc(D.n) + '）</th><th>失分最大题</th><th>建议作业与名单</th>'
                + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
        }

        /* ══════════════════════ L2 · 班级横向对比 ⭐（R3 模块 2） ══════════════════════ */
        function l2Aside() {
            return '<div class="seg" role="tablist" aria-label="表格图形切换">'
                + '<button class="' + (UI.view === 'tbl' ? 'on' : '') + '" data-view="tbl" role="tab" aria-selected="' + (UI.view === 'tbl') + '">表格</button>'
                + '<button class="' + (UI.view === 'chart' ? 'on' : '') + '" data-view="chart" role="tab" aria-selected="' + (UI.view === 'chart') + '">柱状图</button></div>';
        }
        function l2Body() {
            var sum = { wait: 0, valid: 0 };
            if (UI.view === 'chart') {
                var items = rpReviewedClasses().slice().sort(function (a, b) { return b.mean - a.mean; }).map(function (c) {
                    return { n: c.cls + ' 班', v: c.mean, ref: RP_GRADE.mean, color: c.cls === CLS ? '#2468f2' : '#909399' };
                });
                return '<div class="chart-box">' + rpSvgHBars({ items: items }) + '</div>'
                    + '<div class="chart-legend"><span><i style="background:#2468f2"></i>当前班（' + CLS + ' 班）</span>'
                    + '<span><i style="background:#909399"></i>其他班</span><span><i class="line"></i>年级均分 ' + RP_GRADE.mean + '%</span></div>'
                    + '<div class="chart-alt">移动端已隐藏柱状图，请切换「表格」查看明细。</div>'
                    + '<div class="chart-note">未批阅班级（72 班）不参与；小样本班级（76 班）照常展示但标注样本数。</div>';
            }
            var rows = RP_CLASSES.map(function (c) {
                if (c.status !== 'reviewed') {
                    return '<tr class="dim"><td><b>' + c.cls + '</b></td><td>' + rpEsc(c.teacher) + '</td>'
                        + '<td colspan="7" class="why">未批阅，不参与统计</td></tr>';
                }
                var m = rpMetrics(c.cls), tiers = rpTiers(c.cls);
                var rank = rpRank(c.cls);
                var small = rpSmall(c);
                var d = small ? null : Math.round((m.mean - RP_GRADE.mean) * 10) / 10;
                var wait = tiers.n - tiers.pass;
                sum.wait += wait; sum.valid += m.valid;
                return '<tr' + (c.cls === CLS ? ' class="hl"' : (small ? ' class="dim"' : '')) + '>'
                    + '<td><b>' + c.cls + ' 班</b>' + (c.cls === CLS ? ' <span class="tag-lv weak">当前</span>' : '') + '</td>'
                    + '<td>' + rpEsc(c.teacher) + '</td>'
                    + '<td class="num">' + m.mean + '%' + (small ? '<div class="why">样本 ' + m.valid + ' 人</div>' : ' <span class="rank-bdg">第 ' + rank.rank + ' / ' + rank.total + '</span>') + '</td>'
                    + '<td class="num">' + (small ? '—' : pp(d)) + '</td>'
                    + '<td class="num">' + (small ? '<span class="na">—</span>' : m.exRate + '%') + '</td>'
                    + '<td class="num">' + m.subRate + '%</td>'
                    + '<td class="num">' + (small ? '<span class="na">—</span>' : wait) + '</td>'
                    + '<td class="num">' + (small ? '<span class="na">—</span>' : m.lowRate + '%') + '</td>'
                    + '<td class="num">' + m.valid + '</td></tr>';
            }).join('');
            /* 合计行：年级口径按有效人数加权，不是各班简单平均；待及格人数直接求和（绝对工作量） */
            return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>班级</th><th>任课教师</th><th class="num">平均得分率（排名）</th><th class="num">与年级均差</th>'
                + '<th class="num">优秀率</th><th class="num">提交率</th><th class="num">待及格人数</th><th class="num">低分率</th><th class="num">有效样本</th>'
                + '</tr></thead><tbody>' + rows + '</tbody>'
                + '<tfoot><tr><td colspan="2"><b>年级合计</b>（' + rpRank(CLS).total + ' 个已批阅班）</td>'
                + '<td class="num">' + G.mean + '%</td><td class="num">—</td>'
                + '<td class="num">' + G.exRate + '%</td><td class="num">' + G.subRate + '%</td>'
                + '<td class="num">' + sum.wait + '</td><td class="num">' + G.lowRate + '%</td>'
                + '<td class="num">' + sum.valid + '</td></tr></tfoot></table></div>';
        }

        /* ══════════════════════ L3 · 知识点班际差异（R3 模块 3） ══════════════════════ */
        function sigFor(kpId) {
            if (SMALL) return null;
            var x1 = Math.round(C.kpRates[kpId] / 100 * C.valid), n1 = C.valid;
            var x2 = 0, n2 = 0;
            rpReviewedClasses(true).forEach(function (o) {
                if (o.cls === CLS) return;
                x2 += Math.round(o.kpRates[kpId] / 100 * o.valid); n2 += o.valid;
            });
            return rpZTest(x1, n1, x2, n2);
        }
        function l3Body() {
            var D = rpDim(UI.kpDim);
            var pool = rpReviewedClasses(true);
            var list = rpKpsOfDim(UI.kpDim).map(function (k) {
                var vals = pool.map(function (c) { return c.kpRates[k.id]; });
                var range = vals.length ? Math.round((Math.max.apply(null, vals) - Math.min.apply(null, vals)) * 10) / 10 : 0;
                var t = sigFor(k.id);
                return {
                    id: k.id, n: k.n, v: C.kpRates[k.id], gv: RP_GRADE.kpRates[k.id],
                    d: Math.round((C.kpRates[k.id] - RP_GRADE.kpRates[k.id]) * 10) / 10,
                    range: range, t: t
                };
            }).sort(function (a, b) { return a.d - b.d; });
            var chart = rpSvgHBars({ items: list.map(function (x) { return { n: x.n, v: x.v, ref: x.gv }; }), w: 640, pl: 120 });
            var rows = list.map(function (x) {
                var sig = SMALL ? '<span class="na">样本不足</span>'
                    : (x.t.mark ? '<span class="sig' + (x.t.mark === '*' ? ' one' : '') + '">' + x.t.mark + '</span>'
                        + '<span class="mod-sub"> p=' + (Math.round(x.t.p * 1000) / 1000) + '</span>'
                        : '<span class="mod-sub">波动范围内，不建议据此下结论</span>');
                return '<tr><td><b>' + rpEsc(x.n) + '</b></td>'
                    + '<td class="num">' + x.v + '%</td><td class="num">' + x.gv + '%</td>'
                    + '<td class="num"><span class="' + (x.d < 0 ? 'neg' : (x.d > 0 ? 'pos' : '')) + '">' + rpPp(x.d) + '</span></td>'
                    + '<td class="num">' + x.range + 'pp</td>'
                    + '<td>' + sig + '</td></tr>';
            }).join('');
            /* v3 左图右表：知识点条形图（w:640）| 差异表，不再上下叠加 */
            return dimLine('班际极差与显著性只在本维度内比较')
                + '<div class="rp-cols"><div>'
                + '<div class="chart-box">' + chart + '</div>'
                + '<div class="chart-legend"><span><i style="background:#2468f2"></i>本班（' + CLS + ' 班）</span><span><i class="line"></i>年级掌握率</span></div>'
                + '<div class="chart-alt">移动端已隐藏条形图，请查看下方差异表。</div></div>'
                + '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>知识点（' + rpEsc(D.n) + ' · 按差值升序）</th><th class="num">本班</th><th class="num">年级</th><th class="num">差值</th>'
                + '<th class="num">班际极差</th><th>显著性</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
        }

        /* ══════════════════════ L4 · 质量诊断四象限 ⭐（R3 模块 4） ══════════════════════ */
        function l4Body() {
            var D = rpDim(UI.kpDim);
            if (SMALL) return dimLine('四象限按当前维度内知识点判定')
                + smallNote() + '<div class="gray-off rp-mt">有效样本 ' + M.valid + ' 人 &lt; ' + RP_CONFIG.smallSample + '，四象限判定不作数，请逐生面批掌握实情。</div>';
            var dMean = Math.round((C.mean - RP_GRADE.mean) * 10) / 10;
            var kpList = rpKpsOfDim(UI.kpDim).map(function (k) { return { id: k.id, n: k.n, v: C.kpRates[k.id], gv: RP_GRADE.kpRates[k.id] }; });
            var betterCnt = kpList.filter(function (x) { return x.v >= x.gv; }).length;
            var betterAll = betterCnt === kpList.length;
            var worseKps = kpList.filter(function (x) { return x.v < RP_CONFIG.kp.weak; });
            var common = rpCommonWeak(UI.kpDim).filter(function (w) { return w.hit; });
            var isCommon = worseKps.filter(function (x) { return common.some(function (w) { return w.n === x.n; }); });
            var localWeak = worseKps.filter(function (x) { return !common.some(function (w) { return w.n === x.n; }); });
            var rangeMax = Math.max.apply(null, kpList.map(function (x) {
                var vals = rpReviewedClasses(true).map(function (c) { return c.kpRates[x.id]; });
                return Math.round((Math.max.apply(null, vals) - Math.min.apply(null, vals)) * 10) / 10;
            }));
            var sigKps = kpList.filter(function (x) { var t = sigFor(x.id); return t && t.mark === '**'; });
            var quads = [
                {
                    t: '教学有效，可推广', hit: dMean > RP_CONFIG.meanGap && betterAll,
                    c: '均分明显高于年级 + 知识点全面优于年级',
                    a: '提炼经验，安排公开课 / 教研分享',
                    basis: '均分差 = 班均 ' + C.mean + '% − 年级均 ' + RP_GRADE.mean + '% = <b>' + rpPp(dMean) + '</b>'
                        + (dMean > RP_CONFIG.meanGap ? '（&gt; +' + RP_CONFIG.meanGap + 'pp 判定线 ✓）' : '（未达 +' + RP_CONFIG.meanGap + 'pp 判定线 ✗）')
                        + '；知识点优于年级：' + betterCnt + ' / ' + kpList.length + (betterAll ? ' ✓' : ' ✗')
                },
                {
                    t: '差异显著，需统一教研', hit: rangeMax >= RP_CONFIG.sdPp && sigKps.length > 0,
                    c: '班际极差大 + 显著性检验通过',
                    a: '组织集体备课，统一教学进度与方法',
                    basis: '班际极差最大 ' + rangeMax + 'pp' + (rangeMax >= RP_CONFIG.sdPp ? '（≥' + RP_CONFIG.sdPp + 'pp 判定线 ✓）' : '（&lt;' + RP_CONFIG.sdPp + 'pp ✗）')
                        + '；p&lt;' + RP_CONFIG.sig.two + ' 显著知识点：' + (sigKps.length ? sigKps.map(function (x) { return x.n; }).join('、') + ' ✓' : '无 ✗')
                },
                {
                    t: '年级薄弱，优先补强', hit: isCommon.length > 0,
                    c: '全年级该知识点均薄弱',
                    a: '不是教师问题，年级层面统一补强',
                    basis: isCommon.length
                        ? isCommon.map(function (x) {
                            var w = common.find(function (o) { return o.n === x.n; });
                            return x.n + '（年级 ' + w.gradeRate + '%、薄弱班覆盖 ' + w.cover + '%）';
                        }).join('；') + ' → 命中'
                        : '本班未掌握（&lt;' + RP_CONFIG.kp.weak + '%）的知识点均不属年级共性薄弱 → 未命中'
                },
                {
                    t: '局部薄弱，班内自查', hit: localWeak.length > 0,
                    c: '仅本班个别知识点弱',
                    a: '提示任课教师班内自查，不上升年级',
                    basis: localWeak.length
                        ? localWeak.map(function (x) { return x.n + '（本班 ' + x.v + '% / 年级 ' + x.gv + '%）'; }).join('；') + ' → 命中'
                        : '本班无“未掌握且非年级共性”的知识点 → 未命中'
                }
            ];
            return dimLine('「知识点全面优于年级」等判定只统计' + D.n + '，不跨维度合并')
                + '<div class="quad-grid">' + quads.map(function (q) {
                return '<div class="quad' + (q.hit ? ' hit' : '') + '"><div class="q-t"><span class="dot"></span>' + q.t

        /* ══════════════════════ L6 · 关注学生汇总（R3 模块 5，不下钻） ══════════════════════ */
        function l6Body() {
            var stus = rpStudents(CLS);
            function lowN(s) { return s.tags.indexOf('本次低分') > -1; }
            function abN(s) { return s.tags.indexOf('本次答题异常') > -1; }
            var lowArr = stus.filter(lowN), abArr = stus.filter(abN);
            var low = lowArr.length, ab = abArr.length;
            var pool = rpReviewedClasses(true), gl = 0, ga = 0;
            pool.forEach(function (c) {
                rpStudents(c.cls).forEach(function (s) { if (lowN(s)) gl++; if (abN(s)) ga++; });
            });
            var avgL = pool.length ? Math.round(gl / pool.length * 10) / 10 : 0;
            var avgA = pool.length ? Math.round(ga / pool.length * 10) / 10 : 0;
            /* 跟进闭环：合并为 1 列（rowspan），领导只看进度总量，不列个人 */
            var watch = stus.filter(function (s) { return s.tags.length; });
            function fcnt(arr, fn) {
                return arr.filter(function (s) { var f = UI_FOLLOW[s.examNum] || {}; return fn(f); }).length;
            }
            var anyF = function (f) { return f.talk || f.prac || f.parent; };
            var allF = function (f) { return f.talk && f.prac && f.parent; };
            var fCell = '<td rowspan="2"><b>' + fcnt(watch, anyF) + ' / ' + watch.length + ' 人</b>'
                + '<div class="mod-sub">已闭环 ' + fcnt(watch, allF) + ' 人</div>'
                + '<div class="mod-sub">低分 ' + fcnt(lowArr, anyF) + '/' + low + ' · 异常 ' + fcnt(abArr, anyF) + '/' + ab + '</div></td>';
            return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
                + '<th>预警规则</th><th class="num">本班人数</th><th class="num">年级班均</th><th>对比</th><th>跟进闭环（本班）</th></tr></thead><tbody>'
                + '<tr><td><b>本次低分</b>（得分率 ≤ 70%）</td><td class="num">' + low + '</td><td class="num">' + avgL + '</td>'
                + '<td>' + (low > avgL + 2 ? '<span class="neg">高于班均 ' + Math.round((low - avgL) * 10) / 10 + ' 人，需关注</span>' : '<span class="pos">与班均持平或更低</span>') + '</td>'
                + fCell + '</tr>'
                + '<tr><td><b>本次答题异常</b>（未答 ≥ 2 题）</td><td class="num">' + ab + '</td><td class="num">' + avgA + '</td>'
                + '<td>' + (ab > avgA + 2 ? '<span class="neg">高于班均 ' + Math.round((ab - avgA) * 10) / 10 + ' 人，需关注</span>' : '<span class="pos">与班均持平或更低</span>') + '</td></tr>'
                + '</tbody></table></div>';
        }

            }
            var commonTop = rpCommonWeak(UI.kpDim).filter(function (w) { return w.hit; }).slice(0, 2);
            if (commonTop.length) {
                items.push({
                    t: '重点督导知识点',

<script data-proto-review="appearance">
/* PRD 内容色板与序号外观；编辑、导出和发布共用。 */
(() => {
    'use strict';
    const TEXT_COLORS = [
        ['#191919', '黑色'], ['#1684fc', '蓝色'], ['#8a38f5', '紫色'], ['#666666', '灰色'],
        ['#fbfbfb', '白色'], ['#ec4954', '红色'], ['#ff9f29', '橙色']
    ];
    const DEFAULT_PIN = '#2563eb', INK = '#191919', STROKE = '#4e5560', ON_BLUE = '#ffffff';
    const PIN_COLORS = [
        [DEFAULT_PIN, '默认蓝色'],
        ['#acbcd1', '灰蓝'], ['#ff9e93', '珊瑚'], ['#ff9e47', '橙色'], ['#fdd143', '黄色'], ['#9dc4ff', '浅蓝'],
        ['#38cde7', '青色'], ['#54d691', '绿色'], ['#daa3ff', '紫色'], ['#ff94e4', '粉色']
    ];
    const LEGACY_PIN_COLORS = ['#e6e6e6'];
    function pinColor(note) {
        const color = String(note?.color || '').toLowerCase();
        return PIN_COLORS.some(([hex]) => hex === color) || LEGACY_PIN_COLORS.includes(color) ? color : DEFAULT_PIN;
    }
    function applyPin(element, note) {
        const color = pinColor(note), custom = color !== DEFAULT_PIN;
        element.style.setProperty('--pin-fill', color);
        element.style.setProperty('--pin-ink', custom ? INK : ON_BLUE);
        element.style.setProperty('--pin-stroke', custom ? STROKE : ON_BLUE);
    }
    window.ProtoAppearance = { TEXT_COLORS, PIN_COLORS, DEFAULT_PIN, pinColor, applyPin };
})();

</script>

        popMoveCleanup = finish;
        try { grip.setPointerCapture(e.pointerId); } catch (_) { /* window 监听兜底 */ }
        window.addEventListener('pointermove', move, { capture: true, passive: false });
        window.addEventListener('pointerup', up, true);
        window.addEventListener('pointercancel', cancelPointer, true);
        window.addEventListener('blur', cancelMove, true);
        window.addEventListener('keydown', key, true);
    }
    function startPopResize(e, handle, side) {
        if (!pop || popMoving || e.button !== 0) return;
        e.preventDefault(); e.stopPropagation();
        const rect = pop.getBoundingClientRect(), startX = e.clientX, startW = rect.width, fixedRight = rect.right;
        popResizing = { handle, side, pointerId: e.pointerId };
        pop.classList.add('pop-resizing');
        document.documentElement.style.cursor = 'ew-resize';
        document.documentElement.style.userSelect = 'none';
        // 指针按下后由 window 兜住整段拖动；不依赖鼠标始终停留在 12px 边缘热区，也不依赖 pointer capture 是否成功。
        try { handle.setPointerCapture(e.pointerId); } catch (_) { /* 浏览器不支持时 window 监听仍可工作 */ }
        const move = ev => {
            if (!popResizing || ev.pointerId !== e.pointerId) return;
            ev.preventDefault();
            const raw = side === 'e' ? startW + (ev.clientX - startX) : startW - (ev.clientX - startX);
            const minW = Math.min(280, innerWidth - 16), maxW = Math.max(minW, Math.min(720, innerWidth - 16));
            const edgeMax = side === 'e' ? innerWidth - rect.left - 8 : fixedRight - 8;
            const width = Math.max(minW, Math.min(Math.round(raw), maxW, edgeMax));
            pop.style.width = width + 'px';
            if (side === 'w') pop.style.left = Math.max(8, fixedRight - width) + 'px';
        };
        const up = ev => {
            if (!popResizing || ev.pointerId !== e.pointerId) return;
            popResizing = null; pop.classList.remove('pop-resizing');
            document.documentElement.style.cursor = '';
            document.documentElement.style.userSelect = '';
            window.removeEventListener('pointermove', move, true); window.removeEventListener('pointerup', up, true); window.removeEventListener('pointercancel', up, true);
            try { if (handle.hasPointerCapture(e.pointerId)) handle.releasePointerCapture(e.pointerId); } catch (_) { /* ignore */ }
        };
        window.addEventListener('pointermove', move, { capture: true, passive: false });
        window.addEventListener('pointerup', up, true);
        window.addEventListener('pointercancel', up, true);
    }
    function ensurePop() {
        if (pop) return;
        pop = document.createElement('div');
        pop.id = '__review_popover'; pop.className = '__review_pop';
        pop.setAttribute('role', 'dialog');
        pop.setAttribute('data-prototype-owned', '');
        pop.addEventListener('click', e => e.stopPropagation());
        const grip = document.createElement('button');
        grip.type = 'button'; grip.className = '__review_pop_grip';
        grip.setAttribute('aria-label', '移动标注浮窗');
        grip.title = '拖动移动；方向键微调，Shift 加速';
        grip.onpointerdown = e => startPopMove(e, grip);
        grip.addEventListener('keydown', e => {
            if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); hidePop(); return; }
            const direction = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
            if (!direction || e.ctrlKey || e.altKey || e.metaKey) return;
            e.preventDefault(); e.stopPropagation();
            const r = pop.getBoundingClientRect(), step = e.shiftKey ? 40 : 10;
            placePop(r.left + direction[0] * step, r.top + direction[1] * step);
        });
        pop.appendChild(grip);
        popBody = document.createElement('div'); popBody.className = '__review_pop_body';
        pop.appendChild(popBody);
        for (const side of ['w', 'e']) {
            const handle = document.createElement('span');
            handle.className = `__review_pop_resize __review_pop_resize_${side}`;
            handle.setAttribute('aria-hidden', 'true'); handle.title = '拖动调节宽度';
            handle.onpointerdown = e => startPopResize(e, handle, side);
            pop.appendChild(handle);
        }
        document.documentElement.appendChild(pop);
    }
    function showPop(note, pin) {
        ensurePop();
        popMoveCleanup?.();
        setPinExpanded(popNoteId, false);
        popNoteId = note.id;
        pin.setAttribute('aria-expanded', 'true');
        popBody.innerHTML = R.renderBody ? R.renderBody(note) : (note.body || '');
        popBody.scrollTop = 0;
        pop.style.display = 'block';
        pop.style.visibility = 'hidden';
        pop.style.left = '0px'; pop.style.top = '0px';
        const pw = pop.offsetWidth, ph = pop.offsetHeight;
        const px = parseFloat(pin.style.left) || 0, py = parseFloat(pin.style.top) || 0;
        const W = innerWidth, H = innerHeight;
        let left = px + 16, top = py - ph - 8;
        if (left + pw > W - 8) left = px - pw - 16;
        left = Math.max(8, Math.min(left, W - pw - 8));
        if (top < 8) top = py + 8;
        top = Math.max(8, Math.min(top, H - ph - 8));
        pop.style.left = left + 'px'; pop.style.top = top + 'px';
        pop.style.visibility = 'visible';
    }
    function togglePop(note, pin) {
        if (pop && pop.style.display === 'block' && popNoteId === note.id) { hidePop(); return; }
        showPop(note, pin);
    }
    window.__reviewHidePop = hidePop;
    window.__reviewPopNoteId = () => (pop && pop.style.display === 'block' ? popNoteId : null);
    window.__reviewRelayout = () => { try { layout(); } catch (_) { /* ignore */ } };
    document.addEventListener('click', e => {
        if (pop && pop.style.display === 'block' && !pop.contains(e.target) && !e.target.closest?.('.__review_pin')) hidePop();
    }, true);
    // scroll 监听用了 capture，气泡自身 overflow:auto 的滚动也会冒到 window；旧逻辑因此鼠标一滚正文就关气泡。
    // 只在气泡外部（原型页面 / 其他滚动容器）发生滚动时关闭；气泡内部滚动保持打开。
    window.addEventListener('scroll', e => {
        if (pop && pop.style.display === 'block' && pop.contains(e.target)) return;
        hidePop();
        scheduleLayout();
    }, { passive: true, capture: true });
    window.addEventListener('resize', () => { hidePop(); scheduleLayout(); }, { passive: true });

    let layoutFrame = 0;
    function scheduleLayout() {
        if (layoutFrame) return;
        layoutFrame = requestAnimationFrame(() => { layoutFrame = 0; layout(); });
    }

    const stateOf = () => document.documentElement.dataset.protoState || 'default';
    let lastState = '', lastX = -1, lastY = -1, lastW = 0, lastH = 0;
    let lastOrder = '', lastStale = '';
    const pinsById = new Map();

    function layout() {
        const state = stateOf();
        if (state !== lastState) hidePop(); // 只在原型状态切换时关气泡；纯几何重排不关（避免侧栏收起引发的 reflow 误关刚弹出的气泡）
        const notes = (R.notes || []).filter(n => n.stateId === state);
        window.ProtoAnchors.setRevealNotes?.(notes);
        if (selectedNoteId && !notes.some(n => n.id === selectedNoteId)) selectNote(null);
        const arranged = window.ProtoOrder.project(notes, window);
        const stale = [], noPoint = [];
        const visibleIds = new Set(), occupied = [];
        for (const n of arranged) {
            let found = null;
            try { found = window.ProtoAnchors.point(n); } catch (_) { /* 锚定异常按失效处理 */ }
            if (!found?.point) { noPoint.push(n); continue; }
            if (found.point.visible === false) continue; // 滚出嵌套容器的序号随锚点隐藏，不算失锚。
            let pin = pinsById.get(n.id);
            if (!pin) {
                pin = document.createElement('button');
                pin.type = 'button';
                pin.className = '__review_pin';
                pin.dataset.noteId = n.id;
                pinsById.set(n.id, pin);
                layer.appendChild(pin);
            }
            window.ProtoAppearance?.applyPin(pin, n);
            pin.classList.toggle('__review_selected', n.id === selectedNoteId);
            pin.setAttribute('aria-current', String(n.id === selectedNoteId));
            if (pin.textContent !== String(n.displayNumber)) pin.textContent = n.displayNumber;
            pin.setAttribute('aria-label', `标注 ${n.displayNumber}`);
            pin.setAttribute('aria-haspopup', 'dialog');
            pin.setAttribute('aria-controls', '__review_popover');
            pin.setAttribute('aria-expanded', String(popNoteId === n.id && pop?.style.display === 'block'));
            const placed = window.ProtoAnchors.pinPosition
                ? window.ProtoAnchors.pinPosition(found.point.x, found.point.y, pin.offsetWidth || 36, pin.offsetHeight || 36, occupied)
                : found.point;
            pin.style.left = placed.x + 'px';
            pin.style.top = placed.y + 'px';
            pin.onclick = e => {
                e.preventDefault(); e.stopPropagation();
                selectNote(n.id);
                R.onSelect?.(n.id);
                // PRD 侧栏展开：定位到右栏对应内容；收起：就地弹气泡展示内容。
                if (R.asideOpen && R.asideOpen()) { hidePop(); R.onFocus?.(n.id); }
                else togglePop(n, pin);
            };
            visibleIds.add(n.id);
        }
        for (const [id, pin] of pinsById) {
            if (!visibleIds.has(id)) { pin.remove(); pinsById.delete(id); }
        }
        if (popNoteId && !visibleIds.has(popNoteId)) hidePop();
        // 无落点分流（Feature 1 引导 + 失锚判定）：元素还在且被折叠/隐藏 → 正常颜色，可展开的盖透明脉冲描边框引导；
        // 元素真找不到、或可见但落点失效（目标变化）才算失锚（右栏灰显、置底、不可点）。
        const groups = new Map();
        for (const n of noPoint) {
            let el = null; try { el = window.ProtoAnchors.resolveHidden(n.anchor); } catch (_) { /* ignore */ }
            let hint = null;
            try { hint = window.ProtoAnchors.revealHint?.(n.anchor, el); } catch (_) { /* ignore */ }
            if (!hint && el && window.ProtoAnchors.hidden(el)) {
                let trigger = null; try { trigger = window.ProtoAnchors.revealTrigger(el); } catch (_) { /* ignore */ }
                if (trigger) hint = { trigger, target: el, label: '展开', kind: 'disclosure' };
            }
            if (!hint?.trigger) {
                if (!el || !window.ProtoAnchors.hidden(el)) stale.push(n.id); // 元素仍在但隐藏、只是暂无可操作引导时也不算失锚
                continue;
            }
            let g = groups.get(hint.trigger);
            const actionKey = `${hint.kind}\n${hint.label}`;
            if (!g) groups.set(hint.trigger, (g = { target: hint.target, label: hint.label, actionKey, notes: [] }));
            if (g.actionKey === actionKey) g.notes.push(n);
        }
        const GICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
        const existing = [...glayer.querySelectorAll('.__review_guide')];
        const alive = new Set();
        let gi = existing.length;   // 新建引导错峰呼吸（与 proto-annotate.js 一致）：负 delay 立处不同相位
        groups.forEach((g, trig) => {
            const r = trig.getBoundingClientRect();
            if (r.width === 0 && r.height === 0) return;
            // 描边框套在触发器外 4px，小图标至少 22px 保证可点；裁到视口内，完全出视口就不画（与 proto-annotate.js layoutGuides 同算法）
            const pad = 4, w = Math.max(r.width + pad * 2, 22), h = Math.max(r.height + pad * 2, 22);
            let left = r.left + r.width / 2 - w / 2, top = r.top + r.height / 2 - h / 2;
            const right = Math.min(innerWidth - 2, left + w), bottom = Math.min(innerHeight - 2, top + h);
            left = Math.max(2, left); top = Math.max(2, top);
            if (right - left < 8 || bottom - top < 8) return;
            let guide = existing.find(x => x.__rvTrig === trig);
            if (!guide) {
                guide = document.createElement('button');
                guide.type = 'button'; guide.className = '__review_guide';
                guide.__rvTrig = trig;
                guide.style.setProperty('--g-delay', (-(gi++ % 4) * 0.45) + 's');
                guide.onclick = async e => { e.preventDefault(); e.stopPropagation(); try { await window.ProtoAnchors.revealAndWait(guide.__rvTarget); } catch (_) { /* ignore */ } layout(); };
                glayer.appendChild(guide);
            }
            guide.__rvTarget = g.target;
            const safeLabel = String(g.label).replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char]);
            const html = '<span class="__review_guide_tag">' + GICON + '<span>' + safeLabel + ' · ' + g.notes.length + '</span></span>';
            if (guide.__rvHtml !== html) { guide.innerHTML = html; guide.__rvHtml = html; }
            guide.title = '点击“' + g.label + '”以显示 ' + g.notes.length + ' 处标注（' + g.notes.map(n => n.displayNumber).join(' ') + '）';
            guide.setAttribute('aria-label', guide.title);
            guide.style.left = left + 'px'; guide.style.top = top + 'px';
            guide.style.width = (right - left) + 'px'; guide.style.height = (bottom - top) + 'px';
            guide.classList.toggle('__review_guide_below', top < 24);            // 贴顶时标签改挂底边，不被视口切掉
            guide.classList.toggle('__review_guide_end', left + 84 > innerWidth); // 贴右时标签改挂右角
            alive.add(guide);
        });
        existing.forEach(x => { if (!alive.has(x)) x.remove(); });
        const orderKey = JSON.stringify(arranged.map(n => [n.id, n.displayNumber]));
        const staleKey = JSON.stringify(stale);
        if (orderKey !== lastOrder || staleKey !== lastStale || state !== lastState) {
            lastOrder = orderKey; lastStale = staleKey; lastState = state;
            R.onSync?.(Object.fromEntries(arranged.map(n => [n.id, n.displayNumber])), state, stale);
        }
    }

    document.addEventListener('proto-anchors:reveal-failed', layout);

    // 关闭弹窗和显示入口可能保持 HTML 字符数不变；监听真实 DOM 变化。
    // 过滤自有层，避免重建序号 / 拖动浮窗时反过来触发无限重排。
    if (typeof MutationObserver !== 'undefined') {
        new MutationObserver(records => { if (records.some(record => !owned(record.target))) scheduleLayout(); })
            .observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true,
                attributeFilter: ['class', 'style', 'hidden', 'open', 'aria-expanded', 'aria-hidden', 'inert', 'data-proto-state'] });
    }
    for (const event of ['transitionend', 'animationend', 'load'])
        document.addEventListener(event, e => { if (!owned(e.target)) scheduleLayout(); }, true);
    document.fonts?.ready.then(scheduleLayout);

    setInterval(() => {
        if (stateOf() !== lastState || scrollX !== lastX || scrollY !== lastY ||
            innerWidth !== lastW || innerHeight !== lastH) {
            lastX = scrollX; lastY = scrollY; lastW = innerWidth; lastH = innerHeight;
            layout();
        }
    }, 350);

    layout();
})();

</script>
</body>
</html>
