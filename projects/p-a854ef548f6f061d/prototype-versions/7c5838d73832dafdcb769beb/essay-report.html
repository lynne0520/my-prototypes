<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级作文报告 · 讲评试卷 4.0</title>
    <link rel="stylesheet" href="global-nav.css">
    <link rel="stylesheet" href="report.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="prd-viewer.css">
    <style>
        /* ════════ 班级作文报告私有样式（设计令牌复用 report.css 的 --rp-*） ════════ */
        .es-qcard { background: #fff; border: 1px solid #ebeef5; border-radius: var(--rp-radius); margin-bottom: var(--rp-gap); scroll-margin-top: 94px; }
        .es-q-head { display: flex; align-items: center; gap: var(--rp-gap); flex-wrap: wrap; padding: 8px var(--rp-pad-x); border-bottom: 1px solid #f0f2f5; }
        .es-q-title { font-size: 15px; font-weight: 600; }
        /* 切题 pill 推到行尾：与左侧「题目属性 tag」拉开视觉归属，折行时仍紧跟其后 */
        .es-q-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
        .es-pill { border: 1px solid var(--rp-border); background: #fff; color: var(--rp-text2); border-radius: var(--rp-radius); padding: 3px 10px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .es-pill:hover { border-color: var(--rp-primary-bd); color: var(--rp-primary); }
        .es-pill.on { background: var(--rp-primary-bg); border-color: var(--rp-primary-bd); color: var(--rp-primary); font-weight: 600; }
        /* 题目信息区：默认折叠为一行（题干首行），点「展开」显示学科 / 题号 / 文体 / 满分 / 字数 / 智批与完整题干；
           打印时 CSS 强制展开，纸上信息不减 */
        .es-q-info { position: relative; padding: 7px var(--rp-pad-x) 9px; font-size: 13px; color: var(--rp-text2); line-height: 1.65; }
        .es-q-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 7px; }
        .es-q-info.collapsed .es-q-tags { display: none; }
        /* 折叠态：题干截断为一行；「展开 / 收起」按钮常驻题干下方水平居中（不再绝对定位到右上角），
           折叠与展开两种状态下按钮位置完全一致，避免视线在左右之间来回跳 */
        .es-q-info.collapsed .es-q-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; }
        .es-q-toggle { display: flex; align-items: center; justify-content: center; gap: 3px; width: 100%; margin-top: 7px; padding: 0; border: 0; background: none; color: var(--rp-primary); font-size: 12px; cursor: pointer; }
        .es-q-toggle i { font-style: normal; font-size: 10px; }
        .es-tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 3px; padding: 1px 7px; border: 1px solid var(--rp-border); color: var(--rp-text2); background: #fafafa; }
        .es-tag.subj-en { color: #2468f2; background: #ecf3ff; border-color: #b5d0fb; }
        .es-tag.subj-cn { color: #d46b08; background: #fff7e6; border-color: #ffd591; }
        .es-tag.err { color: #cf1322; background: #fff1f0; border-color: #ffa39e; }
        .es-tag.ok { color: #389e0d; background: #f6ffed; border-color: #b7eb8f; }
        .es-tag.hl { color: #9254de; background: #f9f0ff; border-color: #d3adf7; }
        .es-grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--rp-gap); align-items: start; }
        .es-grid2w { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--rp-gap); align-items: start; }
        /* v3：对照卡（病句 / 润色 / 句式）不再单列纵排，两列网格铺排，模块高度减半 */
        .es-pairs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px var(--rp-gap); align-items: start; }
        .es-pairs > .es-pair { margin-bottom: 0; }
        .es-cell { border: 1px solid #ebeef5; border-radius: var(--rp-radius); padding: 8px 10px; background: #fff; }
        .es-cell-t { font-size: 13px; font-weight: 600; color: var(--rp-text2); margin-bottom: 5px; display: flex; align-items: baseline; gap: 8px; }
        .es-cell-t small { font-weight: 400; color: var(--rp-text3); }
        /* 表格统一走 report.css 的 .tbl 语言（1px 描边 + 表头浅灰），不再单独维护一套「仅底边线」表 */
        .tbl tr.hl-row td { background: #fff7e6; }
        .es-rank-list { display: flex; flex-direction: column; gap: 4px; }
        .es-rank-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .es-rank-no { width: 20px; height: 20px; border-radius: 50%; background: #f0f2f5; color: var(--rp-text2); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .es-rank-item.top .es-rank-no { background: var(--rp-primary); color: #fff; }
        .es-rank-item.low .es-rank-no { background: #fff1f0; color: #cf1322; }
        .es-rank-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .es-rank-item .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
        .es-pair { border: 1px solid #ebeef5; border-left: 3px solid var(--rp-warn); border-radius: var(--rp-radius); padding: 7px 10px; margin-bottom: 6px; background: #fff; }
        .es-pair.pri { border-left-color: var(--rp-primary); }   /* 表达升级 / 润色 */
        .es-pair.ok { border-left-color: #389e0d; }              /* 亮点 */
        .es-pair-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .es-pair-head + .es-note { margin-top: 0; }
        .es-pair-head .who { margin-left: auto; font-size: 12px; color: var(--rp-text3); }
        .es-sent { display: flex; gap: 8px; font-size: 13px; line-height: 1.7; align-items: baseline; }
        .es-lb { flex-shrink: 0; font-size: 11px; color: var(--rp-text3); border: 1px solid #ebeef5; border-radius: 3px; padding: 0 5px; }
        .es-del { color: #cf1322; text-decoration: line-through; text-decoration-color: rgba(207, 19, 34, .55); }
        .es-ins { color: #389e0d; text-decoration: none; font-weight: 600; }
        .es-note { font-size: 12px; color: var(--rp-text3); margin-top: 4px; padding-left: 2px; }
        /* ── 模块 6「学生佳句」：三类维度各自独立分组 ──
           层级：维度块（高级句式 / 高级词汇 / 生动描写）→ 分类块 → 「姓名 + 句子」条目。
           三个维度块互不混排：左色条 + 浅色标题栏区分归属，条目行左挂姓名徽章 ── */
        .es-best { display: flex; flex-direction: column; gap: var(--rp-gap); }
        .es-bd { border: 1px solid #ebeef5; border-left: 3px solid var(--bd-c); border-radius: var(--rp-radius); background: #fff; }
        .es-bd[data-dim="syn"] { --bd-c: #9254de; --bd-bg: #f9f0ff; --bd-bd: #d3adf7; }
        .es-bd[data-dim="voc"] { --bd-c: #2468f2; --bd-bg: #ecf3ff; --bd-bd: #b5d0fb; }
        .es-bd[data-dim="des"] { --bd-c: #08979c; --bd-bg: #e6fffb; --bd-bd: #87e8de; }
        .es-bd-h { display: flex; align-items: baseline; gap: var(--rp-gap); flex-wrap: wrap; padding: 7px 12px; border-bottom: 1px solid #f0f2f5; background: var(--bd-bg); }
        .es-bd-n { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: var(--bd-c); }
        .es-bd-n i { width: 6px; height: 6px; border-radius: 50%; background: var(--bd-c); flex: none; }
        .es-bd-m { font-size: 11.5px; color: var(--rp-text3); }
        .es-bd-c { margin-left: auto; font-size: 11.5px; color: var(--rp-text3); font-variant-numeric: tabular-nums; }
        .es-bd-b { padding: 9px 12px 11px; }
        /* 分类块：同维度内按类型 / 词条分组，组间以虚线分隔，不叠多层边框 */
        .es-bgrp + .es-bgrp { margin-top: 9px; padding-top: 9px; border-top: 1px dashed #eef1f5; }
        .es-bgrp-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
        .es-bgrp-t { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--rp-text); }
        /* 分类标签：句式类型 / 描写类型 / 词汇·短语标记 */
        .es-bgrp-k { display: inline-block; font-size: 11px; font-weight: 600; color: var(--bd-c); background: var(--bd-bg); border: 1px solid var(--bd-bd); border-radius: 3px; padding: 0 6px; }
        /* 词条本体：高级词汇维度的分类名即词条本身 */
        .es-bgrp-t.is-word { font-size: 13.5px; font-weight: 700; color: var(--bd-c); letter-spacing: .2px; }
        .es-bgrp-c { font-size: 11.5px; color: var(--rp-text3); }
        .es-bgrp-c b { color: var(--rp-text2); font-variant-numeric: tabular-nums; }
        /* 条目行：姓名徽章 + 句子，姓名左挂、句子自适应换行 */
        .es-bq-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
        .es-bq { display: flex; align-items: baseline; gap: 8px; }
        .es-bq-n { flex: 0 0 auto; font-size: 12px; font-weight: 600; color: var(--bd-c); background: var(--bd-bg); border: 1px solid var(--bd-bd); border-radius: 3px; padding: 1px 8px; white-space: nowrap; }
        .es-bq-s { font-size: 13px; color: var(--rp-text); line-height: 1.75; }
        .es-bq-s em { font-style: normal; font-weight: 700; color: var(--bd-c); }
        /* ── 模块 7「优秀范文」：班级最高分学生的成篇范文（原稿 / 润色后对照）── */
        .es-model { border: 1px solid var(--rp-primary-bd); border-radius: var(--rp-radius); background: #fff; overflow: hidden; }
        .es-model-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 9px 13px; background: var(--rp-primary-bg); border-bottom: 1px solid var(--rp-primary-bd); }
        .es-model-who { font-size: 14px; font-weight: 700; color: var(--rp-primary); }
        .es-model-meta { font-size: 12px; color: var(--rp-text2); }
        .es-model-meta b { color: var(--rp-text); font-variant-numeric: tabular-nums; }
        /* 并列最高分时的学生切换 tab（仅多人并列时出现）；面板用 hidden 切换，打印只输出当前选中的一位 */
        .es-model-tabs { display: inline-flex; align-items: center; gap: 5px; }
        .es-model-tab { padding: 3px 11px; border: 1px solid var(--rp-primary-bd); border-radius: 12px; background: #fff; color: var(--rp-text2); font: inherit; font-size: 12px; font-weight: 600; line-height: 1.6; cursor: pointer; }
        .es-model-tab:hover { color: var(--rp-primary); border-color: var(--rp-primary); }
        .es-model-tab.on { color: #fff; background: var(--rp-primary); border-color: var(--rp-primary); }
        .es-model-pane[hidden] { display: none; }
        .es-model-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border-top: 1px solid #f0f2f5; }
        .es-model-col { padding: 11px 14px 14px; }
        .es-model-col + .es-model-col { border-left: 1px dashed #e4e8ef; background: #fbfcfe; }
        .es-model-col-t { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--rp-text2); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #f0f2f5; }
        .es-model-col.is-pol .es-model-col-t { color: var(--rp-primary); }
        .es-model-col-t small { font-weight: 400; color: var(--rp-text3); }
        .es-model-p { font-size: 13px; line-height: 1.95; color: var(--rp-text); margin: 0 0 10px; text-align: justify; }
        .es-model-p:last-child { margin-bottom: 0; }
        .es-model-col:not(.is-pol) .es-model-p { color: var(--rp-text2); }
        .es-model-sign { margin-top: 12px; font-size: 13px; line-height: 1.75; color: var(--rp-text2); text-align: right; }
        /* 按钮统一走 report.css 的 .rp-btn.sm，不再维护私有 .es-btn-sm */
        /* 空态：一行提示的常规呼吸量，不靠空白撑高度 */
        .es-empty { padding: 12px 16px; text-align: center; color: var(--rp-text3); font-size: 13px; }
        /* ── 评分维度卡（两科共用）：三维横向三列，每卡 = 维度头（名称 + 得分/满分）+ 内容区
             语文卡内是子项行（名称 / 条 / 百分比）；英语无子项，卡内只一条得分率通栏（.cn-dim-rate） ── */
        .cn-dims { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--rp-sub); }
        .cn-dim { border: 1px solid #ebeef5; border-radius: var(--rp-radius); padding: 0 14px 9px; background: #fff; }
        .cn-dim-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 10px 0 8px; border-bottom: 1px solid #f0f2f5; }
        .cn-dim-n { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
        .cn-dim-n i { width: 3px; height: 14px; border-radius: 2px; }
        .cn-dim-s { font-size: 22px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
        .cn-dim-s small { margin-left: 1px; font-size: 12px; font-weight: 500; color: var(--rp-text3); }
        .cn-it { display: grid; grid-template-columns: 74px minmax(0, 1fr) 46px; column-gap: 14px; align-items: center; padding-top: 8px; }
        .cn-it-n { font-size: 13px; color: var(--rp-text); }
        .cn-bar { height: 6px; border-radius: 3px; background: #eef1f5; overflow: hidden; }
        .cn-bar i { display: block; height: 100%; border-radius: 3px; }
        .cn-it-v { font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
        .cn-it-v small { font-size: 11px; font-weight: 500; color: var(--rp-text3); }
        /* 英语三维卡：复用 .cn-dim 维度卡，但无 13 子项，卡内只放一条得分率通栏 */
        .cn-dim-rate { display: flex; align-items: center; gap: 12px; padding-top: 11px; }
        .cn-dim-rate .cn-bar { flex: 1 1 auto; height: 8px; }
        .cn-dim-rate .cn-it-v { flex: 0 0 auto; min-width: 36px; }
        /* 维度卡补充（模块 3，两科共用）：英语另有年级对比行；两科维度卡底部均挂星级分层名单（5 档） */
        .cn-dim-cmp { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 8px; font-size: 11.5px; color: var(--rp-text3); }
        .cn-dim-cmp b { color: var(--rp-text2); font-variant-numeric: tabular-nums; }
        .cn-dim-cmp .up { color: #389e0d; font-weight: 600; }
        .cn-dim-cmp .down { color: #d46b08; font-weight: 600; }
        .cn-dim-cmp .flat { color: var(--rp-text3); }
        .cn-dim-cmp .n { color: var(--rp-text3); }
        .cn-stars { margin-top: 9px; padding-top: 8px; border-top: 1px dashed #eef1f5; display: flex; flex-direction: column; gap: 3px; }
        .cn-star-row { display: grid; grid-template-columns: 58px 40px minmax(0, 1fr); gap: 6px; align-items: baseline; font-size: 11.5px; }
        .cn-star-row.is-empty { opacity: .45; }
        .cn-star-n { color: #fa8c16; font-size: 11px; letter-spacing: .5px; white-space: nowrap; }
        .cn-star-c { color: var(--rp-text2); font-variant-numeric: tabular-nums; }
        .cn-star-ls { color: var(--rp-text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* ── KPI 卡悬停名单（未交 / 无报告 / 最高分）：整卡 hover 或键盘聚焦触发，打印不出现 ── */
        .kpi-tipable { position: relative; cursor: help; }
        .kpi-tipable:hover, .kpi-tipable:focus { border-color: var(--rp-primary-bd); outline: none; }
        /* 卡头角标：提示“卡内还有一层名单”，不抢主数字 */
        .kpi-tipable .k-lb::after { content: '▾'; margin-left: 1px; font-size: 10px; line-height: 1; color: var(--rp-text3); opacity: .8; }
        /* k-ref 里的量化数字（人数 / 并列数 / 最低分）：蓝色高亮，与说明文字拉开层级 */
        .k-ref .k-num { font-style: normal; font-weight: 700; color: var(--rp-primary); font-variant-numeric: tabular-nums; }
        .k-tip { display: none; position: absolute; left: 0; top: calc(100% + 4px); z-index: 40; width: max-content; max-width: 264px;
            padding: 6px 9px; border: 1px solid var(--rp-border); border-radius: var(--rp-radius); background: #fff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .1); font-size: 12px; line-height: 1.6; color: var(--rp-text2); text-align: left; cursor: default; }
        .kpi-tipable:hover .k-tip, .kpi-tipable:focus .k-tip, .kpi-tipable:focus-within .k-tip { display: block; }
        .k-tip .kt-b + .kt-b { margin-top: 5px; padding-top: 5px; border-top: 1px solid #f2f4f7; }
        .k-tip .kt-h { display: block; font-weight: 600; color: var(--rp-text); }
        .k-tip .kt-l { display: block; }
        .k-tip i { margin-left: 2px; font-style: normal; font-size: 11px; color: var(--rp-text3); }
        .k-tip i.na { margin-left: 0; }
        /* ── 汇总结论：取消表格样式，纯文本逐条单行（判定项：结论（本次取值））——
              无外框 / 无分隔线 / 无列对齐，判定规则统一收进标题旁「?」 ── */
        .es-cl { margin-top: var(--rp-sub); }
        .es-cl-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 13px; line-height: 1.6; margin-bottom: 2px; }
        .es-cl-tag { flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--rp-primary); background: var(--rp-primary-bg); border: 1px solid var(--rp-primary-bd); border-radius: 3px; padding: 1px 7px; }
        .es-cl-h b { font-weight: 600; }
        .es-cl-l { margin: 0; font-size: 13px; line-height: 1.9; color: var(--rp-text2); }
        .es-cl-l b { font-weight: 600; color: var(--rp-text); }
        .es-cl-l .cc { font-weight: 600; color: var(--rp-text); }
        .es-cl-l .cv { color: var(--rp-text3); font-variant-numeric: tabular-nums; }
        .es-cl-l.hit .cc { color: var(--rp-warn); }
        /* ── 分数分段（语文一~五类文 / 英语第一~五档）：分段条 + 可点段标签 + 段内名单 ── */
        .es-seg-bar { display: flex; gap: 2px; height: 30px; }
        .es-seg-part { flex: 1 1 0; min-width: 4px; padding: 0; border: 0; border-radius: 3px; overflow: hidden; color: #fff; font: inherit; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; text-shadow: 0 1px 1px rgba(0, 0, 0, .28); }
        .es-seg-part:hover { filter: brightness(1.06); }
        /* 选中态：白描边 + 一圈灰环，在彩色条上仍可辨 */
        .es-seg-part.on { box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--rp-text3); }
        .es-seg-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .es-seg-tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--rp-border); border-radius: var(--rp-radius); background: #fff; color: var(--rp-text2); font: inherit; font-size: 12px; cursor: pointer; }
        .es-seg-tag i { align-self: center; width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
        .es-seg-tag b { font-size: 13px; font-weight: 700; color: var(--rp-text); font-variant-numeric: tabular-nums; }
        .es-seg-tag small { font-size: 11px; color: var(--rp-text3); font-variant-numeric: tabular-nums; }
        .es-seg-tag:hover { border-color: var(--rp-primary-bd); color: var(--rp-primary); }
        .es-seg-tag.on { background: var(--rp-primary-bg); border-color: var(--rp-primary-bd); color: var(--rp-primary); font-weight: 600; }
        .es-seg-tag.on b { color: var(--rp-primary); }
        /* 空段：仍列出以显示分布缺口，但灰显不可点 */
        .es-seg-tag.off { opacity: .42; cursor: default; }
        .es-seg-tag.off:hover { border-color: var(--rp-border); color: var(--rp-text2); }
                /* 段内名单：一格一人的卡片块。姓名与分数锁在同一块内（块边界即分组边界），
                   下方进度条示意该生得分率；避免多列并排时把 A 的姓名与 B 的分数读成一组 */

        /* ════════ 英语聚合 ════════ */
        function aggEn(valid) {
            var dims = ['content', 'language', 'structure'].map(function (k) {
                var sum = valid.reduce(function (a, s) { return a + s.dims[k]; }, 0);
                var fsum = valid.reduce(function (a, s) { return a + s.dimFull[k]; }, 0);
                return { k: k, sum: sum, full: fsum, rate: fsum ? Math.round(sum / fsum * 1000) / 10 : 0 };
            });
            /* 高频错误：按类型聚合人次 + 涉及学生 */
            var typeMap = {};
            valid.forEach(function (s) {
                s.errors.forEach(function (e) {
                    if (!typeMap[e.type]) typeMap[e.type] = { type: e.type, cnt: 0, stus: {}, sample: e };
                    typeMap[e.type].cnt++;
                    typeMap[e.type].stus[s.examNum] = s.name;
                });
            });
            var errTypes = Object.keys(typeMap).map(function (k) {
                var t = typeMap[k];
                return {
                    type: t.type, cnt: t.cnt, stuN: Object.keys(t.stus).length,
                    stuNames: Object.keys(t.stus).map(function (x) { return t.stus[x]; }),
                    sample: t.sample
                };
            }).sort(function (a, b) { return b.cnt - a.cnt; });
            /* 典型错误例句：例句出自单个学生的卷面，不存在「一句多人」的统计维度，
               因此不再按同句合并、不再统计同句人数：
               类内按学生出现顺序收录，同一原句只保留首次出现（作者即首次写到的学生），
               每条例句挂一位作者；类间按人次降序（与模块 4 同源）。 */
            var sentGrp = {};
            valid.forEach(function (s) {
                s.errors.forEach(function (e) {
                    if (!sentGrp[e.type]) sentGrp[e.type] = [];
                    var list = sentGrp[e.type], i;
                    for (i = 0; i < list.length; i++) {
                        if (list[i].original === e.original) return;   /* 同句已收录 */
                    }
                    list.push({ original: e.original, correction: e.correction, note: e.note, author: s.name });
                });
            });
            /* 类序跟随 errTypes（已按人次降序），保证模块 4 柱形与模块 5 分组的类序一致 */
            var errGroups = errTypes.filter(function (t) { return sentGrp[t.type]; }).map(function (t) {
                return { type: t.type, cnt: t.cnt, stuN: t.stuN, stuNames: t.stuNames, sents: sentGrp[t.type] };
            });
            return { dims: dims, errTypes: errTypes, errGroups: errGroups };
        }

        /* ════════ 模块 6「学生佳句」：三维归一化与分组 ════════
           1) 高级句式：syntax_type 按关键词归一化后再分组
              （倒装句 / not only 倒装 / so 倒装 / 让步倒装 → 倒装）
           2) 高级词汇：word.trim().toLowerCase() 作 group key（连字符与多余空白折成空格），
              展示保留首次出现的原始大小写（take part in / Take part in / take-part-in 归为同一条目）
           3) 生动描写：description_type 为受控枚举（action / psychology / environment / dialogue），直接映射中文
           三类维度互不混排，各自成块；组内每条句子都挂上写作该句的学生姓名 */
        function enSynCanon(t) {
            t = String(t == null ? '' : t).trim();
            for (var i = 0; i < RP_EN_SYN_CANON.length; i++) {
                if (RP_EN_SYN_CANON[i].re.test(t)) return RP_EN_SYN_CANON[i].k;
            }
            return t.replace(/句$/, '') || '其他';
        }
        /* 词条 group key：去首尾空格 + 统一小写；连字符与多余空白折成空格，
           使 take part in / Take part in / take-part-in 归为同一条目 */
        function enVocabKey(w) {
            return String(w == null ? '' : w).trim().toLowerCase()
                .replace(/[-‐‑–—]/g, ' ').replace(/\s+/g, ' ').trim();
        }
        /* 词条展示名：保留首次出现的原始大小写，连字符按空格呈现，保证组名与句中写法一致 */
        function enVocabLabel(w) {
            return String(w == null ? '' : w).trim()
                .replace(/[-‐‑–—]/g, ' ').replace(/\s+/g, ' ').trim();
        }
        /* 词汇 / 短语判定基于归一化后的 group key（连字符视作空格），保证同一词条不同写法判定一致 */
        function enVocabKind(key) {
            var t = String(key || '').replace(/[-‐‑–—]/g, ' ').replace(/\s+/g, ' ').trim();
            if (RP_EN_VOCAB_SINGLE.indexOf(t) >= 0) return 'word';
            return t.split(' ').length > 1 ? 'phrase' : 'word';
        }
        function aggEnBest(valid) {
            var synMap = {}, synSeq = [], vocMap = {}, vocSeq = [], desMap = {}, desSeq = [];
            function put(map, seq, k, label, s, text, raw) {
                if (!k) return;
                if (!map[k]) { map[k] = { key: k, label: label, items: [], seen: {} }; seq.push(k); }
                var g = map[k], sig = s.examNum + '|' + text;
                if (g.seen[sig]) return;
                g.seen[sig] = 1;
                g.items.push({ name: s.name, examNum: s.examNum, text: text, raw: raw });
            }
            valid.forEach(function (s) {
                (s.syntax || []).forEach(function (y) {
                    var k = enSynCanon(y.syntax_type);
                    put(synMap, synSeq, k, k, s, y.sentence, y.syntax_type);
                });
                (s.vocab || []).forEach(function (v) {
                    var k = enVocabKey(v.word);
                    if (!k) return;
                    put(vocMap, vocSeq, k, enVocabLabel(v.word), s, v.sent || '', v.word);
                });
                (s.descriptions || []).forEach(function (d) {
                    if (!RP_EN_DESC_LABEL[d.description_type]) return;
                    put(desMap, desSeq, d.description_type, RP_EN_DESC_LABEL[d.description_type], s, d.sentence, d.description_type);
                });
            });
            function stamp(g) {
                var n = {};
                g.items.forEach(function (x) { n[x.examNum] = 1; });
                g.n = Object.keys(n).length;
                delete g.seen;
                return g;
            }
            function finish(seq, map) {
                return seq.map(function (k) { return stamp(map[k]); }).sort(function (a, b) { return b.n - a.n; });
            }
            return {
                syn: finish(synSeq, synMap),
                voc: finish(vocSeq, vocMap),
                /* 生动描写按受控枚举固定顺序，不按人数排：避免同一批描写因人数抖动在页面上跳来跳去 */
                des: RP_EN_DESC_ORDER.map(function (t) { return desMap[t]; }).filter(Boolean).map(function (g) { return stamp(g); })
            };
        }
        /* ── 词条高亮：容忍词形变体，避免同一模块内有的组有高亮、有的组没有 ──
           ① 词条开头的系动词 / 助动词剥掉，只留核心短语（be devoted to → devoted to）；
           ② 首个词元允许常见屈折变化（take → takes / took / taking / taken；overcome → overcame）；
           ③ 省略号按「前后两段 + 短间隔」处理（take ... into account）；
           ④ 词元之间允许空格或连字符，故 take part in 与 take-part-in 两种写法都能命中 */
        var RP_EN_VINF = {
            'take': 'take|takes|took|taking|taken',
            'make': 'make|makes|made|making',
            'give': 'give|gives|gave|giving|given',
            'get': 'get|gets|got|getting',
            'put': 'put|puts|putting',
            'overcome': 'overcome|overcomes|overcame|overcoming',
            'become': 'become|becomes|became|becoming',
            'write': 'write|writes|wrote|writing|written'
        };
        var RP_EN_LEAD_AUX = { 'be': 1, 'being': 1, 'been': 1, 'is': 1, 'are': 1, 'am': 1, 'was': 1, 'were': 1 };
        /* 词元 → 正则片段：首个词元可屈折，其余按字面；词元之间允许空格或连字符 */
        function esHiTokens(toks, flexHead) {
            return toks.map(function (x, idx) {
                if (flexHead && idx === 0) {
                    var w = x.toLowerCase();
                    if (RP_EN_VINF[w]) return '(?:' + RP_EN_VINF[w] + ')';
                    return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*';
                }
                return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }).join('[\\s\\-]+');
        }
        /* 词条 → 高亮正则；无法安全匹配时返回 null（该组不高亮） */
        function esHiPattern(p) {
            if (p.indexOf('...') >= 0) {
                var segs = p.split('...').map(function (x) { return x.trim(); }).filter(Boolean);
                if (segs.length < 2) return null;
                var first = segs[0].split(' ').filter(Boolean);
                var last = segs[segs.length - 1].split(' ').filter(Boolean);
                if (!first.length || !last.length) return null;
                return esHiTokens(first, true) + '[\\s\\S]{0,80}?' + esHiTokens(last, false);
            }
            /* 其它含符号的词条不参与高亮，避免误伤 */
            if (/[^A-Za-z ]/.test(p)) return null;
            var toks = p.split(' ').filter(Boolean);
            if (!toks.length) return null;
            while (toks.length > 1 && RP_EN_LEAD_AUX[toks[0].toLowerCase()]) toks.shift();
            return esHiTokens(toks, true);
        }
        function esHiWord(text, label, key) {
            var e = esc(text);
            var cands = [label, key];
            for (var i = 0; i < cands.length; i++) {
                var p = String(cands[i] == null ? '' : cands[i]).trim()
                    .replace(/[-‐‑–—]/g, ' ').replace(/\s+/g, ' ').trim();
                if (!p) continue;
                var pat = esHiPattern(p);
                if (!pat) continue;
                var out = e.replace(new RegExp('(' + pat + ')', 'gi'), '<em>$1</em>');
                if (out !== e) return out;
            }
            return e;
        }

        /* ════════ 语文聚合 ════════ */
        function aggCn(valid) {
            var dims = ['content', 'expression', 'development'].map(function (k) {
                var sum = valid.reduce(function (a, s) { return a + s.dims[k]; }, 0);
                var fsum = valid.reduce(function (a, s) { return a + s.dimFull[k]; }, 0);
                return { k: k, sum: sum, full: fsum, rate: fsum ? Math.round(sum / fsum * 1000) / 10 : 0 };
            });
            /* 13 子项：班级平均 pct */
            var items = [];
            Object.keys(RP_CN_DIM_ITEMS).forEach(function (k) {
                RP_CN_DIM_ITEMS[k].forEach(function (it) {
                    var sum = valid.reduce(function (a, s) { return a + (s.items[it] || 0); }, 0);
                    items.push({ k: it, dim: k, rate: valid.length ? Math.round(sum / valid.length) : 0 });
                });
            });
            /* 类文分布 */
            var grades = ['一类文', '二类文', '三类文', '四类文', '五类文'].map(function (g, i) {
                return { g: g, v: valid.filter(function (s) { return s.level === g; }).length, color: ['#95de64', '#8fb5fa', '#ffbf00', '#fa8c16', '#cf1322'][i] };
            });
            /* 扣分明细：按类型聚合人次与合计扣分 */
            var dedMap = {};
            valid.forEach(function (s) {
                s.deductions.forEach(function (d) {
                    if (!dedMap[d.type]) dedMap[d.type] = { type: d.type, cnt: 0, sum: 0 };
                    dedMap[d.type].cnt++;
                    dedMap[d.type].sum += -d.deduction;
                });
            });
            var deds = Object.keys(dedMap).map(function (k) { return dedMap[k]; }).sort(function (a, b) { return b.cnt - a.cnt; });
            /* 旁批问题（排除亮点）与亮点：按类型聚合 */
            var annoMap = {}, hlMap = {};
            valid.forEach(function (s) {
                s.annos.forEach(function (a) {
                    var m = a.type === 'highlight' ? hlMap : annoMap;
                    if (!m[a.type]) m[a.type] = { type: a.type, cnt: 0, stus: {}, texts: {} };
                    m[a.type].cnt++;
                    m[a.type].stus[s.examNum] = 1;
                    m[a.type].texts[a.text] = 1;
                });
            });
            function annoRows(m) {
                return Object.keys(m).map(function (k) {
                    var t = m[k];
                    return { type: t.type, cnt: t.cnt, stuN: Object.keys(t.stus).length, texts: Object.keys(t.texts).slice(0, 2) };
                }).sort(function (a, b) { return b.cnt - a.cnt; });
            }
            /* 共性亮点 / 建议：按文案计数 */
            function textCnt(field) {
                var m = {};
                valid.forEach(function (s) { s[field].forEach(function (t) { m[t] = (m[t] || 0) + 1; }); });
                return Object.keys(m).map(function (k) { return { text: k, n: m[k] }; }).sort(function (a, b) { return b.n - a.n; });
            }
            /* 润色精选：低中分学生的润色对照更有讲评价值 → 按学生得分升序取样 */
            var polish = [];
            valid.slice().sort(function (a, b) { return a.score - b.score; }).forEach(function (s) {
                s.polish.forEach(function (p) { polish.push({ original: p.original, polished: p.polished, method: p.method, name: s.name, score: s.score }); });
            });
            return {
                dims: dims, items: items, grades: grades, deds: deds,
                annos: annoRows(annoMap), highlights: annoRows(hlMap),
                strengths: textCnt('strengths'), weaknesses: textCnt('weaknesses'),
                polish: polish.slice(0, 6)
            };
        }

        /* ════════ 题目切换条 ════════ */
        /* 题号标签：纯数字题号显示「第 N 题」，非数字（如「第一节」）原样显示，避免「第 第一节 题」 */
        function noLabel(no) { return /^\d+$/.test(no) ? '第 ' + no + ' 题' : no; }
        function qbarHtml() {
            var pills = QS.length > 1

        document.getElementById('esQToggle').addEventListener('click', function () {

        document.getElementById('rp-main').addEventListener('click', function (e) {

        });
        /* 模块 7 优秀范文：并列最高分时切 tab → 头部信息、两栏内容与「查看该生智批报告」入口同步切换 */
        document.getElementById('rp-main').addEventListener('click', function (e) {
            var tab = e.target.closest('[data-m7tab]');
            if (!tab) return;
            var wrap = tab.closest('.es-model');
            if (!wrap) return;
            var idx = tab.getAttribute('data-m7tab');
            var tabs = wrap.querySelectorAll('[data-m7tab]'), i;
            for (i = 0; i < tabs.length; i++) {
                var on = tabs[i] === tab;
                tabs[i].classList.toggle('on', on);
                tabs[i].setAttribute('aria-selected', on ? 'true' : 'false');
            }
            var panes = wrap.querySelectorAll('[data-m7pane]');
            for (i = 0; i < panes.length; i++) panes[i].hidden = panes[i].getAttribute('data-m7pane') !== idx;
            var src = wrap.querySelector('[data-m7src="' + idx + '"]');
            var meta = wrap.querySelector('[data-m7meta]');
            if (src && meta) meta.innerHTML = src.innerHTML;
            var vb = wrap.querySelector('[data-m7view]');
            if (vb && src) { vb.dataset.name = src.dataset.name; vb.dataset.num = src.dataset.num; }
        });

            var seg = SEG.filter(function (s) { return s.k === k && s.v; })[0];
            if (!box || !seg) return;
            var btns = box.querySelectorAll('[data-seg]'), i;
            for (i = 0; i < btns.length; i++) {
                var on = btns[i].getAttribute('data-seg') === k;
                if (on) btns[i].classList.add('on'); else btns[i].classList.remove('on');
                if (btns[i].className.indexOf('es-seg-tag') >= 0) btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
            }
            box.querySelector('.es-seg-now').textContent = seg.k;

            box.querySelector('.es-seg-body').innerHTML = segStuHtml(seg.stus);
        });
        /* KPI 名单浮层：靠右 / 靠边时把浮层拉回可视区内（窄屏双列时右列不再被推出屏幕） */
        function placeKpiTip(k) {
            var tip = k.querySelector('.k-tip');
            if (!tip) return;
            var kr = k.getBoundingClientRect(), vw = document.documentElement.clientWidth;
            /* display:none 时量不到宽度：同步开→量→关，不进渲染帧，不会闪 */
            var tw = tip.offsetWidth;
            if (!tw) { tip.style.display = 'block'; tw = tip.offsetWidth; tip.style.display = ''; }
            var pad = 8, left = 0;
            if (!tw) return;
            if (kr.left + tw > vw - pad) left = vw - pad - tw - kr.left;
            if (kr.left + left < pad) left = pad - kr.left;
            tip.style.left = Math.round(left) + 'px';
        }
        document.getElementById('rp-main').addEventListener('mouseover', function (e) {
            var k = e.target.closest && e.target.closest('.kpi-tipable');
            if (k) placeKpiTip(k);
        });

            var k = e.target.closest && e.target.closest('.kpi-tipable');

                g.click();
            }

<script data-proto-review="appearance">

        ['#191919', '黑色'], ['#1684fc', '蓝色'], ['#8a38f5', '紫色'], ['#666666', '灰色'],
        ['#fbfbfb', '白色'], ['#ec4954', '红色'], ['#ff9f29', '橙色']

        [DEFAULT_PIN, '默认蓝色'],
        ['#acbcd1', '灰蓝'], ['#ff9e93', '珊瑚'], ['#ff9e47', '橙色'], ['#fdd143', '黄色'], ['#9dc4ff', '浅蓝'],

    function pinColor(note) {

        if (orderKey !== lastOrder || staleKey !== lastStale || state !== lastState) {

            R.onSync?.(Object.fromEntries(arranged.map(n => [n.id, n.displayNumber])), state, stale);
        }
    }

    document.addEventListener('proto-anchors:reveal-failed', layout);

    // 关闭弹窗和显示入口可能保持 HTML 字符数不变；监听真实 DOM 变化。
    // 过滤自有层，避免重建序号 / 拖动浮窗时反过来触发无限重排。
    if (typeof MutationObserver !== 'undefined') {
        new MutationObserver(records => { if (records.some(record => !owned(record.target))) scheduleLayout(); })
            .observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true,
                attributeFilter: ['class', 'style', 'hidden', 'open', 'aria-expanded', 'aria-hidden', 'inert', 'data-proto-state'] });
    }
    for (const event of ['transitionend', 'animationend', 'load'])
        document.addEventListener(event, e => { if (!owned(e.target)) scheduleLayout(); }, true);
    document.fonts?.ready.then(scheduleLayout);

    setInterval(() => {
        if (stateOf() !== lastState || scrollX !== lastX || scrollY !== lastY ||
            innerWidth !== lastW || innerHeight !== lastH) {
            lastX = scrollX; lastY = scrollY; lastW = innerWidth; lastH = innerHeight;
            layout();
        }
    }, 350);

    layout();
})();

</script>
</body>
</html>
